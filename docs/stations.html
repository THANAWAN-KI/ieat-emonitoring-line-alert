<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>สถานีออนไลน์ | IEAT e-Monitoring</title>
<style>
:root{--primary:#6B3F91;--primary-dark:#4D286F;--primary-soft:#F2EDF7;--border:#D9C9E7;--canvas:#F1EDF4;--page:#FAF8FC;--text:#30283A;--muted:#746B7B;--green:#159B6B;--green-dark:#087651;--green-soft:#ECF8F2;--red:#D92D3F;--red-dark:#A61B2B;--red-soft:#FFF1F3;--blue:#5A6FAE;--blue-dark:#40558C}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif}.page{width:100%;max-width:720px;min-height:100vh;margin:0 auto;background:var(--page)}.header{display:flex;align-items:center;gap:14px;padding:18px;background:#fff;border-bottom:4px solid var(--primary)}.logo{flex-shrink:0;width:72px;height:72px;object-fit:contain}.header-title{margin:0;color:var(--primary-dark);font-size:23px;font-weight:750}.header-subtitle{margin:5px 0 0;color:var(--muted);font-size:14px;line-height:1.5}.content{padding:16px}.loading,.error,.empty{padding:36px 15px;color:var(--muted);text-align:center}.error{color:var(--red-dark)}.hidden{display:none!important}.notice{padding:14px;background:var(--primary-soft);border-left:4px solid var(--primary);border-radius:10px;font-size:14px;line-height:1.65}.section-title{margin:24px 0 12px;color:var(--text);font-size:20px;line-height:1.4}.section-title::before{display:inline-block;width:4px;height:22px;margin-right:9px;background:var(--primary);border-radius:4px;vertical-align:-3px;content:""}.total-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.total-card{padding:16px 8px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 8px rgba(77,40,111,.08);text-align:center}.total-card.online{background:var(--green-soft);border-color:#BDE7D4}.total-card.offline{background:var(--red-soft);border-color:#F0BBC2}.total-number{display:block;color:var(--primary-dark);font-size:27px;font-weight:800}.total-card.online .total-number,.count-item.online .count-value{color:var(--green-dark)}.total-card.offline .total-number,.count-item.offline .count-value{color:var(--red-dark)}.total-label,.count-label,.updated{display:block;margin-top:5px;color:var(--muted);font-size:12px}.station-card{margin-bottom:12px;padding:16px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:14px;box-shadow:0 2px 8px rgba(77,40,111,.08)}.station-card.aqms{border-left-color:var(--green)}.station-card.wqms{border-left-color:var(--primary)}.station-card.cems{border-left-color:var(--blue)}.station-type{margin:0;color:var(--primary-dark);font-size:19px;line-height:1.4}.station-card.aqms .station-type{color:var(--green-dark)}.station-card.cems .station-type{color:var(--blue-dark)}.station-counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.count-item{padding:11px 6px;background:var(--page);border-radius:10px;text-align:center}.count-value{display:block;color:var(--text);font-size:21px;font-weight:800}.updated{margin:22px 0 12px;text-align:center;font-size:13px}.refresh-button{width:100%;padding:14px;color:#fff;background:var(--primary-dark);border:0;border-radius:10px;font:inherit;font-size:16px;font-weight:bold;cursor:pointer}.refresh-button:active{opacity:.85}@media(max-width:480px){.header{padding:14px}.logo{width:60px;height:60px}.header-title{font-size:20px}.content{padding:12px}}
</style></head>
<body><div class="page"><header class="header"><img class="logo" src="./ieat_logo.png.PNG" alt="โลโก้ กนอ."><div><h1 class="header-title">สถานีออนไลน์</h1><p class="header-subtitle">สรุปสถานะการเชื่อมต่อสถานีตรวจวัด</p></div></header><main class="content"><div id="loading" class="loading">กำลังโหลดข้อมูลสถานี...</div><div id="error" class="error hidden">ไม่สามารถโหลดข้อมูลได้ กรุณากดรีเฟรชอีกครั้ง</div><div id="dashboard" class="hidden"><div class="notice">แสดงสถานะจากข้อมูลล่าสุดของแต่ละสถานี แยกตามประเภท AQMs, WQMs และ CEMs</div><h2 class="section-title">ภาพรวมสถานีตรวจวัด</h2><section class="total-grid"><div class="total-card"><strong id="stationTotal" class="total-number">0</strong><span class="total-label">สถานีทั้งหมด</span></div><div class="total-card online"><strong id="onlineTotal" class="total-number">0</strong><span class="total-label">ONLINE</span></div><div class="total-card offline"><strong id="offlineTotal" class="total-number">0</strong><span class="total-label">OFFLINE</span></div></section><h2 class="section-title">แยกตามประเภทสถานี</h2><div id="stationTypeList"></div><p class="updated">ข้อมูล ณ <span id="updatedAt">-</span></p><button type="button" class="refresh-button" onclick="loadStations()">รีเฟรชข้อมูลล่าสุด</button></div></main></div>
<script>
const TYPES=[{key:"AQMs",css:"aqms"},{key:"WQMs",css:"wqms"},{key:"CEMs",css:"cems"}];
function number(value){return Number.isFinite(Number(value))?Number(value):0}function setText(id,value){document.getElementById(id).textContent=number(value).toLocaleString("th-TH")}
function createTypeCard(type,data){const card=document.createElement("article");card.className="station-card "+type.css;card.innerHTML=`<h3 class="station-type">${type.key}</h3><div class="station-counts"><div class="count-item"><strong class="count-value">${number(data.total).toLocaleString("th-TH")}</strong><span class="count-label">ทั้งหมด</span></div><div class="count-item online"><strong class="count-value">${number(data.online).toLocaleString("th-TH")}</strong><span class="count-label">ONLINE</span></div><div class="count-item offline"><strong class="count-value">${number(data.offline).toLocaleString("th-TH")}</strong><span class="count-label">OFFLINE</span></div></div>`;return card}
async function loadStations(){const loading=document.getElementById("loading"),error=document.getElementById("error"),dashboard=document.getElementById("dashboard");loading.classList.remove("hidden");error.classList.add("hidden");dashboard.classList.add("hidden");try{const response=await fetch("./status.json?t="+Date.now(),{cache:"no-store"});if(!response.ok)throw new Error("HTTP "+response.status);const data=await response.json();setText("stationTotal",data.station_total);setText("onlineTotal",data.online_total);setText("offlineTotal",data.offline_total);document.getElementById("updatedAt").textContent=data.updated_at||"-";const list=document.getElementById("stationTypeList");list.innerHTML="";const types=data.station_types||{};TYPES.forEach(type=>list.appendChild(createTypeCard(type,types[type.key]||{})));loading.classList.add("hidden");dashboard.classList.remove("hidden")}catch(errorData){console.error(errorData);loading.classList.add("hidden");error.classList.remove("hidden")}}
loadStations();
</script></body></html>
