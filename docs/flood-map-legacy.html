<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://js.arcgis.com/3.46/esri/css/esri.css">
<style>html,body,#map{width:100%;height:100%;margin:0}body{font-family:Arial,sans-serif}.tool{position:absolute;right:12px;top:90px;z-index:10;display:flex;flex-direction:column;gap:5px}button{background:#fff;border:1px solid #bdcbd4;box-shadow:0 2px 9px #0002;width:38px;height:38px;padding:0;cursor:pointer;font-size:20px}#layersPanel,#legendPanel{position:absolute!important;right:56px!important;top:90px!important;z-index:11!important;z-index:11;width:min(320px,calc(100% - 24px));max-height:65%;overflow:auto;background:#fff;box-shadow:0 4px 18px #0003;padding:12px;display:none}#layersPanel.open,#legendPanel.open{display:block!important}.error{position:absolute;left:12px;bottom:12px;z-index:12;background:#fff;padding:10px;display:none}</style>
<script src="https://js.arcgis.com/3.46/"></script></head>
<body class="claro"><div id="map"></div><div class="tool"><button id="layersButton" type="button" title="ชั้นข้อมูล" aria-label="ชั้นข้อมูล">☷</button><button id="legendButton" type="button" title="คำอธิบายสัญลักษณ์" aria-label="คำอธิบายสัญลักษณ์">▤</button></div><div id="layersPanel" class="panel"></div><div id="legendPanel" class="panel"></div><div id="error" class="error">โหลดแผนที่ไม่สำเร็จ <a href="https://ieat.maps.arcgis.com/apps/mapviewer/index.html?webmap=3d24287ac6ea49cd823625ddad496e01" target="_blank" rel="noopener">เปิดแผนที่เต็มหน้า</a></div>
<script>
(function(){
 var id="3d24287ac6ea49cd823625ddad496e01",map;
 function showError(){document.getElementById("error").style.display="block"}
 function panel(name){document.getElementById(name+"Button").onclick=function(){["layers","legend"].forEach(function(n){document.getElementById(n+"Panel").classList.toggle("open",n===name&&!document.getElementById(n+"Panel").classList.contains("open"))})}}
 panel("layers");panel("legend");
 require(["esri/arcgis/utils","esri/dijit/LayerList","esri/dijit/Legend","dojo/domReady!"],function(utils,LayerList,Legend){
  utils.createMap(id,"map",{mapOptions:{slider:true,center:[101,13],zoom:5}}).then(function(result){
   map=result.map;map.setBasemap("topo");
   var layers=utils.getLayerList(result);
   var list=new LayerList({map:map,layers:layers},"layersPanel");list.startup();
   var legend=new Legend({map:map,layerInfos:utils.getLegendLayers(result)},"legendPanel");legend.startup();
   require(["esri/layers/GraphicsLayer","esri/graphic","esri/geometry/Point","esri/symbols/SimpleMarkerSymbol","esri/symbols/SimpleLineSymbol","esri/Color","esri/InfoTemplate","esri/geometry/webMercatorUtils","esri/geometry/Extent","esri/geometry/Polygon","esri/geometry/Polyline","esri/symbols/SimpleFillSymbol"],function(GraphicsLayer,Graphic,Point,Marker,Line,Color,InfoTemplate,webMercatorUtils,Extent,Polygon,Polyline,Fill){
    map.setExtent(webMercatorUtils.geographicToWebMercator(new Extent(97,5,106,21,{wkid:4326})),true);
    var sources=[
     {name:"สถานีวัดระดับน้ำแบบเรียลไทม์รายชั่วโมง (กรมชลประทาน)",url:"https://nawakonnakhonchai-wq.github.io/rid-geojson-bot/rid_realtime.geojson",field:"ระดับน้ำเทียบตลิ่ง (%)",steps:[30,70,100,Infinity],colors:[[0,145,205],[89,140,20],[247,144,9],[240,10,54]],labels:["0–30%","มากกว่า 30–70%","มากกว่า 70–100%","มากกว่า 100%"],valueLabel:"ระดับน้ำเทียบตลิ่ง"},
     {name:"ข้อมูลปริมาณน้ำฝนสะสม 24 ชม.",url:"https://nawakonnakhonchai-wq.github.io/Rain_24H/rainfall_24h.geojson",field:"rain_24h",steps:[10,20,35,50,70,90,Infinity],colors:[[153,211,240],[153,240,231],[33,173,2],[235,231,0],[240,155,77],[207,107,8],[179,7,7]],labels:["0–10 มม.","มากกว่า 10–20 มม.","มากกว่า 20–35 มม.","มากกว่า 35–50 มม.","มากกว่า 50–70 มม.","มากกว่า 70–90 มม.","มากกว่า 90 มม."],valueLabel:"ฝนสะสม 24 ชั่วโมง"}
    ];
    function escapeHtml(value){return String(value==null?"–":value).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]})}
    var layerPanel=document.getElementById("layersPanel"),legendPanel=document.getElementById("legendPanel");
    sources.forEach(function(source){
     var layer=new GraphicsLayer({id:source.field==="rain_24h"?"floodRainStations":"floodRidStations",opacity:0.95});
     map.addLayer(layer);
     var row=document.createElement("label");row.style.cssText="display:block;padding:9px 2px;border-bottom:1px solid #eee;cursor:pointer";
     var checkbox=document.createElement("input");checkbox.type="checkbox";checkbox.checked=true;checkbox.style.marginRight="8px";
     checkbox.onchange=function(){layer.setVisibility(checkbox.checked)};
     var title=document.createElement("span");title.textContent=source.name+" (กำลังโหลด)";
     row.appendChild(checkbox);row.appendChild(title);layerPanel.insertBefore(row,layerPanel.firstChild);
     var section=document.createElement("section");section.style.cssText="border-bottom:1px solid #ddd;padding:8px 0";
     var heading=document.createElement("strong");heading.textContent=source.name;section.appendChild(heading);
     source.labels.forEach(function(label,index){
      var key=document.createElement("div");key.style.cssText="display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px";
      var dot=document.createElement("i");dot.style.cssText="display:inline-block;width:10px;height:10px;border-radius:50%;background:rgb("+source.colors[index].join(",")+")";
      var text=document.createElement("span");text.textContent=label;key.appendChild(dot);key.appendChild(text);section.appendChild(key);
     });
     legendPanel.insertBefore(section,legendPanel.firstChild);
     fetch(source.url,{cache:"no-store"}).then(function(response){if(!response.ok)throw Error("HTTP "+response.status);return response.json()}).then(function(data){
      var count=0;
      (data.features||[]).forEach(function(feature){
       if(!feature.geometry||feature.geometry.type!=="Point")return;
       var coords=feature.geometry.coordinates,lon=Number(coords&&coords[0]),lat=Number(coords&&coords[1]);
       if(!isFinite(lon)||!isFinite(lat))return;
       var properties=feature.properties||{},value=Number(properties[source.field]);
       if(!isFinite(value))value=0;
       var index=source.steps.findIndex(function(max){return value<=max});if(index<0)index=source.steps.length-1;
       var color=source.colors[index],outline=new Line(Line.STYLE_SOLID,new Color([30,65,80,0.65]),0.75);
       var symbol=new Marker(Marker.STYLE_CIRCLE,6,outline,new Color(color));
       var point=new Point(lon,lat,{wkid:4326});
       if(map.spatialReference&&map.spatialReference.wkid!==4326)point=webMercatorUtils.geographicToWebMercator(point);
       var graphic=new Graphic(point,symbol,properties);
       var station=properties["ชื่อสถานี"]||properties.station_name||properties.name||source.name;
       graphic.setInfoTemplate(new InfoTemplate(escapeHtml(station),"<b>"+source.valueLabel+":</b> "+escapeHtml(value)+" "+(source.field==="rain_24h"?"มม.":"%")+"<br><b>จังหวัด:</b> "+escapeHtml(properties["จังหวัด"]||properties.province)));
       layer.add(graphic);count++;
      });
      title.textContent=source.name+" ("+count.toLocaleString("th-TH")+" จุด)";
     }).catch(function(error){title.textContent=source.name+" (ข้อมูลยังไม่พร้อม)";console.warn("GeoJSON "+source.name,error)});
    });
    var extraSources=[
     {id:"floodRisk24",name:"พื้นที่เสี่ยงน้ำท่วมฉับพลันใน 24 ชั่วโมงข้างหน้า",url:"https://thanawan-ki.github.io/ieat-emonitoring-line-alert/data/flash_flood_24h.geojson",color:[240,50,30]},
     {id:"floodRisk48",name:"พื้นที่เสี่ยงน้ำท่วมฉับพลันใน 48 ชั่วโมงข้างหน้า",url:"https://thanawan-ki.github.io/ieat-emonitoring-line-alert/data/flash_flood_48h.geojson",color:[191,39,23]},
     {id:"floodHiiRisk",name:"พื้นที่เสี่ยงน้ำท่วม (HII)",url:"https://nawakonnakhonchai-wq.github.io/hii-flood-alert/flashflood.geojson",color:[255,125,0]},
     {id:"floodWebcams",name:"กล้อง Windy",url:"https://raw.githubusercontent.com/THANAWAN-KI/windy-webcam/main/cctv_windy_updated.geojson",color:[47,105,190]}
    ];
    extraSources.forEach(function(source){
     var layer=new GraphicsLayer({id:source.id,opacity:0.85});map.addLayer(layer);
     var row=document.createElement("label");row.style.cssText="display:block;padding:9px 2px;border-bottom:1px solid #eee;cursor:pointer";
     var checkbox=document.createElement("input");checkbox.type="checkbox";checkbox.checked=true;checkbox.style.marginRight="8px";
     checkbox.onchange=function(){layer.setVisibility(checkbox.checked)};
     var title=document.createElement("span");title.textContent=source.name+" (กำลังโหลด)";
     row.appendChild(checkbox);row.appendChild(title);layerPanel.insertBefore(row,layerPanel.firstChild);
     var section=document.createElement("section");section.style.cssText="border-bottom:1px solid #ddd;padding:8px 0";
     var key=document.createElement("div");key.style.cssText="display:flex;align-items:center;gap:8px;font-size:12px";
     var swatch=document.createElement("i");swatch.style.cssText="display:inline-block;width:12px;height:12px;flex:none;border:1px solid #777;background:rgb("+source.color.join(",")+")";
     var label=document.createElement("span");label.textContent=source.name;key.appendChild(swatch);key.appendChild(label);section.appendChild(key);legendPanel.insertBefore(section,legendPanel.firstChild);
     function addShape(type,coordinates,properties){
      if(!coordinates)return 0;
      var geometry,symbol,outline=new Line(Line.STYLE_SOLID,new Color(source.color),1.25);
      if(type==="Point"){geometry=new Point(coordinates[0],coordinates[1],{wkid:4326});symbol=new Marker(Marker.STYLE_CIRCLE,10,outline,new Color(source.color))}
      else if(type==="Polygon"){geometry=new Polygon({rings:coordinates,spatialReference:{wkid:4326}});symbol=new Fill(Fill.STYLE_SOLID,outline,new Color([source.color[0],source.color[1],source.color[2],0.25]))}
      else if(type==="LineString"){geometry=new Polyline({paths:[coordinates],spatialReference:{wkid:4326}});symbol=outline}
      else return 0;
      if(map.spatialReference&&map.spatialReference.wkid!==4326)geometry=webMercatorUtils.geographicToWebMercator(geometry);
      var graphic=new Graphic(geometry,symbol,properties),name=properties.name||properties.Name||properties["จังหวัด"]||properties["ตำบล"]||source.name;
      graphic.setInfoTemplate(new InfoTemplate(escapeHtml(name),Object.keys(properties).slice(0,12).map(function(k){return "<b>"+escapeHtml(k)+":</b> "+escapeHtml(properties[k])}).join("<br>")));
      layer.add(graphic);return 1;
     }
     fetch(source.url,{cache:"no-store"}).then(function(response){if(!response.ok)throw Error("HTTP "+response.status);return response.json()}).then(function(data){
      var count=0;(data.features||[]).forEach(function(feature){
       var g=feature.geometry,p=feature.properties||{};if(!g)return;
       try{
        if(g.type==="MultiPolygon")g.coordinates.forEach(function(part){count+=addShape("Polygon",part,p)});
        else if(g.type==="MultiPoint")g.coordinates.forEach(function(part){count+=addShape("Point",part,p)});
        else if(g.type==="MultiLineString")g.coordinates.forEach(function(part){count+=addShape("LineString",part,p)});
        else count+=addShape(g.type,g.coordinates,p);
       }catch(error){console.warn("Feature "+source.name,error)}
      });
      title.textContent=source.name+" ("+count.toLocaleString("th-TH")+" รายการ)";
     }).catch(function(error){title.textContent=source.name+" (ข้อมูลยังไม่พร้อม)";console.warn("GeoJSON "+source.name,error)});
    });
   });
   window.addEventListener("message",function(event){if(event.origin!==location.origin)return;var p=event.data;if(p&&p.type==="flood-map-zoom"&&isFinite(p.lon)&&isFinite(p.lat))require(["esri/geometry/Point"],function(Point){map.centerAndZoom(new Point(Number(p.lon),Number(p.lat)),10)})});
  },function(error){console.error("WebMap legacy",error);showError()});
 },showError);
})();
</script></body></html>
