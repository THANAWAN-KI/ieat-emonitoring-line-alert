<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://js.arcgis.com/3.46/esri/css/esri.css">
<style>html,body,#map{width:100%;height:100%;margin:0}body{font-family:Arial,sans-serif}.tool{position:absolute;right:12px;top:12px;z-index:10;display:flex;gap:6px}button{background:#fff;border:1px solid #bdcbd4;box-shadow:0 2px 9px #0002;padding:9px 12px;cursor:pointer}.panel{position:absolute;right:12px;top:58px;z-index:11;width:min(320px,calc(100% - 24px));max-height:65%;overflow:auto;background:#fff;box-shadow:0 4px 18px #0003;padding:12px;display:none}.panel.open{display:block}.error{position:absolute;left:12px;bottom:12px;z-index:12;background:#fff;padding:10px;display:none}</style>
<script src="https://js.arcgis.com/3.46/"></script></head>
<body class="claro"><div id="map"></div><div class="tool"><button id="layersButton" type="button">ชั้นข้อมูล</button><button id="legendButton" type="button">คำอธิบายสัญลักษณ์</button></div><div id="layersPanel" class="panel"></div><div id="legendPanel" class="panel"></div><div id="error" class="error">โหลดแผนที่ไม่สำเร็จ <a href="https://ieat.maps.arcgis.com/apps/mapviewer/index.html?webmap=3d24287ac6ea49cd823625ddad496e01" target="_blank" rel="noopener">เปิดแผนที่เต็มหน้า</a></div>
<script>
(function(){
 var id="3d24287ac6ea49cd823625ddad496e01",map;
 function showError(){document.getElementById("error").style.display="block"}
 function panel(name){document.getElementById(name+"Button").onclick=function(){["layers","legend"].forEach(function(n){document.getElementById(n+"Panel").classList.toggle("open",n===name&&!document.getElementById(n+"Panel").classList.contains("open"))})}}
 panel("layers");panel("legend");
 require(["esri/arcgis/utils","esri/dijit/LayerList","esri/dijit/Legend","dojo/domReady!"],function(utils,LayerList,Legend){
  utils.createMap(id,"map",{mapOptions:{slider:true,center:[101,13],zoom:5}}).then(function(result){
   map=result.map;
   window.floodMapItem=result.itemInfo;
   var layers=utils.getLayerList(result);
   var list=new LayerList({map:map,layers:layers},"layersPanel");list.startup();
   var legend=new Legend({map:map,layerInfos:utils.getLegendLayers(result)},"legendPanel");legend.startup();
   window.addEventListener("message",function(event){if(event.origin!==location.origin)return;var p=event.data;if(p&&p.type==="flood-map-zoom"&&isFinite(p.lon)&&isFinite(p.lat))require(["esri/geometry/Point"],function(Point){map.centerAndZoom(new Point(Number(p.lon),Number(p.lat)),10)})});
  },function(error){console.error("WebMap legacy",error);showError()});
 },showError);
})();
</script></body></html>
