<script id="dashboard-reliable-boot">(function(){
 'use strict';
 // Run before deferred app scripts, even if a later script cannot initialize.
 if(window.AbortSignal&&window.AbortController&&!AbortSignal.timeout){
  AbortSignal.timeout=function(ms){var controller=new AbortController();setTimeout(function(){controller.abort();},ms);return controller.signal;};
 }
 var attempts=0,timer;
 function check(){
  var mounted=document.querySelector('#estateFocusDashboard .ef-workspace');
  if(mounted){clearInterval(timer);return;}
  var loading=document.getElementById('dashboardLoading');if(!loading)return;
  loading.style.cssText='display:block!important;position:fixed;top:24px;left:24px;right:24px;max-width:480px;margin:auto;padding:24px;background:white;color:#335238;border:1px solid #ffffff;border-radius:18px;box-shadow:0 8px 28px #2e1f5414;z-index:9999;font:16px/1.7 sans-serif';
  attempts++;
  if(attempts>=12&&!document.getElementById('dashboardRetry')){
   loading.innerHTML='<strong>ยังเปิดข้อมูลไม่สำเร็จ</strong><p>การโหลดอาจติดขัด กรุณาลองอีกครั้ง</p><button type="button" id="dashboardRetry" style="font:inherit;border:0;border-radius:10px;background:#109dc0;color:white;padding:10px 18px;cursor:pointer">โหลดหน้าใหม่</button>';
   document.getElementById('dashboardRetry').onclick=function(){var url=new URL(location.href);url.searchParams.set('reload',Date.now());location.replace(url.href);};
  }
 }
 timer=setInterval(check,1000);
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',check);else check();
})();
</script>

<script id="flood-sequential-script">
/* Only move existing data sections; appearance is defined in the canonical stylesheet. */
(()=>{
let queued=false;
function arrange(){
 queued=false;
 const col=document.querySelector('.ef-data-column');if(!col)return;
 const stations=col.querySelector('.rp-stations');
 if(stations){stations.id='floodStationsSection';const title=stations.querySelector('.rp-stations-title');if(title&&title.textContent!=='สถานีระดับน้ำ')title.textContent='สถานีระดับน้ำ'}
 let dams=document.getElementById('floodDamsSection');
 if(!dams){dams=document.createElement('section');dams.id='floodDamsSection';dams.setAttribute('aria-label','เขื่อนและอ่างเก็บน้ำ');dams.innerHTML='<h2>เขื่อนและอ่างเก็บน้ำ</h2>';col.append(dams)}
 for(const selector of ['.ef-related-dams','.ef-reservoir-panel']){const panel=col.querySelector(selector);if(panel&&panel.parentElement!==dams)dams.append(panel)}
 const flows=document.getElementById('efDamFlowPanel');if(flows&&flows.parentElement!==col)col.append(flows);
 const diagram=document.getElementById('rpMainRiver')?.closest('.rp-new-section');
 if(diagram){diagram.id='floodWaterDiagram';if(diagram.parentElement!==col)col.append(diagram);const title=diagram.querySelector('h3');if(title&&title.textContent!=='ผังน้ำและสถานีตามสายน้ำ')title.textContent='ผังน้ำและสถานีตามสายน้ำ'}
}
new MutationObserver(()=>{if(!queued){queued=true;requestAnimationFrame(arrange)}}).observe(document.getElementById('warning'),{childList:true,subtree:true});arrange();
})();
</script>

<script id="ieat-water-station-carousel-script">
(()=>{
const perPage=1;let page=0,pager=null,lastCards=[];
function render(){
const host=document.getElementById('rpCards');if(!host)return;
const cards=Array.from(host.children).filter(el=>el.matches('.rp-card'));
if(!cards.length)return;
const changed=cards.length!==lastCards.length||cards.some((card,i)=>card!==lastCards[i]);
if(changed){page=0;lastCards=cards.slice()}
const pages=Math.ceil(cards.length/perPage);page=Math.max(0,Math.min(page,pages-1));
