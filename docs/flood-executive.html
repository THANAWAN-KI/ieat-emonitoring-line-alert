</head><body data-executive-standalone="true"><script>if(new URLSearchParams(location.search).get("embed")==="1"){document.body.dataset.executiveEmbedded="true";document.body.classList.add("executive-embedded");}</script><header class="page-head"><div><h1>สรุปนิคมฯ และสถานการณ์น้ำ</h1><p>ใกล้สายน้ำ · ใกล้เขื่อน / อ่างเก็บน้ำ · เข้าเกณฑ์เฝ้าระวัง</p></div><div class="page-actions"><a href="./hub.html">หน้าหลัก ↗</a><a href="./flood-report.html">สถานการณ์น้ำแบบเดิม ↗</a><button id="executiveRefresh" type="button">โหลดข้อมูลใหม่</button></div></header>
<main><p id="executiveLoadStatus" role="status">กำลังโหลดชุดข้อมูลสถานการณ์น้ำ</p><div id="estateFocusDashboard" class="executive-layout"><div class="ef-data-column"></div><section class="executive-map"><h2>ตำแหน่งนิคมฯ และข้อมูลที่เกี่ยวข้อง</h2><iframe id="estateFocusMap" title="แผนที่สรุปนิคมและสถานการณ์น้ำ" src="flood-hydrology-map.html?v=20261007-diagram-plans&amp;center=101,13&amp;scale=9244648"></iframe><p>เลือกรายการ “ดูบนแผนที่” จากตาราง · เส้นประแสดงระยะเส้นตรง</p></section></div></main>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 let busy=false,last=null;
 const status=document.getElementById('executiveLoadStatus'),button=document.getElementById('executiveRefresh');
 async function load(){
  if(busy)return;busy=true;button.disabled=true;status.textContent='กำลังโหลดข้อมูลสถานีและประกาศเฝ้าระวัง';
  try{
   const response=await fetch('./data/thaiwater_latest.json?v='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(30000)});
   if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.estates)||!Array.isArray(data.stations))throw Error('ข้อมูลไม่ครบ');
   try{
    const rid=await window.IEAT_RID.load();if(!Array.isArray(rid)||!rid.length)throw Error('RID ไม่มีข้อมูล');
    const water=rid.map(r=>({...r,kind:'waterlevel',station:r.name,lon:r.lng,observed_at:r.measured_at,waterlevel_msl:r.wl,bankfull_msl:r.bank,severity_score:r.status==='ล้นตลิ่ง'?4:r.status==='ใกล้ตลิ่ง'?2:0}));
    data.stations=[...data.stations.filter(r=>r.kind!=='waterlevel'),...water];data.summary={...data.summary,station_count:data.stations.length};
    status.textContent='ข้อมูลทั่วประเทศ · ปรับปรุงอัตโนมัติทุก 1 ชั่วโมง';
   }catch(error){status.textContent='โหลดระดับน้ำ RID ไม่สำเร็จ · ใช้ค่าจากชุดข้อมูลเดิมเฉพาะที่ผ่านเกณฑ์เวลา';}
   last=data;window.IEAT_FLOOD_EXECUTIVE_DATA=data;document.dispatchEvent(new CustomEvent('ieat-flood-executive-data',{detail:data}));
  }catch(error){
   status.textContent='โหลดข้อมูลรอบใหม่ไม่สำเร็จ'+(last?' · ข้อมูลสถานีเดิมถูกระบุเป็นข้อมูลย้อนหลัง':' · กรุณากดโหลดข้อมูลใหม่');
   if(last)document.dispatchEvent(new CustomEvent('ieat-flood-executive-data',{detail:{...last,status:'stale'}}));
  }finally{busy=false;button.disabled=false;}
 }
 button.addEventListener('click',load);load();setInterval(load,3600000);
});
</script></body></html>
