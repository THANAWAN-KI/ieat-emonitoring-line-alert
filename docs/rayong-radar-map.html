<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>เรดาร์ฝนระยองซ้อนแผนที่ IEAT</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.34/"></script>
<style>
html,body,#viewDiv{margin:0;width:100%;height:100%;font-family:Arial,'Noto Sans Thai',sans-serif}
.panel{position:absolute;top:15px;right:15px;z-index:4;background:#fff;padding:16px;border-radius:14px;box-shadow:0 3px 18px #0003;width:min(315px,calc(100vw - 62px));font-size:14px;line-height:1.5}
h1{font-size:18px;margin:0 0 9px}.control{display:flex;align-items:center;gap:9px;margin:10px 0}.control label{min-width:112px}.control input[type=range]{flex:1;min-width:0}.note{font-size:12px;color:#5e6168;margin:10px 0 0}a{color:#0865a6}button{cursor:pointer;border:0;border-radius:8px;padding:8px;background:#e6f3fb;color:#034872}
#status{font-size:12px;color:#bd3c12;margin-top:8px}
@media(max-width:620px){.panel{top:auto;bottom:15px;right:12px;padding:12px}}
</style>
</head><body>
<div id="viewDiv"></div>
<section class="panel" aria-label="ตัวควบคุมเรดาร์">
<h1>เรดาร์ฝนระยอง · IEAT</h1>
<div class="control"><label for="show">แสดงเรดาร์</label><input type="checkbox" id="show" checked></div>
<div class="control"><label for="opacity">ความโปร่งใส</label><input type="range" id="opacity" min="0" max="100" value="65"><output id="opacityValue">65%</output></div>
<div class="control"><label for="east">เลื่อนตะวันออก</label><input type="range" id="east" min="-30" max="30" value="0"><output id="eastValue">0 กม.</output></div>
<div class="control"><label for="north">เลื่อนเหนือ</label><input type="range" id="north" min="-30" max="30" value="0"><output id="northValue">0 กม.</output></div>
<div class="control"><label for="size">ขนาดภาพ</label><input type="range" id="size" min="85" max="115" value="100"><output id="sizeValue">100%</output></div>
<button id="reset" type="button">คืนค่าตำแหน่ง</button>
<p class="note">ตำแหน่งเรดาร์เทียบจากวงรัศมี 240 กม. และแผนที่ในภาพต้นฉบับ เป็นการวางโดยประมาณ โปรดใช้ <a href="https://weather.tmd.go.th/rygloop.php" target="_blank" rel="noopener">ภาพต้นฉบับ TMD</a> ตรวจเวลาและตำแหน่งก่อนใช้ตัดสินใจ</p>
<div id="status" role="status"></div>
</section>
<script>
require(["esri/WebMap","esri/views/MapView","esri/layers/MediaLayer","esri/layers/support/ImageElement","esri/layers/support/ExtentAndRotationGeoreference","esri/geometry/Extent"],function(WebMap,MapView,MediaLayer,ImageElement,ExtentAndRotationGeoreference,Extent){
  const $=id=>document.getElementById(id);
  const webmap=new WebMap({portalItem:{id:"3d24287ac6ea49cd823625ddad496e01",portal:{url:"https://ieat.maps.arcgis.com"}}});
  const view=new MapView({container:"viewDiv",map:webmap});
  const radar=new MediaLayer({title:"เรดาร์ฝนระยอง (TMD)",opacity:.65,visible:true});
  // The source is an 800x800 crop of TMD's 240 km radar circle, centered near pixel 410,395.
  // Pixel resolution on the source graphic is approximately 0.599 km/pixel.
  function extent(){
    const dx=Number($("east").value),dy=Number($("north").value),s=Number($("size").value)/100;
    const centerLon=101.28+dx/(111.2*Math.cos(12.68*Math.PI/180)),centerLat=12.68+dy/111.2;
    const lonPerPixel=.599*s/(111.2*Math.cos(12.68*Math.PI/180)),latPerPixel=.599*s/111.2;
    return new Extent({xmin:centerLon-410*lonPerPixel,xmax:centerLon+390*lonPerPixel,
      ymin:centerLat-405*latPerPixel,ymax:centerLat+395*latPerPixel,spatialReference:{wkid:4326}});
  }
  function updateSource(){
    const image=new ImageElement({image:"./data/ryg-rain-overlay.gif?v="+Math.floor(Date.now()/900000),
      georeference:new ExtentAndRotationGeoreference({extent:extent()}),
      animationOptions:{playing:true,repeatType:"loop"}});
    radar.source=[image];
  }
  view.when(()=>{webmap.add(radar,0);updateSource();}).catch(e=>{$("status").textContent="เปิด Web Map ไม่สำเร็จ: "+e.message;});
  $("show").onchange=e=>radar.visible=e.target.checked;
  $("opacity").oninput=e=>{radar.opacity=e.target.value/100;$("opacityValue").textContent=e.target.value+"%";};
  for(const id of ["east","north","size"]){$(id).oninput=e=>{$(id+"Value").textContent=e.target.value+(id==="size"?"%":" กม.");updateSource();};}
  $("reset").onclick=()=>{for(const id of ["east","north","size"]){$(id).value=id==="size"?100:0;$(id+"Value").textContent=$(id).value+(id==="size"?"%":" กม.");}updateSource();};
  setInterval(updateSource,900000);
  const probe=new Image();probe.onerror=()=>{$("status").textContent="ภาพเรดาร์ยังไม่พร้อม: รอให้งานอัปเดตบน GitHub ทำงานสำเร็จ";};
  probe.onload=()=>{$("status").textContent="ภาพเรดาร์พร้อมแสดง · อัปเดตไฟล์อัตโนมัติทุกประมาณ 15 นาที";};
  probe.src="./data/ryg-rain-overlay.gif?v="+Date.now();
});
</script>
</body></html>
