 function preparedness(e){return card('เกณฑ์เริ่มดำเนินการ · ตัวอย่างเพื่อสาธิต',table(['ระดับ','เงื่อนไขสมมติ','การดำเนินการ','บทบาทสมมติ'],[['ติดตาม','ห่างตลิ่งมากกว่า 0.50 ม.','ตรวจประจำวัน / บำรุงรักษา','ทีมตรวจพื้นที่'],['เฝ้าระวัง','ห่างตลิ่ง ≤ 0.50 ม. หรือฝน ≥ 50 มม./24 ชม.','ตรวจทุก 30 นาที / เตรียมเครื่องสูบ','หัวหน้าเวรสาธิต'],['เร่งรับมือ','ระดับน้ำถึงตลิ่ง หรือฝน ≥ 90 มม./24 ชม.','ตรวจทุก 15 นาที / ประสานศูนย์ / เตรียมเส้นทางสำรอง','ผู้ประสานงานสาธิต']])+'<p class="bd-note">เกณฑ์ทุกค่าเป็นสมมติฐานตัวอย่าง ยังไม่ผ่านการรับรองและไม่ใช้สั่งการจริง</p>')+card('ความพร้อมระบบป้องกันน้ำท่วม',table(['โครงสร้าง / อุปกรณ์','ข้อมูลจำลอง','สถานะจำลอง'],[['แนวป้องกันน้ำ','สันแนว '+e.wall+' ม. จากหมุดจำลอง','ตรวจสภาพแล้ว'],['เครื่องสูบน้ำ',e.ready+'/'+e.pumps+' เครื่องพร้อมใช้','อีก '+(e.pumps-e.ready)+' เครื่องอยู่ระหว่างตรวจ'],['กำลังสูบติดตั้ง',e.capacity.toLocaleString()+' ลบ.ม./ชั่วโมง','ตัวเลขสมมติ ไม่ใช่กำลังสูบจริง'],['ประตูน้ำ',e.gate+' จุด','พร้อมใช้งาน'],['พื้นที่หน่วงน้ำ','พื้นที่ว่าง '+e.pond.toLocaleString()+' ลบ.ม.','ประมาณการสมมติ']]))+card('แผนปฏิบัติการและผู้รับผิดชอบ','<ol>'+e.actions.map(x=>'<li>'+x+' — '+e.owner+'</li>').join('')+'</ol><p>ช่องทางประสานงาน: จุดประสานงานภายในบูธ (ไม่มีเบอร์บุคคลจริง)</p><p>ทรัพยากรสนับสนุนจำลอง: เครื่องสูบเคลื่อนที่ 1 ชุด / กระสอบทราย 500 ใบ / ไฟส่องสว่าง 2 ชุด</p>')+card('จุดเสี่ยง เส้นทางสำรอง และจุดรวมพล',table(['จุดจำลอง','แนวทางตัวอย่าง'],[['ประตูทางเข้า G-01','ตรวจจุดต่ำและเตรียมแนวกั้นชั่วคราว'],['คลังอุปกรณ์ Z-02','ยกอุปกรณ์สำคัญและตรวจระบบไฟฟ้า'],['เส้นทาง R-01 → จุดรวมพล S-01','แสดงบนผังสมมติเท่านั้น ต้องสำรวจจริงก่อนใช้'],['กลุ่มที่ต้องช่วยเหลือเป็นพิเศษ','มอบหมายทีมสำรวจ ไม่มีข้อมูลบุคคลจริง']]))+card('หลักฐานและรายการรอตรวจสอบ','<p><b>ข้อมูลชุดนี้จัดทำเพื่อสาธิตขั้นตอนการเตรียมความพร้อม</b></p><ul><li>แผนป้องกันน้ำท่วมฉบับอนุมัติและผังระดับสำรวจจริง</li><li>บัญชีเครื่องสูบ กำลังสูบ และผลทดสอบล่าสุด</li><li>เกณฑ์แจ้งเตือน รายชื่อบทบาท และช่องทางติดต่อที่ยืนยันแล้ว</li><li>เส้นทางอพยพ พื้นที่ปลอดภัย และกา  function report(e){const rows=alertData(e);return '<div class="bd-report-controls"><label>เริ่ม <input id="bdFrom" type="date" value="'+from+'"></label><label>สิ้นสุด <input id="bdTo" type="date" value="'+to+'"></label><button data-print>พิมพ์ / บันทึก PDF A4</button><button data-export>ดาวน์โหลดข้อมูลสาธิต JSON</button></div><p id="bdRangeNote" class="bd-note">ชุดสาธิตมีข้อมูลเฉพาะวันที่ 4 พ.ย. 2569 การเลือกช่วงอื่นจะแสดงว่าไม่มีข้อมูล เลือกวันที่อ้างอิงเพื่อเรียกดูตัวอย่างรายงาน</p><article id="bdReport"><h2>รายงานสถานการณ์น้ำ · ฉบับสาธิตบูธ</h2><p class="bd-watermark">ข้อมูลจำลองเพื่อการสาธิต · Exhibition Report</p><p>'+e.name+' · '+e.province+'</p><p>ช่วงรายงาน '+esc(from)+' ถึง '+esc(to)+' · เวลาอ้างอิง '+stamp+'</p>'+((from>'2026-11-04'||to<'2026-11-04'||from>to)?'<p>ไม่มีข้อมูลในช่วงที่เลือก หรือช่วงวันที่ไม่ถูกต้อง</p>':table(['หัวข้อ','ข้อมูลจำลอง'],[['สรุปสถานการณ์',e.status+' · '+e.scenario],['ระดับน้ำ / ตลิ่ง',e.water+' / '+e.bank+' ม. จากหมุดสมมติ'],['ฝนสะสม / น้ำไหลผ่าน',e.rain+' มม./24 ชม. / '+e.flow+' ลบ.ม./วินาที'],['รายการเตือน',rows.length+' รายการ · '+rows.map(r=>r.title+' ('+(progress[selected+':'+r.type]||'รอตรวจสอบ')+')').join(' / ')],['เครื่องสูบพร้อมใช้',e.ready+'/'+e.pumps+' เครื่อง'],['แนวทางดำเนินการ',e.actions.join(' / ')],['ผู้รับผิดชอบ',e.owner+' (บทบาทสมมติ)'],['หลักฐาน','Fixture BOOTH-DEMO-20261104 · ชุดข้อมูลเพื่อการสาธิต'],['ประเด็นต้องยืนยัน','เกณฑ์ / ระดับสำรวจ / กำลังสูบ / ผู้รับผิดชอบ / เส้นทางปลอดภัย'],['นัดทบทวน',review]]))+diagram(e)+'<p class="bd-note">จัดทำเพื่อแสดงขั้นตอนการใช้ระบบในงานบูธ ข้อมูลและพื้นที่ทั้งหมดในรายงานเป็นสมมติ ไม่มีการอ้างรับรองจากหน่วยงานจริง</p></article>';}
