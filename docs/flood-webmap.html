<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แผนที่สถานการณ์น้ำท่วม | IEAT EMCC</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<style>
html,body,#viewDiv{width:100%;height:100%;margin:0}
body{font-family:Arial,"Sarabun",sans-serif;background:#f4f7fa}
#trafficStatus{position:absolute;z-index:6;left:12px;bottom:12px;max-width:min(430px,calc(100% - 24px));padding:9px 12px;background:#fffffff0;border-radius:9px;box-shadow:0 2px 10px #0003;color:#34495e;font-size:12px;line-height:1.5}
#trafficStatus a{color:#1769c2}
#dataControls{position:absolute;z-index:6;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:5px;max-width:min(510px,calc(100% - 90px))}
#dataControls label{display:flex;align-items:center;gap:5px;background:#fff;padding:7px 9px;border-radius:7px;box-shadow:0 2px 8px #0003;font-size:12px;cursor:pointer}
#dataControls input{accent-color:#1769c2}
#trafficStatus a{color:#1769c2}
#viewDiv{position:absolute;inset:0}
#message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;padding:12px 16px;border-radius:8px;background:#fff;box-shadow:0 2px 12px #1b334433;color:#36495a;text-align:center}
#fallback{display:none;position:absolute;inset:0;width:100%;height:100%;border:0}
#fallbackLink{display:none;position:absolute;right:12px;bottom:12px;z-index:6;padding:9px 12px;border-radius:7px;background:#fff;color:#1769c2;box-shadow:0 2px 10px #0003;text-decoration:none;font-size:13px}
.esri-ui .esri-widget{font-family:Arial,"Sarabun",sans-serif}
</style>
<script src="https://js.arcgis.com/4.30/" onerror="window.arcgisScriptFailed=true"></script>
</head>
<body>
<div id="viewDiv" aria-label="แผนที่สถานการณ์น้ำท่วม"></div>
<div id="dataControls" aria-label="ชั้นข้อมูลน้ำท่วมและจราจร">
<label><input type="checkbox" data-layer="flood" checked> จุดน้ำท่วม</label>
<label><input type="checkbox" data-layer="water" checked> ระดับน้ำ</label>
<label><input type="checkbox" data-layer="events"> เหตุการณ์จราจร</label>
<label><input type="checkbox" data-layer="cameras"> CCTV</label>
<a href="https://traffic.longdo.com/main/" target="_blank" rel="noopener" style="background:#fff;padding:7px 9px;border-radius:7px;box-shadow:0 2px 8px #0003;font-size:12px">เส้นจราจร ↗</a>
</div>
<div id="trafficStatus" role="status">กำลังโหลดจุดน้ำท่วม ระดับน้ำ และกล้อง…</div>
<div id="message" role="status">กำลังโหลดแผนที่…</div>
<iframe id="fallback" title="แผนที่สถานการณ์น้ำท่วมจาก ArcGIS Map Viewer" loading="eager" allow="fullscreen; geolocation"></iframe>
<a id="fallbackLink" target="_blank" rel="noopener" href="https://ieat.maps.arcgis.com/apps/mapviewer/index.html?webmap=3d24287ac6ea49cd823625ddad496e01">เปิดแผนที่ใน ArcGIS</a>
<script>
(function(){
 "use strict";
 var itemId="3d24287ac6ea49cd823625ddad496e01";
 var viewerUrl="https://ieat.maps.arcgis.com/apps/mapviewer/index.html?configurableview=true&webmap="+itemId+"&theme=light&legend=true&information=true&scroll=false&basemaps=true";
 var view=null, pending=null, ready=false, fallback=false;
 var trafficStatus=document.getElementById("trafficStatus");
 var sourceState={flood:"กำลังโหลด",water:"กำลังโหลด",events:"กำลังโหลด",cameras:"กำลังโหลด"};
 function reportSource(name,text){sourceState[name]=text;trafficText("จุดน้ำท่วม "+sourceState.flood+" · ระดับน้ำ "+sourceState.water+" · เหตุการณ์ "+sourceState.events+" · CCTV "+sourceState.cameras)}
 function trafficText(value){trafficStatus.textContent=value}
 function escapeHtml(value){return String(value==null?"":value).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]})}
 var captureMode=new URLSearchParams(location.search).get("capture")==="1";
 var initialCenter=new URLSearchParams(location.search).get("center");
 var initialScale=Number(new URLSearchParams(location.search).get("scale"));
 var message=document.getElementById("message"),frame=document.getElementById("fallback");
 function showFallback(){
  if(ready||fallback)return;
  fallback=true;
  if(view){view.destroy();view=null}
  if(captureMode){message.textContent="ไม่สามารถโหลดแผนที่สำหรับรายงานได้ กรุณาลองใหม่";return}
  document.getElementById("viewDiv").style.display="none";
  frame.style.display="block";
  frame.src=viewerUrl;
  document.getElementById("fallbackLink").style.display="block";
  message.textContent="กำลังเปิดแผนที่ ArcGIS…";
  frame.addEventListener("load",function(){message.style.display="none"},{once:true});
 }
 function navigate(lon,lat,scale){
  if(!Number.isFinite(lon)||!Number.isFinite(lat))return;
  if(fallback){
   var url=new URL(viewerUrl);
   url.searchParams.set("center",lon+","+lat);
   url.searchParams.set("scale",String(scale));
   frame.src=url.toString();
  }else if(view&&ready)view.goTo({center:[lon,lat],scale:scale}).catch(function(){});
  else pending={center:[lon,lat],scale:scale};
 }
 window.addEventListener("message",async function(event){
  if(event.origin!==location.origin||!event.data)return;
  if(event.data.type==="flood-map-snapshot"){
   var id=event.data.id;
   try{
    if(!view||fallback)throw new Error("แผนที่ ArcGIS ยังไม่พร้อมสำหรับการคัดลอก");
    await view.when();
    await new Promise(function(resolve){requestAnimationFrame(function(){requestAnimationFrame(resolve)})});
    var shot=await view.takeScreenshot({format:"png"});
    event.source.postMessage({type:"flood-map-snapshot-result",id:id,dataUrl:shot.dataUrl},event.origin);
   }catch(error){
    event.source.postMessage({type:"flood-map-snapshot-result",id:id,error:String(error&&error.message||error)},event.origin);
   }
   return;
  }
  if(event.data.type!=="flood-map-focus")return;
  var d=event.data;
  if(d.reset){
   if(fallback)frame.src=viewerUrl;
   else if(view&&ready)view.goTo({center:[101,13.2],scale:4622324}).catch(function(){});
   else pending={center:[101,13.2],scale:4622324};
  }else navigate(Number(d.lon),Number(d.lat),Number(d.scale)||75000);
 });
 var timer=setTimeout(showFallback,25000);
 if(window.arcgisScriptFailed||typeof window.require!=="function"){clearTimeout(timer);showFallback();return}
 require(["esri/WebMap","esri/views/MapView","esri/widgets/Home","esri/widgets/Search","esri/widgets/LayerList","esri/widgets/Legend","esri/widgets/Expand","esri/widgets/BasemapGallery","esri/layers/GeoJSONLayer","esri/layers/GraphicsLayer","esri/Graphic"],
 function(WebMap,MapView,Home,Search,LayerList,Legend,Expand,BasemapGallery,GeoJSONLayer,GraphicsLayer,Graphic){
  var webmap=new WebMap({portalItem:{id:itemId}});
  webmap.load().then(function(){
   if(fallback)return;
   webmap.basemap="osm";
   var floodLayer=new GraphicsLayer({title:"จุดน้ำท่วม · Longdo Traffic",visible:true});
   var waterLayer=new GraphicsLayer({title:"สถานีระดับน้ำ · ThaiWater",visible:true});
   var trafficLayer=new GraphicsLayer({title:"เหตุการณ์จราจร · Longdo Traffic",visible:false});
   var cameraLayer=new GraphicsLayer({title:"กล้อง CCTV · Longdo Traffic",visible:false});
   webmap.addMany([floodLayer,waterLayer,trafficLayer,cameraLayer]);
   var layers={flood:floodLayer,water:waterLayer,events:trafficLayer,cameras:cameraLayer};
   document.querySelectorAll("#dataControls input[data-layer]").forEach(function(input){
    input.addEventListener("change",function(){layers[input.dataset.layer].visible=input.checked});
   });
   function point(lon,lat){return Number.isFinite(lon)&&Number.isFinite(lat)&&lon>=97&&lon<=106&&lat>=5&&lat<=21}
   function marker(lon,lat,color,attributes,popup){
    return new Graphic({geometry:{type:"point",longitude:lon,latitude:lat},
     symbol:{type:"simple-marker",style:"circle",size:12,color:color,outline:{color:"white",width:1.5}},
     attributes:attributes,popupTemplate:{title:"{title}",content:popup}});
   }
   async function loadTraffic(){
    try{
     var response=await fetch("https://event.longdo.com/feed/json",{cache:"no-store"});
     if(!response.ok)throw Error("HTTP "+response.status);
     var events=await response.json();
     if(!Array.isArray(events))throw Error("รูปแบบฟีดไม่ถูกต้อง");
     var now=Date.now(),floods=[],others=[];
     events.forEach(function(e){
      var lon=Number(e.longitude),lat=Number(e.latitude);
      var start=Date.parse(String(e.start||"").replace(" ","T")+"+07:00");
      var stop=Date.parse(String(e.stop||"").replace(" ","T")+"+07:00");
      if(!point(lon,lat)||(Number.isFinite(stop)&&stop<now)||(Number.isFinite(start)&&start>now+3600000))return;
      var isFlood=String(e.icon||"").toLowerCase()==="flood";
      var attrs={title:String(e.title||"เหตุการณ์"),description:String(e.description||""),start:String(e.start||""),stop:String(e.stop||"")};
      (isFlood?floods:others).push(marker(lon,lat,isFlood?[29,151,208,.95]:[240,148,25,.95],attrs,function(event){
       var a=event.graphic.attributes;
       return "<p style='white-space:pre-wrap'>"+escapeHtml(a.description)+"</p><p>รายงาน "+escapeHtml(a.start)+" · สิ้นสุดตามฟีด "+escapeHtml(a.stop)+"</p><a target='_blank' rel='noopener' href='https://traffic.longdo.com/main/'>ที่มา: Longdo Traffic</a>";
      }));
     });
     floodLayer.removeAll();floodLayer.addMany(floods);
     trafficLayer.removeAll();trafficLayer.addMany(others);
     reportSource("flood",floods.length+" จุด");
     reportSource("events",others.length+" จุด");
    }catch(error){
     floodLayer.removeAll();trafficLayer.removeAll();
     reportSource("flood","โหลดไม่สำเร็จ");reportSource("events","โหลดไม่สำเร็จ");
    }
   }
   async function loadWater(){
    try{
     var response=await fetch("./data/thaiwater_latest.json?v="+Date.now(),{cache:"no-store"});
     if(!response.ok)throw Error("HTTP "+response.status);
     var data=await response.json(),graphics=[];
     if(!Array.isArray(data.stations))throw Error("ไม่มีรายการสถานี");
     data.stations.forEach(function(row){
      if(row.kind!=="waterlevel")return;
      var lon=Number(row.lon),lat=Number(row.lat);
      if(!point(lon,lat))return;
      var score=Number(row.severity_score)||0;
      graphics.push(marker(lon,lat,score>=4?[237,59,33,.95]:score>=3?[255,138,0,.95]:[16,157,192,.95],
       {title:String(row.station||"สถานีระดับน้ำ"),level:String(row.value_text||"–"),status:String(row.status||"–"),time:String(row.observed_at||"–"),agency:String(row.agency||"ThaiWater"),percent:row.storage_percent==null?"–":String(row.storage_percent)+"%"},
       function(event){var a=event.graphic.attributes;return "<p><b>ระดับน้ำ:</b> "+escapeHtml(a.level)+"</p><p><b>สถานะ:</b> "+escapeHtml(a.status)+" · เทียบตลิ่ง "+escapeHtml(a.percent)+"</p><p>ตรวจวัด "+escapeHtml(a.time)+" · "+escapeHtml(a.agency)+"</p><a target='_blank' rel='noopener' href='https://www.thaiwater.net/water/wl'>ที่มา: ThaiWater</a>"}));
     });
     waterLayer.removeAll();waterLayer.addMany(graphics);
     reportSource("water",graphics.length+" สถานี");
    }catch(error){waterLayer.removeAll();reportSource("water","โหลดไม่สำเร็จ")}
   }
   async function loadCameras(){
    try{
     var response=await fetch("https://camera.longdo.com/feed/?command=json",{cache:"no-store"});
     if(!response.ok)throw Error("HTTP "+response.status);
     var data=await response.json();
     var cameras=Array.isArray(data)?data:Array.isArray(data.data)?data.data:Array.isArray(data.cameras)?data.cameras:[];
     var graphics=[];
     cameras.forEach(function(row){
      var lon=Number(row.longitude),lat=Number(row.latitude);
      if(!point(lon,lat))return;
      var href=String(row.link||"");
      if(!/^https?:\/\//i.test(href))href="https://traffic.longdo.com/main/";
      graphics.push(marker(lon,lat,[73,91,166,.95],{title:String(row.title||"กล้อง CCTV"),updated:String(row.lastupdate||"–"),url:href},
       function(event){var a=event.graphic.attributes;return "<p>ภาพล่าสุด "+escapeHtml(a.updated)+"</p><a href='"+escapeHtml(a.url)+"' target='_blank' rel='noopener'>เปิดภาพจาก Longdo Traffic ↗</a>"}));
     });
     cameraLayer.removeAll();cameraLayer.addMany(graphics);
     reportSource("cameras",graphics.length+" กล้อง");
    }catch(error){cameraLayer.removeAll();reportSource("cameras","โหลดไม่สำเร็จ · ดูที่ Longdo Traffic")}
   }
   loadTraffic();loadWater();loadCameras();
   setInterval(loadTraffic,5*60*1000);setInterval(loadWater,10*60*1000);setInterval(loadCameras,10*60*1000);
   view=new MapView({container:"viewDiv",map:webmap});
   view.when(function(){
    if(fallback)return;
    ready=true;clearTimeout(timer);message.style.display="none";
    view.ui.add(new Home({view:view}),"top-left");
    view.ui.add(new Search({view:view}),"top-right");
    view.ui.add(new Expand({view:view,content:new LayerList({view:view}),group:"map-tools",expandTooltip:"ชั้นข้อมูล"}),"top-right");
    view.ui.add(new Expand({view:view,content:new Legend({view:view}),group:"map-tools",expandTooltip:"คำอธิบายสัญลักษณ์"}),"top-right");
    view.ui.add(new Expand({view:view,content:new BasemapGallery({view:view}),group:"map-tools",expandTooltip:"เลือกแผนที่ฐาน"}),"top-right");
    fetch("./data/gistda_flood_latest.geojson?v="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("feed unavailable");return r.json()}).then(function(feed){
     var retrieved=Date.parse(feed.metadata&&feed.metadata.retrieved_at||"");
     if(!Number.isFinite(retrieved)||Date.now()-retrieved>12*3600000||!Array.isArray(feed.features)||!feed.features.length)return;
     var summarized=feed.metadata&&feed.metadata.display_mode==="observed_flood_centers_by_tambon";
     var symbol=summarized?{type:"simple-marker",style:"circle",size:9,color:[0,114,221,.85],outline:{color:[255,255,255,1],width:1.5}}:
      {type:"simple-fill",color:[0,114,221,.35],outline:{color:[0,76,170,.85],width:1}};
     var layer=new GeoJSONLayer({url:new URL("./data/gistda_flood_latest.geojson",location.href).href,
      title:summarized?"จุดกลางพื้นที่น้ำท่วมที่ตรวจพบตามตำบล · GISTDA":"ขอบเขตน้ำท่วมที่ตรวจพบ · GISTDA",
      renderer:{type:"simple",symbol:symbol},
      popupTemplate:{title:"พื้นที่น้ำท่วมจาก GISTDA",content:summarized?"จุดนี้เป็นตำแหน่งสรุปของพื้นที่ที่ตรวจพบในตำบล โปรดตรวจสอบขอบเขตจริงและวันที่ภาพที่ https://disaster.gistda.or.th/flood":"ตรวจสอบวันที่ภาพและรายละเอียดที่ https://disaster.gistda.or.th/flood"}});
     webmap.add(layer);
    }).catch(function(){/* No verified polygon feed; retain the watch map without a flood overlay. */});
    if(pending)view.goTo(pending).catch(function(){});
    else if(initialCenter){var coords=initialCenter.split(",").map(Number);if(coords.length===2&&coords.every(Number.isFinite))view.goTo({center:coords,scale:Number.isFinite(initialScale)&&initialScale>0?initialScale:75000}).catch(function(){})}
   }).catch(showFallback);
  }).catch(showFallback);
 },showFallback);
})();
</script>
</body>
</html>
