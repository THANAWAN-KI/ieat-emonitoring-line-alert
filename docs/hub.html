<style>
#estateSearchTab{border:0;background:#fff;color:#535b65;padding:8px 12px;border-radius:20px;white-space:nowrap;cursor:pointer;font:600 14px Sarabun,sans-serif}
#estateSearchTab:hover{background:#eef5e8;color:#376b17}
#estateSearchModal[hidden]{display:none}
#estateSearchModal{position:fixed;inset:0;z-index:1200;background:#1c253070;display:grid;place-items:start center;padding:75px 12px 16px}
#estateSearchModal .box{width:min(900px,100%);max-height:calc(100vh - 90px);overflow:auto;background:#fff;border-radius:16px;padding:22px;font:16px Sarabun,sans-serif}
#estateSearchModal .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
#estateSearchModal h2{margin:0;font-size:22px}
#estateSearchModal input{width:100%;margin:14px 0;padding:12px;border:1px solid #cdd5da;border-radius:10px;font:inherit}
#estateSearchModal .layout{display:grid;grid-template-columns:minmax(210px,310px) minmax(0,1fr);gap:18px}
#estateSearchResults{max-height:58vh;overflow:auto;border:1px solid #e4e6e8;border-radius:10px}
#estateSearchResults button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #e9e9eb;background:#fff;padding:11px;cursor:pointer;font:inherit}
#estateSearchResults button:hover,#estateSearchResults button.selected{background:#eef5e8;color:#285e16}
#estateSearchDetail{background:#f8faf7;border-radius:10px;padding:17px;min-height:180px}
#estateSearchDetail button{margin-top:12px;border:0;border-radius:8px;background:#598c14;color:#fff;padding:10px 15px;cursor:pointer;font:inherit}
@media(max-width:700px){
  #estateSearchTab{font-size:12px;padding:7px 9px}
  #estateSearchModal{padding:8px}
  #estateSearchModal .box{max-height:calc(100vh - 16px);padding:14px}
  #estateSearchModal .layout{grid-template-columns:1fr}
  #estateSearchResults{max-height:30vh}
}
</style>

<script>
(function () {
  const nav = document.querySelector('#hubInformationHeader nav.header-actions');
  if (!nav) return;

  const tab = document.createElement('button');
  tab.id = 'estateSearchTab';
  tab.type = 'button';
  tab.textContent = 'ค้นหานิคมอุตสาหกรรม';
  nav.prepend(tab);

  const modal = document.createElement('div');
  modal.id = 'estateSearchModal';
  modal.hidden = true;
  modal.innerHTML = `
    <div class="box" role="dialog" aria-modal="true" aria-labelledby="estateSearchTitle">
      <div class="top">
        <h2 id="estateSearchTitle">ค้นหาข้อมูลนิคมอุตสาหกรรม</h2>
        <button type="button" id="estateSearchClose" aria-label="ปิด">✕</button>
      </div>
      <input id="estateSearchInput" type="search"
        placeholder="พิมพ์ชื่อนิคมอุตสาหกรรม / ท่าเรืออุตสาหกรรม">
      <div class="layout">
        <div id="estateSearchResults"></div>
        <div id="estateSearchDetail">เลือกนิคมฯ เพื่อดูข้อมูล</div>
      </div>
    </div>`;
  document.body.appendChild(modal);

  const input = document.getElementById('estateSearchInput');
  const results = document.getElementById('estateSearchResults');
  const detail = document.getElementById('estateSearchDetail');
  let selected = '';

  function names() {
    return typeof fireEstateNames === 'function' ? fireEstateNames() : [];
  }

  function render() {
    const term = fireNormalize(input.value);
    const matches = names().filter(name => !term || fireNormalize(name).includes(term));
    results.replaceChildren();

    if (!matches.length) {
      results.textContent = names().length
        ? 'ไม่พบนิคมฯ ที่ค้นหา'
        : 'กำลังโหลดข้อมูลนิคมฯ…';
      return;
    }

    matches.forEach(name => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = name;
      button.classList.toggle('selected', name === selected);
      button.addEventListener('click', () => showDetail(name));
      results.appendChild(button);
    });
  }

  function showDetail(name) {
    selected = name;
    render();
    detail.replaceChildren();

    const title = document.createElement('h3');
    title.textContent = name;
    detail.appendChild(title);

    const businesses = fireFactoryRecords().filter(
      record => fireNormalize(record.estate) === fireNormalize(name)
    );

    const count = document.createElement('p');
    count.textContent = `ผู้ประกอบการในฐานข้อมูล: ${businesses.length.toLocaleString('th-TH')} ราย`;
    detail.appendChild(count);

    const list = document.createElement('div');
    list.style.cssText = 'max-height:32vh;overflow:auto';
    businesses.slice(0, 100).forEach(record => {
      const row = document.createElement('p');
      row.textContent = '• ' + record.name;
      list.appendChild(row);
    });
    detail.appendChild(list);

    const action = document.createElement('button');
    action.type = 'button';
    action.textContent = 'ดูข้อมูลสนับสนุนและแผนที่';
    action.addEventListener('click', () => {
      const field = document.getElementById('fireEstateSearch');
      if (field && typeof fireApplyEstate === 'function') {
        field.value = name;
        document.querySelector('.tab[data-type="fire"]')?.click();
        fireApplyEstate();
      }
      close();
    });
    detail.appendChild(action);
  }

  function close() {
    modal.hidden = true;
    tab.focus();
  }

  tab.addEventListener('click', () => {
    modal.hidden = false;
    render();
    input.focus();
  });
  input.addEventListener('input', render);
  document.getElementById('estateSearchClose').addEventListener('click', close);
  modal.addEventListener('click', event => {
    if (event.target === modal) close();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !modal.hidden) close();
  });

  const source = document.getElementById('fireEstateOptions');
  if (source) new MutationObserver(render).observe(source, { childList: true });
})();
</script>
