<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard ประกอบรายงาน | IEAT EMCC</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#153344;font-family:'Noto Sans Thai',Tahoma,sans-serif}.toolbar{height:48px;display:flex;align-items:center;gap:8px;padding:6px 18px;background:#fff;border-bottom:1px solid #dbe4ea}.toolbar a,.toolbar button{font:inherit;font-size:12px;padding:5px 12px;border:1px solid #dbe4ea;border-radius:7px;background:#fff;color:#075d85;text-decoration:none;cursor:pointer}.toolbar .active{background:#075d85;color:white}.toolbar button{margin-left:auto}.report{height:calc(100dvh - 48px);padding:16px 22px;display:grid;grid-template-rows:auto 82px minmax(0,1fr) auto;gap:12px;background:#f5f8fa}.report:fullscreen{height:100dvh}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.heading small{font-size:10px;letter-spacing:1px;color:#147b97}.heading h1{font-size:23px;margin:3px 0}.heading p{font-size:12px;color:#627989;margin:0}.stamp{font-size:11px;text-align:right;white-space:nowrap;padding-top:8px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.kpi{padding:10px 14px;background:#fff;border-radius:10px;border-top:3px solid var(--c,#109dc0)}.kpi b{display:block;font-size:26px;line-height:1.3;color:var(--c,#109dc0)}.kpi span{font-size:11px}.layout{min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}.left{min-height:0;display:grid;grid-template-rows:minmax(110px,.9fr) minmax(0,1.5fr);gap:12px}.panel{background:#fff;border:1px solid #e0e8ed;border-radius:12px;overflow:hidden;min-height:0;display:flex;flex-direction:column}.panel h2{font-size:14px;padding:10px 14px;margin:0;border-bottom:1px solid #edf1f4;color:#075d85}.panel h2 small{font-size:9px;font-weight:400;color:#6b7e8c;margin-left:7px}.metrics{flex:1;display:flex;gap:12px;align-items:center;padding:10px 16px}.metrics>div{flex:1;padding:8px;border-radius:8px;background:#f2f7fa;font-size:11px}.metrics strong{display:block;font-size:21px;color:#075d85}.scroll{overflow:auto;min-height:0;flex:1}table{width:100%;border-collapse:collapse;font-size:11px}td,th{padding:7px 12px;text-align:left;border-bottom:1px solid #edf1f4}th{position:sticky;top:0;background:#f0f5f8;color:#315369;z-index:1}.pill{display:inline-block;padding:2px 6px;border-radius:5px;color:white;background:#598c14;font-size:10px}.pill.off{background:#8797a4}.pill.alarm{background:#f00a36}.map{position:relative;flex:1;min-height:0}.map iframe{width:100%;height:100%;border:0}.legend{padding:7px 12px;font-size:10px;color:#627989}.foot{display:flex;justify-content:space-between;gap:12px;font-size:9px;color:#627989}.empty{padding:25px;text-align:center;color:#627989;font-size:13px}.notice{font-size:10px;margin:0;padding:7px 14px;color:#627989}.rank{padding:8px 14px;overflow:auto}.rank div{display:grid;grid-template-columns:minmax(0,1fr) 80px;gap:12px;font-size:11px;padding:5px;border-bottom:1px solid #edf1f4}.rank span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rank b{text-align:right;color:#075d85}.maperror{padding:20px;font-size:12px}@media(max-width:900px){.report{height:auto;min-height:calc(100dvh - 48px)}.heading{display:block}.stamp{text-align:left}.kpis{grid-template-columns:repeat(3,1fr)}.layout{display:block}.left{height:480px;margin-bottom:12px}.layout>.panel{height:450px}.foot{display:block}}@media(max-height:800px) and (min-width:901px){.report{padding:10px 16px;gap:8px;grid-template-rows:auto 72px minmax(0,1fr) auto}.heading h1{font-size:19px}.heading p{font-size:10px}.layout,.left{gap:8px}.kpi b{font-size:23px}}@media print{@page{size:A4 landscape;margin:8mm}.toolbar{display:none}.report{height:190mm;width:281mm}.heading h1{font-size:20px}.kpis{grid-template-columns:repeat(6,1fr)}.layout{display:grid}.left{height:auto;margin:0}.layout>.panel{height:auto}.foot{display:flex}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body><nav class="toolbar"><a href="./information.html#monitor">กลับ Dashboard</a><a id="emLink" href="?source=emonitor">ข้อ 2 • e-Monitoring</a><a id="pcdLink" href="?source=pcd">ข้อ 3 • PCD</a><button id="capture">เต็มหน้าจอเพื่อแคปภาพ</button></nav><main class="report" id="report"><header class="heading"><div><small>IEAT ENVIRONMENTAL MONITORING & CONTROL CENTER</small><h1 id="title"></h1><p id="subtitle"></p></div><div class="stamp" id="stamp">กำลังโหลดข้อมูล…</div></header><section class="kpis" id="kpis"></section><div class="layout"><div class="left"><section class="panel"><h2 id="metricsTitle"></h2><div id="metrics" class="metrics"></div><p class="notice" id="note"></p></section><section class="panel"><h2 id="tableTitle"></h2><div class="scroll"><table><thead id="thead"></thead><tbody id="rows"></tbody></table></div></section></div><section class="panel"><h2 id="mapTitle"></h2><div class="map" id="map"></div><div class="legend" id="legend"></div></section></div><footer class="foot"><span id="source"></span><span>ภาพแสดงระบบที่ปรับปรุงแล้ว • ใช้ข้อมูลล่าสุดตามวันเวลาที่ระบุ</span></footer></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const mode=new URLSearchParams(location.search).get('source')==='pcd'?'pcd':'emonitor';
const el=id=>document.getElementById(id),esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
el(mode==='pcd'?'pcdLink':'emLink').className='active';
el('capture').onclick=()=>el('report').requestFullscreen();
function card(label,value,color){return '<article class="kpi" style="--c:'+color+'"><b>'+esc(value)+'</b><span>'+esc(label)+'</span></article>'}
function num(x){if(x==null||String(x).trim()===''||String(x).trim()==='-')return null;const n=Number(String(x).replace(/,/g,''));return Number.isFinite(n)&&n>=0&&n!==9999?n:null}
function average(a){return a.length?(a.reduce((s,n)=>s+n,0)/a.length).toLocaleString('th-TH',{maximumFractionDigits:1}):'ไม่มีข้อมูล'}
function measurement(p,k){const txt=String(p[k+'_txt']??'');const m=txt.match(/^(-?\d[\d,]*(?:\.\d+)?)(?:\s|$)/);return m?num(m[1]):null}
function setStamp(data,latest){el('stamp').innerHTML='เวลาข้อมูล: '+esc(latest)+'<br>ดึงข้อมูล: '+esc(new Date(data.fetched_at).toLocaleString('th-TH'))}
async function render(){
 const pcd=mode==='pcd';el('title').textContent=pcd?'Dashboard คุณภาพอากาศ • กรมควบคุมมลพิษ (PCD)':'Dashboard ผลตรวจวัดคุณภาพสิ่งแวดล้อม • e-Monitoring';el('subtitle').textContent=pcd?'ข้อมูลสถานีตรวจวัดคุณภาพอากาศ Air4Thai ของกรมควบคุมมลพิษ':'ข้อมูล AQMs • WQMs • CEMs ภายในนิคมอุตสาหกรรม / ท่าเรืออุตสาหกรรม';el('metricsTitle').textContent=pcd?'ค่า PM2.5 ล่าสุดจากสถานีที่มีข้อมูล':'สถานะและข้อมูลผลการตรวจวัด';el('tableTitle').textContent=pcd?'สถานีตรวจวัดคุณภาพอากาศ • เรียง PM2.5 จากมากไปน้อย':'สถานีตรวจวัด • แสดงสถานีที่มีรายการแจ้งเตือนก่อน';el('mapTitle').textContent=pcd?'GIS Online • ตำแหน่งสถานี PCD':'GIS Online • ตำแหน่งสถานี e-Monitoring';el('source').textContent=pcd?'แหล่งข้อมูล: กรมควบคุมมลพิษ • Air4Thai':'แหล่งข้อมูล: กนอ. • station_all.json';
 const response=await fetch(pcd?'./pcd-stations.json?v='+Date.now():'./emonitoring-stations.json?v='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();
 if(!pcd){const rows=data.features.map(f=>({...f.properties,coordinates:f.geometry?.coordinates})),online=rows.filter(p=>/^ONLINE\b/.test(p.Status)),offline=rows.filter(p=>/^OFFLINE\b/.test(p.Status)),alarm=p=>p.ParameterAlram&&p.ParameterAlram!=='-',alarms=rows.filter(alarm);const counts=['AIR QUALITY','WQMS','CEMS'].map(t=>rows.filter(p=>String(p.Type).toUpperCase()===t).length);el('kpis').innerHTML=card('สถานีทั้งหมด',rows.length,'#109dc0')+card('Online',online.length,'#598c14')+card('Offline',offline.length,'#7c8c99')+counts.map((n,i)=>card(['AQMs','WQMs','CEMs'][i],n,['#109dc0','#159b9a','#832561'][i])).join('');el('metrics').innerHTML='<div>สถานีมีรายการแจ้งเตือน<strong>'+alarms.length+'</strong></div><div>PM2.5 เฉลี่ยสถานี Online<strong>'+average(online.filter(p=>p.Type==='AIR QUALITY').map(p=>measurement(p,'PM25')).filter(n=>n!=null))+'</strong>µg/m³</div><div>นิคมฯ / ท่าเรือฯ ที่มีสถานี<strong>'+new Set(rows.map(p=>p.IndustryZone)).size+'</strong></div>';el('note').textContent='รายการแจ้งเตือนอาจรวมเหตุการณ์ย้อนหลัง • ค่า PM2.5 เป็นค่าล่าสุด ไม่ใช่ค่าเฉลี่ยรายเดือน';setStamp(data,rows.map(p=>p.LastUpdate).filter(x=>x&&x!=='-').sort().at(-1));el('thead').innerHTML='<tr><th>สถานี / ผู้ประกอบการ</th><th>นิคมฯ</th><th>ระบบ</th><th>สถานะ</th><th>ข้อมูลล่าสุด</th></tr>';el('rows').innerHTML=rows.sort((a,b)=>Number(!!alarm(b))-Number(!!alarm(a))).map(p=>'<tr><td>'+esc(p.StationTH)+'</td><td>'+esc(p.IndustryZone)+'</td><td>'+esc(p.Type)+'</td><td><span class="pill '+(alarm(p)?'alarm':/^ONLINE/.test(p.Status)?'':'off')+'">'+esc(p.Status)+'</span></td><td>'+esc(p['LastUpdate-TH'])+'</td></tr>').join('');el('map').innerHTML='<iframe title="แผนที่สถานี e-Monitoring" src="https://ieat.maps.arcgis.com/apps/mapviewer/index.html?configurableview=true&webmap=43f93c5608a74dd19a48b0ffc6bd639d&theme=light&legend=true&scroll=true"></iframe>';el('legend').textContent='AQMs: คุณภาพอากาศ • WQMs: คุณภาพน้ำ • CEMs: อากาศจากปล่อง';
 }else{const stations=data.stations.map(s=>({...s,pm:num(s.AQILast?.PM25?.value??s.LastUpdate?.PM25?.value),aqi:num(s.AQILast?.AQI?.aqi??s.LastUpdate?.AQI?.aqi),update:s.AQILast??s.LastUpdate??{}}));if(!stations.length)throw Error('Empty PCD stations');const valid=stations.filter(s=>s.pm!=null),aqi=stations.filter(s=>s.aqi!=null),latest=stations.map(s=>(s.update.date||'')+' '+(s.update.time||'')).sort().at(-1);setStamp(data,latest);el('kpis').innerHTML=card('สถานี PCD ทั้งหมด',stations.length,'#109dc0')+card('สถานีมีค่า PM2.5',valid.length,'#598c14')+card('สถานีมีค่า AQI',aqi.length,'#109dc0')+card('PM2.5 เฉลี่ย (µg/m³)',average(valid.map(s=>s.pm)),'#832561')+card('PM2.5 สูงสุด (µg/m³)',valid.length?Math.max(...valid.map(s=>s.pm)):'—','#ff6908')+card('ไม่มีค่า PM2.5',stations.length-valid.length,'#7c8c99');el('metrics').className='rank';el('metrics').innerHTML=valid.sort((a,b)=>b.pm-a.pm).slice(0,5).map(s=>'<div><span>'+esc(s.nameTH)+' • '+esc(s.areaTH)+'</span><b>'+s.pm+' µg/m³</b></div>').join('');el('note').textContent='ค่า PM2.5 ใช้ช่วงเฉลี่ยตามที่ Air4Thai เผยแพร่ • ไม่ใช่ค่าเฉลี่ยเดือนกันยายน';el('thead').innerHTML='<tr><th>สถานี / พื้นที่</th><th>PM2.5</th><th>PM10</th><th>AQI</th><th>ข้อมูลล่าสุด</th></tr>';el('rows').innerHTML=stations.sort((a,b)=>(b.pm??-1)-(a.pm??-1)).map(s=>'<tr><td>'+esc(s.nameTH)+'<br><small>'+esc(s.areaTH)+'</small></td><td>'+esc(s.pm)+'</td><td>'+esc(num(s.update.PM10?.value))+'</td><td>'+esc(s.aqi)+'</td><td>'+esc(s.update.date)+' '+esc(s.update.time)+'</td></tr>').join('');if(typeof L==='undefined'){el('map').innerHTML='<div class="maperror">โหลดแผนที่ไม่สำเร็จ กรุณารีเฟรชหน้า</div>';return}const map=L.map('map').setView([13.3,101],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);const points=[];stations.forEach(s=>{const lat=num(s.lat),lon=num(s.long??s.lon);if(lat==null||lon==null)return;points.push([lat,lon]);L.circleMarker([lat,lon],{radius:6,color:'#fff',weight:1,fillColor:s.aqi==null?'#8797a4':s.aqi<=25?'#109dc0':s.aqi<=50?'#598c14':s.aqi<=100?'#e5bc22':s.aqi<=200?'#ff6908':'#f00a36',fillOpacity:.9}).addTo(map).bindPopup('<b>'+esc(s.nameTH)+'</b><br>'+esc(s.areaTH)+'<br>PM2.5: '+esc(s.pm)+' µg/m³<br>AQI: '+esc(s.aqi))});if(points.length)map.fitBounds(points,{padding:[18,18]});el('legend').textContent='สีจุดตามค่า AQI: ≤25 ฟ้า • ≤50 เขียว • ≤100 เหลือง • ≤200 ส้ม • >200 แดง';}
}
render().catch(error=>{el('stamp').textContent='ยังโหลดข้อมูลจากแหล่งข้อมูลไม่สำเร็จ';el('rows').innerHTML='<tr><td colspan="5" class="empty">ยังไม่มีข้อมูลที่ยืนยันได้จากแหล่งนี้ กรุณาลองใหม่ภายหลัง</td></tr>';el('note').textContent='ระบบจะแสดงค่าจริงเมื่อดึงข้อมูลสำเร็จ';console.error(error)});
</script></body></html>
