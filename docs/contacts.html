        }

        }

            margin: 0 auto;
            background: #f7f8fa;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px;
            background: #ffffff;
            border-bottom: 4px solid #4e2a84;
        }

        .logo {
            flex-shrink: 0;
            width: 72px;
            height: 72px;

        }

        .header-title {
            margin: 0;
            color: #35205a;
            font-size: 23px;
            font-weight: 750;
        }

        .header-subtitle {
            margin: 5px 0 0;
            color: #70757f;
            font-size: 14px;
            line-height: 1.5;
        }

        .content {
            padding: 16px;
        }

        .notice {
            padding: 14px;
            background: #f1edf8;
            border-left: 4px solid #4e2a84;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.65;
        }

        .search {
            width: 100%;
            margin: 16px 0 10px;
            padding: 14px;
            background: #ffffff;
            border: 1px solid #cfd5dd;
            border-radius: 12px;
            color: #20242c;
            font-family: inherit;
            font-size: 16px;
            outline: none;
        }

        .search:focus {
            border-color: #4e2a84;
            box-shadow: 0 0 0 3px rgba(78, 42, 132, 0.12);
        }

        .result-count {
            margin: 0 2px 12px;
            color: #70757f;
            font-size: 13px;
        }

        .office-card {
            margin-bottom: 12px;
            padding: 16px;
            background: #ffffff;
            border: 1px solid #dfe3e8;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(53, 32, 90, 0.05);
        }

        .office-name {
            margin: 0;
            color: #35205a;
            font-size: 18px;
            line-height: 1.45;
        }

        .province {
            display: inline-block;
            margin-top: 7px;
            padding: 4px 9px;
            color: #356ca5;
            background: #edf5fd;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .information-row {
            margin-top: 11px;
            line-height: 1.55;
        }

        .information-label {
            display: block;
            color: #70757f;
            font-size: 12px;
        }

        .information-value {
            display: block;
            margin-top: 2px;
            font-size: 14px;
        }

        .phone-number {
            color: #2f7d4a;
            font-size: 17px;
            font-weight: bold;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 14px;
        }

        .button {
            display: block;
            padding: 12px 8px;
            border-radius: 9px;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .call-button {
            color: #ffffff;
            background: #2f7d4a;
        }

        .map-button {
            color: #35205a;
            background: #ede7f6;
        }

        .source-link {
            display: block;
            margin-top: 11px;
            color: #70757f;
            text-align: center;
            font-size: 12px;
        }

        .empty {
            padding: 35px 10px;
            color: #70757f;
            text-align: center;
        }

        .call-center {
            position: sticky;
            bottom: 0;
            padding: 12px 16px;
            background: rgba(247, 248, 250, 0.97);
            border-top: 1px solid #dfe3e8;
        }

        .call-center-button {
            display: block;
            padding: 14px;
            color: #ffffff;
            background: #35205a;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }

        .footer {
            padding: 8px 16px 22px;
            color: #70757f;
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .header {
                padding: 14px;
            }

            .logo {
                width: 60px;
                height: 60px;
            }

            .header-title {
                font-size: 20px;
            }

            .content {
                padding: 12px;
            }
        }
    </style>
</head>

        }
    ];

    const searchInput =
        document.getElementById("searchInput");

    const officeList =
        document.getElementById("officeList");

    const resultCount =
        document.getElementById("resultCount");

    function createElement(tagName, className, text) {
        const element = document.createElement(tagName);

        if (className) {
            element.className = className;
        }

        if (text !== undefined) {
            element.textContent = text;
        }

        return element;
    }

    function createInformationRow(
        labelText,
        valueText,
        additionalClass = ""
    ) {
        const row = createElement(
            "div",
            "information-row"
        );

        const label = createElement(
            "span",
            "information-label",
            labelText
        );

        const value = createElement(
            "span",
            "information-value " + additionalClass,
            valueText || "-"
        );

        row.appendChild(label);
        row.appendChild(value);

        return row;
    }

    function createOfficeCard(office) {
        const card = createElement(
            "article",
            "office-card"
        );

        const name = createElement(
            "h2",
            "office-name",
            office.name
        );

        const province = createElement(
            "span",
            "province",
            office.province
        );

        card.appendChild(name);
        card.appendChild(province);

        card.appendChild(
            createInformationRow(
                "พื้นที่รับผิดชอบ",
                office.areas
            )
        );

        card.appendChild(
            createInformationRow(
                "เบอร์สำนักงาน",
                office.phone,
                "phone-number"
            )
        );

        card.appendChild(
            createInformationRow(
                "ที่ตั้ง",
                office.address
            )
        );

        const buttons = createElement(
            "div",
            "buttons"
        );

        const callButton = createElement(
            "a",
            "button call-button",
            "โทรสำนักงาน"
        );

        callButton.href = "tel:" + office.tel;

        const mapButton = createElement(
            "a",
            "button map-button",
            "เปิดแผนที่"
        );

        mapButton.href = office.mapUrl;
        mapButton.target = "_blank";
        mapButton.rel = "noopener noreferrer";

        buttons.appendChild(callButton);
        buttons.appendChild(mapButton);
        card.appendChild(buttons);

        const sourceLink = createElement(
            "a",
            "source-link",
            "ตรวจสอบแหล่งข้อมูลทางการ"
        );

        sourceLink.href = office.sourceUrl;
        sourceLink.target = "_blank";
        sourceLink.rel = "noopener noreferrer";

        card.appendChild(sourceLink);

        return card;
    }

    function renderOffices() {
        const keyword = searchInput.value
            .trim()
            .toLocaleLowerCase("th");

        const filteredOffices = offices.filter(
            function (office) {
                const combinedText = [
                    office.name,
                    office.areas,
                    office.province,
                    office.phone,
                    office.address
                ]
                .join(" ")
                .toLocaleLowerCase("th");

                return combinedText.includes(keyword);
            }
        );

        officeList.innerHTML = "";

        resultCount.textContent =
            "พบ " + filteredOffices.length + " รายการ";

        if (filteredOffices.length === 0) {
            const empty = createElement(
                "div",
                "empty",
                "ไม่พบสำนักงานที่ค้นหา"
            );

            officeList.appendChild(empty);
            return;
        }

        filteredOffices.forEach(function (office) {
            officeList.appendChild(
                createOfficeCard(office)
            );
        });
    }

    searchInput.addEventListener(
        "input",
        renderOffices
    );

    renderOffices();
</script>

</body>
</html>
