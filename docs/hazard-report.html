<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดทำรายงานเฉพาะภัย | EMCC</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet"><script src="./incident-store.js?v=20261022" defer></script><script src="./report-store.js?v=1" defer></script><script src="./hazard-report.js?v=20261022" defer></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#18354c;font:16px/1.7 Kanit,sans-serif}header,main{max-width:1100px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}header img{width:130px}h1{font-size:26px;margin:12px 0}h2{font-size:20px;color:#0D47A1}a{color:#0D47A1}section{background:white;padding:24px;margin-bottom:20px;border-radius:16px;box-shadow:0 6px 22px #0d47a10b}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block}input,textarea{display:block;width:100%;border:0;border-radius:8px;background:#f0f5fb;padding:12px;font:inherit;color:inherit}textarea{min-height:100px;resize:vertical}.wide{grid-column:1/-1}small,.hint{color:#566d7e}button{font:inherit;border:0;border-radius:10px;background:#0D47A1;color:white;padding:12px 24px;cursor:pointer}button:disabled{opacity:.6}#status{color:#0D47A1}[hidden]{display:none!important}@media(max-width:650px){header,main{padding:16px}.fields{grid-template-columns:1fr}section{padding:18px}.wide{grid-column:auto}}</style></head><body><header><a href="./hub.html"><img src="./assets/emcc-wordmark.svg" alt="EMCC"></a><nav><a id="back" href="./incidents.html">← กลับรายการเหตุ</a> · <a id="dashboard" href="./hub.html">ดูข้อมูลสถานการณ์</a></nav></header><main><h1 id="title">จัดทำรายงานเฉพาะภัย</h1><p id="context"></p><p class="hint">ตรวจข้อมูลรับแจ้งและกรอกข้อมูลที่ตรวจสอบแล้ว ช่องที่เว้นว่างจะแสดง “ยังไม่มีข้อมูล” ในรายงาน</p><p id="status" role="status" aria-live="polite"></p><form id="editor" hidden><section><h2 id="assessment-title">ข้อมูลสถานการณ์</h2><div class="fields" id="hazard-fields"></div></section><section><h2>ผลกระทบและการรับมือ</h2><div class="fields"><label>พื้นที่ / สถานประกอบการที่ได้รับผลกระทบ<textarea id="affected"></textarea></label><label>ผู้ได้รับผลกระทบ / ผู้บาดเจ็บ / ผู้เสียชีวิต<textarea id="people" placeholder="ระบุจำนวนที่ยืนยันแล้ว หรือยังอยู่ระหว่างตรวจสอบ"></textarea></label><label>การดำเนินการและหน่วยงานที่รับผิดชอบ<textarea id="response"></textarea></label><label>ข้อเสนอแนะ / การติดตามครั้งถัดไป<textarea id="followup"></textarea></label><label>แหล่งข้อมูลประกอบ<input id="evidence" placeholder="หน่วยงาน เอกสาร หรือ URL"></label><label>เวลาของข้อมูลประกอบ<input id="observed" type="datetime-local"></label><label class="wide">ผู้จัดทำ / หน่วยงาน<input id="author"></label></div></section><button id="save" type="submit">บันทึกรายงานและเปิดหน้าดาวน์โหลด PNG</button><p class="hint">รายงานบันทึกในเบราว์เซอร์นี้ เช่นเดียวกับรายการรับแจ้งเหตุ</p></form></main></body></html>
