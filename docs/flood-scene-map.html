<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แผนที่ 3 มิติ | IEAT</title><link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css"><style>html,body,#view{height:100%;margin:0;font:14px Tahoma,sans-serif}#tools{position:absolute;top:12px;right:12px;z-index:3;background:#fffefb;padding:10px;border-radius:14px;box-shadow:0 4px 18px #0002;max-width:270px}button,select{font:inherit;padding:8px;border:0;border-radius:8px;background:#eaf2fa;margin:3px;cursor:pointer}#note{font-size:12px;line-height:1.6;max-width:260px}#failure{display:none;position:absolute;inset:30%;background:white;padding:20px;z-index:5}a{color:#125b99}#view:focus-visible,button:focus-visible{outline:3px solid #2185d5}</style><script src="https://js.arcgis.com/4.32/"></script><script src="flood-rid-source.js?v=20261006-rid-17"></script></head><body><div id="view" aria-label="แผนที่ภูมิประเทศและอาคาร 3 มิติ"></div><div id="tools"><b>สำรวจพื้นที่ 3 มิติ</b><div><button id="tilt">มุมเอียง 3 มิติ</button><button id="top">มองจากด้านบน</button><button id="north">ทิศเหนือ</button></div><label>แผนที่ฐาน <select id="base"><option value="satellite">ภาพถ่ายดาวเทียม</option><option value="topo-vector">แผนที่ถนน</option></select></label><div><label><input type="checkbox" id="buildings" checked>อาคาร OpenStreetMap</label></div><p id="note" role="status">กำลังเปิดแผนที่ 3 มิติ…</p><small>ลากเมาส์ขวาเพื่อหมุน / เอียง · เลื่อนเพื่อซูม</small><div><a href="flood-hydrology-map.html">แผนที่ 2 มิติและชั้นข้อมูลเดิม</a></div></div><div id="failure" role="alert">เปิดแผนที่ 3 มิติไม่สำเร็จ ต้องใช้เบราว์เซอร์ที่รองรับ WebGL และเชื่อมต่อบริการแผนที่<br><a href="flood-hydrology-map.html">เปิดแผนที่ 2 มิติ</a></div><script>
'use strict';
const note=document.getElementById('note'),pending=[];let ready=false,receive;
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;if(ready)receive(e.data);else if(pending.length<20)pending.push(e.data)});
const timeout=setTimeout(()=>{if(!ready)document.getElementById('failure').style.display='block'},35000);
require(['esri/Map','esri/views/SceneView','esri/layers/GraphicsLayer','esri/Graphic','esri/layers/FeatureLayer'],function(Map,SceneView,GraphicsLayer,Graphic,FeatureLayer){
const buildings=new GraphicsLayer({title:'อาคาร OSM · ความสูงบางรายการเป็นค่าประมาณ'}),stations=new GraphicsLayer({title:'สถานีระดับน้ำ RID',elevationInfo:{mode:'relative-to-ground',offset:6}}),focusLayer=new GraphicsLayer({title:'พื้นที่ที่เลือก',elevationInfo:{mode:'relative-to-ground',offset:8}});
const map=new Map({basemap:'satellite',ground:'world-elevation',layers:[buildings,stations,focusLayer]});
const view=new SceneView({container:'view',map,qualityProfile:'medium',camera:{position:{longitude:100.6,latitude:14.1,z:45000},tilt:55,heading:0},environment:{lighting:{directShadowsEnabled:true},atmosphereEnabled:true}});
view.popup.defaultPopupTemplateEnabled=true;
let request=0,controller,lastCenter=null,allStations=[];
const number=v=>v===null||v===undefined||v===''?null:Number.isFinite(Number(v))?Number(v):null;
const valid=(lat,lon)=>number(lat)!==null&&number(lon)!==null&&Math.abs(lat)<=90&&Math.abs(lon)<=180;
const text=v=>String(v??'–').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const go=target=>view.goTo(target,{animate:!matchMedia('(prefers-reduced-motion: reduce)').matches}).catch(e=>{if(e.name!=='AbortError')note.textContent='ไม่สามารถย้ายมุมมองไปยังตำแหน่งนี้ได้'});
function pin(lat,lon,label,layer=focusLayer,color='#7741a5'){if(!valid(lat,lon))return;layer.add(new Graphic({geometry:{type:'point',longitude:Number(lon),latitude:Number(lat)},symbol:{type:'point-3d',symbolLayers:[{type:'icon',resource:{primitive:'circle'},material:{color},size:12,outline:{color:'white',size:2}}]},popupTemplate:{title:text(label||'จุดที่เลือก'),content:'ตำแหน่งสำหรับสำรวจพื้นที่'}}))}
async function loadBuildings(lat,lon){lastCenter={lat,lon};const token=++request;controller?.abort();buildings.removeAll();if(!buildings.visible)return;controller=new AbortController();const timer=setTimeout(()=>controller.abort(),18000);note.textContent='กำลังโหลดอาคารรอบจุดที่เลือก…';try{
const d=.012,query='[out:json][timeout:15];way["building"]('+[lat-d,lon-d,lat+d,lon+d].join(',')+');out tags geom 700;';const response=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:new URLSearchParams({data:query}),signal:controller.signal});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(token!==request)return;
let estimated=0;const graphics=(data.elements||[]).filter(e=>e.geometry?.length>=4).map(e=>{const tags=e.tags||{},explicit=/^\d+(\.\d+)?\s*(m)?$/.test(tags.height||'')?parseFloat(tags.height):null,levels=number(tags['building:levels']);const height=explicit??(levels>0?levels*3:9);if(explicit===null)estimated++;const ring=e.geometry.map(p=>[p.lon,p.lat]);if(ring[0][0]!==ring.at(-1)[0]||ring[0][1]!==ring.at(-1)[1])ring.push(ring[0]);return new Graphic({geometry:{type:'polygon',rings:[ring],spatialReference:{wkid:4326}},symbol:{type:'polygon-3d',symbolLayers:[{type:'extrude',size:Math.min(500,Math.max(2,height)),material:{color:'#e7dfd1'},edges:{type:'solid',color:'#c1b5a1',size:.4}}]},popupTemplate:{title:text(tags.name||'อาคาร OpenStreetMap'),content:'ความสูงแสดงผล '+text(height)+' ม. · '+(explicit===null?'ค่าประมาณจากจำนวนชั้น × 3 ม. หรือค่าเริ่มต้น 9 ม.':'ตามค่า height ใน OSM')+'<br>ไม่ใช้เป็นข้อมูลออกแบบหรือวิเคราะห์น้ำท่วม<br>© OpenStreetMap contributors · ODbL'}})});buildings.addMany(graphics);note.textContent=graphics.length?'อาคาร OSM '+graphics.length+' หลัง · ความสูงประมาณ '+estimated+' หลัง · แสดงเฉพาะบริเวณรอบจุดที่เลือก':'พื้นที่นี้ยังไม่มีอาคาร OSM ให้แสดง ภาพถ่ายและภูมิประเทศยังดูได้';
}catch(e){if(token===request)note.textContent='โหลดอาคาร OSM ไม่สำเร็จ ภาพถ่ายและภูมิประเทศ 3 มิติยังใช้งานได้'}finally{clearTimeout(timer)}}
function focus(d){if(!valid(d.lat,d.lon))return;const lat=Number(d.lat),lon=Number(d.lon);focusLayer.removeAll();pin(lat,lon,d.label||'พื้นที่ที่เลือก');go({center:[lon,lat],scale:Math.min(Number(d.scale)||22000,75000),tilt:62,heading:15});loadBuildings(lat,lon)}
receive=d=>{if(!d||typeof d.type!=='string')return;if(d.type==='flood-map-focus')focus(d);if(d.type==='flood-province-scope'&&d.estate)focus({...d.estate,label:d.name});if(d.type==='flood-watch-clear')focusLayer.removeAll();if(d.type==='flood-watch-focus'){focusLayer.removeAll();(d.estates||[]).forEach(e=>pin(e.lat,e.lon,e.name));if(focusLayer.graphics.length)go({target:focusLayer.graphics.toArray(),tilt:55})}};
document.getElementById('tilt').onclick=()=>go({tilt:62});document.getElementById('top').onclick=()=>go({tilt:0});document.getElementById('north').onclick=()=>go({heading:0});document.getElementById('base').onchange=e=>map.basemap=e.target.value;document.getElementById('buildings').onchange=e=>{buildings.visible=e.target.checked;if(buildings.visible&&lastCenter)loadBuildings(lastCenter.lat,lastCenter.lon)};
view.when(async()=>{ready=true;clearTimeout(timeout);document.getElementById('failure').style.display='none';note.textContent='แผนที่ 3 มิติพร้อมใช้งาน · เลือกนิคมฯ เพื่อสำรวจอาคาร';pending.splice(0).forEach(receive);parent.postMessage({type:'flood-water-ready'},location.origin);try{allStations=await window.IEAT_RID.load();allStations.filter(r=>valid(r.lat,r.lon)).forEach(r=>{const wl=number(r.wl),bank=number(r.bank),color=wl===null?'#738090':bank!==null&&wl>=bank?'#d32f2f':'#2185d5';const g=new Graphic({geometry:{type:'point',longitude:Number(r.lon),latitude:Number(r.lat)},symbol:{type:'point-3d',symbolLayers:[{type:'icon',resource:{primitive:'circle'},material:{color},size:8,outline:{color:'white',size:1}}]},popupTemplate:{title:text(r.name),content:'ระดับน้ำ '+text(wl)+' ม.รทก.<br>ระดับตลิ่ง '+text(bank)+' ม.รทก.<br>อัตราการไหล '+text(r.flow)+' ลบ.ม./วินาที<br>ตรวจวัด '+text(r.measured_at)+'<br>แหล่งข้อมูล RID GeoJSON · ตรวจเวลาแต่ละสถานี'}});stations.add(g)})}catch(e){note.textContent+=' · โหลดสถานี RID ไม่สำเร็จ'}}).catch(()=>{clearTimeout(timeout);document.getElementById('failure').style.display='block'});
},function(){clearTimeout(timeout);document.getElementById('failure').style.display='block'});
</script></body></html>
