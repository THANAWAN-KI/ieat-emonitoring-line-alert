<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แผนที่ 3 มิติ | IEAT</title><link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css"><style>html,body,#view{height:100%;margin:0;font:14px Tahoma,sans-serif}#tools{position:absolute;top:12px;right:12px;z-index:3;background:#fffefb;padding:10px;border-radius:14px;box-shadow:0 4px 18px #0002;max-width:270px}button,select{font:inherit;padding:8px;border:0;border-radius:8px;background:#eaf2fa;margin:3px;cursor:pointer}#note{font-size:12px;line-height:1.6;max-width:260px}#failure{display:none;position:absolute;inset:30%;background:white;padding:20px;z-index:5}a{color:#125b99}#view:focus-visible,button:focus-visible{outline:3px solid #2185d5}</style><script src="https://js.arcgis.com/4.32/"></script><script src="flood-estate-plans-2569.js?v=20261007-plans54-mobile3"></script><script src="flood-rid-source.js?v=20261006-rid-17"></script></head><body><div id="view" aria-label="แผนที่ภูมิประเทศและข้อมูลน้ำ 3 มิติ"></div><div id="tools"><b>สำรวจพื้นที่ 3 มิติ</b><div><button id="tilt">มุมเอียง 3 มิติ</button><button id="top">มองจากด้านบน</button><button id="north">ทิศเหนือ</button></div><label>แผนที่ฐาน <select id="base"><option value="satellite">ภาพถ่ายดาวเทียม Esri</option><option value="hybrid">ภาพถ่ายพร้อมชื่อสถานที่</option></select></label><details open><summary>ชั้นข้อมูล</summary><div id="layers"></div></details><p id="dataStatus" style="font-size:12px;max-height:160px;overflow:auto" role="status"></p><p id="note" role="status">กำลังเปิดแผนที่ 3 มิติ…</p><small>ลากเมาส์ขวาเพื่อหมุน / เอียง · เลื่อนเพื่อซูม</small><div><a href="flood-hydrology-map.html">แผนที่ 2 มิติและชั้นข้อมูลเดิม</a></div></div><div id="failure" role="alert">เปิดแผนที่ 3 มิติไม่สำเร็จ ต้องใช้เบราว์เซอร์ที่รองรับ WebGL และเชื่อมต่อบริการแผนที่<br><a href="flood-hydrology-map.html">เปิดแผนที่ 2 มิติ</a></div><script>
'use strict';
const note=document.getElementById('note'),pending=[];let ready=false,receive;
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;if(ready)receive(e.data);else if(pending.length<20)pending.push(e.data)});
const timeout=setTimeout(()=>{if(!ready)document.getElementById('failure').style.display='block'},35000);
require(['esri/Map','esri/views/SceneView','esri/layers/GraphicsLayer','esri/Graphic','esri/layers/FeatureLayer','esri/layers/WebTileLayer','esri/layers/MediaLayer','esri/layers/support/ImageElement','esri/geometry/Extent'],function(Map,SceneView,GraphicsLayer,Graphic,FeatureLayer,WebTileLayer,MediaLayer,ImageElement,Extent){
const stations=new GraphicsLayer({title:'สถานีระดับน้ำ RID',elevationInfo:{mode:'relative-to-ground',offset:6}}),focusLayer=new GraphicsLayer({title:'พื้นที่ที่เลือก',elevationInfo:{mode:'relative-to-ground',offset:8}});
const map=new Map({basemap:'satellite',ground:'world-elevation',layers:[stations,focusLayer]});
const view=new SceneView({container:'view',map,qualityProfile:'medium',camera:{position:{longitude:100.6,latitude:14.1,z:45000},tilt:55,heading:0},environment:{lighting:{directShadowsEnabled:true},atmosphereEnabled:true}});
view.popup.defaultPopupTemplateEnabled=true;
let allStations=[];
const number=v=>v===null||v===undefined||v===''?null:Number.isFinite(Number(v))?Number(v):null;
const valid=(lat,lon)=>number(lat)!==null&&number(lon)!==null&&Math.abs(lat)<=90&&Math.abs(lon)<=180;
const text=v=>String(v??'–').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const go=target=>view.goTo(target,{animate:!matchMedia('(prefers-reduced-motion: reduce)').matches}).catch(e=>{if(e.name!=='AbortError')note.textContent='ไม่สามารถย้ายมุมมองไปยังตำแหน่งนี้ได้'});
function pin(lat,lon,label,layer=focusLayer,color='#7741a5'){if(!valid(lat,lon))return;layer.add(new Graphic({geometry:{type:'point',longitude:Number(lon),latitude:Number(lat)},symbol:{type:'point-3d',symbolLayers:[{type:'icon',resource:{primitive:'circle'},material:{color},size:12,outline:{color:'white',size:2}}]},popupTemplate:{title:text(label||'จุดที่เลือก'),content:'ตำแหน่งสำหรับสำรวจพื้นที่'}}))}


const statuses=new Map(), layerHost=document.getElementById('layers');
function status(name,value){statuses.set(name,value);document.getElementById('dataStatus').textContent=[...statuses].map(([k,v])=>k+': '+v).join(' · ')}
function control(layer,label){const el=document.createElement('label');el.style.cssText='display:block;font-size:12px;padding:3px';const input=document.createElement('input');input.type='checkbox';input.checked=layer.visible;input.onchange=()=>layer.visible=input.checked;el.append(input,document.createTextNode(label));layerHost.append(el)}
control(stations,'ระดับน้ำ RID');control(focusLayer,'จุดที่เลือก / เฝ้าระวัง');
const estateLayer=new GraphicsLayer({title:'นิคมอุตสาหกรรม',elevationInfo:{mode:'relative-to-ground',offset:5}}),damLayer=new GraphicsLayer({title:'เขื่อนและอ่างเก็บน้ำ'}),canalLayer=new GraphicsLayer({title:'คลอง กทม.'}),cameraLayer=new GraphicsLayer({title:'CCTV ริมน้ำ'}),thaiwaterLayer=new GraphicsLayer({title:'สถานี ThaiWater'});
for(const layer of [estateLayer,damLayer,canalLayer,cameraLayer,thaiwaterLayer]){map.add(layer);control(layer,layer.title)}
const boundary=new FeatureLayer({url:'https://services5.arcgis.com/XbJa06Lil6auloCa/arcgis/rest/services/e_PP/FeatureServer/0',title:'ขอบเขตนิคมฯ กนอ.',outFields:['*'],elevationInfo:{mode:'on-the-ground'},renderer:{type:'simple',symbol:{type:'simple-fill',color:[110,65,165,.08],outline:{color:'#8857c5',width:2}}},popupTemplate:{title:'ขอบเขตนิคมฯ',content:[{type:'fields',fieldInfos:[{fieldName:'นิคมอุตสาหกรรม',label:'นิคมอุตสาหกรรม'}]}]}});map.add(boundary);control(boundary,boundary.title);boundary.load().then(()=>status('ขอบเขต','เชื่อมต่อแล้ว')).catch(()=>status('ขอบเขต','โหลดไม่สำเร็จ'));
const nameOf=v=>typeof v==='object'&&v?String(v.th||v.en||''):String(v??'–');
const val=v=>number(v)===null?'ไม่มีข้อมูล':Number(v).toLocaleString('th-TH',{maximumFractionDigits:2});
async function json(url){const r=await fetch(url,{signal:AbortSignal.timeout(25000),cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function addRows(layer,rows,kind){const graphics=[];for(const r of rows||[]){const lat=number(r.lat),lon=number(r.lng??r.lon);if(!valid(lat,lon))continue;const colors={estate:'#7741a5',dam:'#006ba6',canal:'#00a1a7',camera:'#555',water:'#2185d5'},shape=kind==='dam'?'triangle':kind==='camera'?'square':'circle';
 const box=document.createElement('div');box.style.lineHeight='1.7';const line=t=>{const el=document.createElement('div');el.textContent=t;box.append(el)};
 line(nameOf(r.province||r.district||''));if(kind==='water'||kind==='canal'){line('ระดับน้ำ '+val(r.wl)+' ม.รทก.');line('ระดับตลิ่ง '+val(r.bank)+' ม.รทก.');line('อัตราการไหล '+val(r.discharge??r.flow)+' ลบ.ม./วินาที');if(number(r.wl)!==null&&number(r.bank)!==null)line('เทียบตลิ่ง '+val(r.wl-r.bank)+' ม. (+ สูงกว่าตลิ่ง)')}
 if(kind==='dam'){line('เก็บกัก '+val(r.storage)+' ล้าน ลบ.ม. ('+val(r.percent)+'%)');line('น้ำเข้า '+val(r.inflow)+' ล้าน ลบ.ม./วัน');line('ระบาย '+val(r.released)+' ล้าน ลบ.ม./วัน');line('อัตราระบายเฉลี่ย '+val(number(r.released)===null?null:r.released*1000000/86400)+' ลบ.ม./วินาที · คำนวณจากยอดรายวัน')}
 if(typeof r.image==='string'&&r.image.startsWith('https://')){const img=document.createElement('img');img.src=r.image;img.alt='ภาพจากกล้องต้นทาง';img.style.maxWidth='100%';box.append(img)}line('เวลา '+nameOf(r.measured_at||r.date||r.datetime));line('แหล่งข้อมูล '+nameOf(r.source_name||r.agency||'ชุดข้อมูลเดิมของระบบ'));
 if(kind==='estate'){const plan=window.ieatEstatePlanPopup?.(r.name);if(plan){const host=document.createElement('div');host.innerHTML=plan;box.append(host)}else line('ยังไม่มีผังรับมือน้ำท่วมของพื้นที่นี้ในระบบ')}
 if(kind==='camera'){const link=document.createElement('a');link.href='https://telemetry.dwr.go.th/reportCctv';link.target='_blank';link.rel='noopener';link.textContent='เปิดภาพ CCTV จากกรมทรัพยากรน้ำ';box.append(link)}
 if(kind==='water'){const host=document.createElement('div');const select=document.createElement('select');for(const y of [2026,2025,2024,2023]){const option=document.createElement('option');option.value=y;option.textContent='ย้อนหลัง '+y;select.append(option)}const body=document.createElement('div');const load=async()=>{body.textContent='กำลังโหลดกราฟย้อนหลัง…';try{const d=await json('./data/water-history/waterlevel_'+select.value+'.json');const station=d.stations?.[String(r.oldcode||r.code||'').trim()];body.innerHTML=station?.days?.length?whChart(station,Number(select.value),r.bank):'ไม่มีข้อมูลย้อนหลังของสถานีนี้ในปีที่เลือก'}catch(e){body.textContent='โหลดข้อมูลย้อนหลังไม่สำเร็จ'}};const button=document.createElement('button');button.textContent='ดูกราฟย้อนหลัง';button.onclick=load;select.onchange=load;host.append(select,button,body);box.append(host)}
 graphics.push(new Graphic({geometry:{type:'point',longitude:lon,latitude:lat},symbol:{type:'point-3d',symbolLayers:[{type:'icon',resource:{primitive:shape},material:{color:kind==='water'&&number(r.wl)!==null&&number(r.bank)!==null&&r.wl>=r.bank?'#d32f2f':colors[kind]},size:kind==='estate'?12:9,outline:{color:'white',size:1.5}}]},popupTemplate:{title:text((r.code?r.code+' · ':'')+nameOf(r.name)),content:()=>box}}))}
 layer.removeAll();layer.addMany(graphics);status(layer.title,graphics.length+' จุด');}
async function job(name,fn){status(name,'กำลังโหลด');try{await fn()}catch(e){status(name,'โหลดไม่สำเร็จ · ไม่ได้แปลว่าไม่มีข้อมูล')}}
async function restoreData(){await Promise.allSettled([
job('นิคมฯ',async()=>{const d=await json('./data/thaiwater_latest.json');if(!Array.isArray(d.estates))throw Error();addRows(estateLayer,d.estates.map(r=>({...r,measured_at:d.generated_at,source_name:'กนอ.'})),'estate')}),
job('ThaiWater / เขื่อน',async()=>{const d=await json('./data/provincial_water_latest.json');if(!Array.isArray(d.feeds?.dam?.rows)||!Array.isArray(d.feeds?.water?.rows))throw Error();addRows(damLayer,d.feeds?.dam?.rows,'dam');addRows(thaiwaterLayer,d.feeds?.water?.rows,'water')}),
job('คลอง กทม.',async()=>{const d=await json('./data/bma_canal_latest.json');if(!Array.isArray(d.data))throw Error();addRows(canalLayer,d.data.map(r=>({code:r.station?.canal_oldcode,name:nameOf(r.station?.canal_name),lat:r.station?.canal_lat,lng:r.station?.canal_long,wl:r.canal_value,bank:r.station?.bank,measured_at:r.canal_datetime,source_name:'สำนักการระบายน้ำ กทม. ผ่าน Faonam'})),'canal')}),
job('CCTV',async()=>{const d=await json('./data/cctv_latest.json');if(!Array.isArray(d.rows))throw Error();addRows(cameraLayer,d.rows,'camera')}),
job('น้ำท่วมดาวเทียม',async()=>{const d=await json('https://faonam.com/api/gistda/flood');if(!d.tiles||!d.passes?.length)throw Error();const url=new URL(d.tiles,'https://faonam.com');if(url.origin!=='https://faonam.com')throw Error();const layer=new WebTileLayer({urlTemplate:url.href.replace(/%7B/gi,'{').replace(/%7D/gi,'}').replace('{z}','{level}').replace('{x}','{col}').replace('{y}','{row}'),title:'น้ำท่วมดาวเทียม GISTDA',opacity:.4,copyright:'GISTDA ผ่าน Faonam'});map.add(layer,0);control(layer,layer.title);status('น้ำท่วมดาวเทียม','วันที่ภาพ '+d.passes.map(p=>p.date).join(', '))}),
job('เรดาร์',async()=>{let d;try{d=await json('./data/tmd_radar_latest.json')}catch(e){d=await json('https://faonam.com/api/tmd/radar')}const frame=d.frames?.filter(f=>f.kind==='observed').sort((a,b)=>Date.parse(a.at)-Date.parse(b.at)).at(-1);if(!frame||!Array.isArray(d.bounds))throw Error();const [xmin,ymin,xmax,ymax]=d.bounds;let url=frame.url;if(!url.startsWith('data:image/png;base64,')){const u=new URL(url,'https://faonam.com');if(u.origin!=='https://faonam.com')throw Error();url=u.href}const layer=new MediaLayer({title:'เรดาร์ฝน กรมอุตุฯ',opacity:.5,source:[new ImageElement({image:url,georeference:{type:'extent-and-rotation',extent:new Extent({xmin,ymin,xmax,ymax,spatialReference:{wkid:4326}})}})]});map.add(layer,0);control(layer,layer.title);status('เรดาร์',frame.at)})
]);}
setInterval(()=>{if(!document.hidden)restoreData()},3600000);

const whFmt=val;
function whChart(station,year,bank){
 const days=station.days||[];if(!days.length)return '<div class="wh-empty">ไม่มีค่าระดับน้ำที่ ThaiWater ส่งกลับสำหรับปี '+year+'</div>';
 const W=720,H=300,L=48,R=704,T=20,B=252,bankValue=Number(bank),hasBank=bank!==null&&bank!==undefined&&bank!==''&&Number.isFinite(bankValue);
 const vals=days.flatMap(d=>[Number(d[1]),Number(d[2]),Number(d[3])]).filter(Number.isFinite);if(hasBank)vals.push(bankValue);
 let lo=Math.min(...vals),hi=Math.max(...vals);if(hi===lo){hi+=.5;lo-=.5}const pad=Math.max(.08,(hi-lo)*.08);lo-=pad;hi+=pad;
 const start=Date.parse(year+'-01-01T00:00:00+07:00'),end=Date.parse(year+'-12-31T23:59:59+07:00'),span=end-start;
 const x=d=>L+(Date.parse(d+'T12:00:00+07:00')-start)/span*(R-L),y=v=>B-(v-lo)/(hi-lo)*(B-T);
 const ticks=Array.from({length:5},(_,i)=>lo+(hi-lo)*i/4);
 const monthTicks=Array.from({length:12},(_,i)=>({x:L+i/11*(R-L),label:['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][i]}));
 const groups=[];let group=[];let previous=null;
 days.forEach(d=>{const at=Date.parse(d[0]+'T12:00:00+07:00');if(previous!==null&&at-previous>4*86400000){if(group.length)groups.push(group);group=[]}group.push(d);previous=at});if(group.length)groups.push(group);
 const bands=groups.map(g=>{const top=g.map((d,i)=>(i?'L':'M')+x(d[0]).toFixed(1)+' '+y(Number(d[2])).toFixed(1)).join(' '),bottom=g.slice().reverse().map(d=>'L'+x(d[0]).toFixed(1)+' '+y(Number(d[1])).toFixed(1)).join(' ');return '<path d="'+top+' '+bottom+' Z" fill="#90CAF9" opacity=".34"/>'}).join('');
 const lines=groups.map(g=>'<path d="'+g.map((d,i)=>(i?'L':'M')+x(d[0]).toFixed(1)+' '+y(Number(d[3])).toFixed(1)).join(' ')+'" fill="none" stroke="#2196F3" stroke-width="2"/>').join('');
 const bankLine=hasBank?'<path d="M'+L+' '+y(bankValue).toFixed(1)+'H'+R+'" stroke="#D32F2F" stroke-width="2.5" stroke-dasharray="9 6"/><rect x="'+(R-128)+'" y="'+(y(bankValue)-18).toFixed(1)+'" width="128" height="17" rx="5" fill="#FFFFFF" opacity=".92"/><text x="'+(R-5)+'" y="'+(y(bankValue)-6).toFixed(1)+'" text-anchor="end" style="fill:#D32F2F;font-weight:700">ตลิ่ง '+whFmt(bankValue)+' ม.รทก.</text>':'';
 return '<div class="wh-chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="กราฟระดับน้ำรายวัน '+year+(hasBank?' พร้อมเส้นระดับตลิ่ง':'')+'">'+ticks.map(v=>'<path d="M'+L+' '+y(v)+'H'+R+'" stroke="#FFFFFF"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+whFmt(v,1)+'</text>').join('')+monthTicks.map(m=>'<text x="'+m.x+'" y="276" text-anchor="middle">'+m.label+'</text>').join('')+bands+lines+bankLine+'<text x="8" y="12">ม.รทก.</text></svg></div>';
}

function focus(d){if(!valid(d.lat,d.lon))return;const lat=Number(d.lat),lon=Number(d.lon);focusLayer.removeAll();pin(lat,lon,d.label||'พื้นที่ที่เลือก');go({center:[lon,lat],scale:Math.min(Number(d.scale)||22000,75000),tilt:62,heading:15});note.textContent="แผนที่ภูมิประเทศ 3 มิติ · ข้อมูลและสถานะการโหลดอยู่ในเมนูชั้นข้อมูล"}
receive=d=>{if(!d||typeof d.type!=='string')return;if(d.type==='flood-map-focus')focus(d);if(d.type==='flood-province-scope'&&d.estate)focus({...d.estate,label:d.name});if(d.type==='flood-map-snapshot'){view.takeScreenshot({format:'png'}).then(result=>parent.postMessage({type:'flood-map-snapshot-result',id:d.id,dataUrl:result.dataUrl},location.origin)).catch(e=>parent.postMessage({type:'flood-map-snapshot-result',id:d.id,error:e.message},location.origin))}if(d.type==='flood-watch-clear')focusLayer.removeAll();if(d.type==='flood-watch-focus'){focusLayer.removeAll();(d.estates||[]).forEach(e=>pin(e.lat,e.lon,e.name));if(focusLayer.graphics.length)go({target:focusLayer.graphics.toArray(),tilt:55})}};
document.getElementById('tilt').onclick=()=>go({tilt:62});document.getElementById('top').onclick=()=>go({tilt:0});document.getElementById('north').onclick=()=>go({heading:0});document.getElementById('base').onchange=e=>map.basemap=e.target.value;
view.when(async()=>{ready=true;clearTimeout(timeout);document.getElementById('failure').style.display='none';note.textContent='แผนที่ 3 มิติพร้อมใช้งาน · เลือกนิคมฯ เพื่อสำรวจพื้นที่';restoreData();pending.splice(0).forEach(receive);parent.postMessage({type:'flood-water-ready'},location.origin);try{allStations=await window.IEAT_RID.load();status('RID',allStations.length+' จุด');addRows(stations,allStations,'water');}catch(e){status('RID','โหลดไม่สำเร็จ')}}).catch(()=>{clearTimeout(timeout);document.getElementById('failure').style.display='block'});
},function(){clearTimeout(timeout);document.getElementById('failure').style.display='block'});
</script></body></html>
