<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>สถานการณ์น้ำในพื้นที่นิคมอุตสาหกรรม | IEAT e-Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Sarabun","TH Sarabun New",sans-serif;font-size:16px;line-height:1.5;background:#f8fafc;color:#000}
main.container{height:auto;min-height:100dvh;padding:0;min-height:0;width:100%;max-width:none}#warning{height:100%;min-height:0}.dashboard-loading{padding:24px;color:#000;text-align:center;border-radius:20px;background:white}
@media(max-width:950px){html,body{height:auto}main.container{height:auto;padding:0}#warning{height:auto}}

/* Remove heading fills highlighted on the flood dashboard. */
#estateFocusDashboard .ef-map-head,
#estateFocusDashboard #riverSidePanel>h2{background:transparent!important}
/* Equal data and map columns on desktop. */
#estateFocusDashboard .ef-workspace{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}
#estateFocusDashboard .ef-data-column,#estateFocusDashboard .ef-map-column{min-width:0}
@media(max-width:950px){#estateFocusDashboard .ef-workspace{grid-template-columns:minmax(0,1fr)!important}}

/* Hide the weather summary, warning news, and flow widgets removed from this page. */
#estateFocusDashboard #floodWeatherOverview .today-copy,
#estateFocusDashboard #todayWarnings,
#estateFocusDashboard #riverSidePanel .rp-area-picker,
#estateFocusDashboard #rpFlowPanel,
#estateFocusDashboard #rpUpdated{display:none!important}
#estateFocusDashboard #rpSummary{display:none!important}

/* Keep the data column compact when its content is shorter than the viewport. */
#estateFocusDashboard .ef-data-column{height:auto!important;max-height:100dvh}
#estateFocusDashboard #riverSidePanel{margin-bottom:0;padding-bottom:0}
#estateFocusDashboard .rp-stations{margin-bottom:0;padding-bottom:0}
@media(max-width:950px){#estateFocusDashboard .ef-data-column{max-height:none}}

/* One desktop viewport: scroll data internally instead of leaving a blank tail beside the map. */
@media(min-width:951px){
html,body,main.container,#warning,#estateFocusDashboard{height:100dvh!important;min-height:0!important;overflow:hidden}
#estateFocusDashboard .ef-workspace{height:100%!important;min-height:0!important;align-items:stretch!important}
#estateFocusDashboard .ef-data-column{height:100%!important;max-height:100%!important;position:static!important;overflow-y:auto!important}
#estateFocusDashboard .ef-map-column{height:100%!important;min-height:0!important}
}

/* Readable flood dashboard typography and the four-color water theme. */
#estateFocusDashboard{font-size:17px!important}
#estateFocusDashboard .ef-panel>h2,#estateFocusDashboard #riverSidePanel h3,#estateFocusDashboard .rp-stations-title{font-size:19px!important}
#estateFocusDashboard .ef-panel p,#estateFocusDashboard .ef-panel small,#estateFocusDashboard #riverSidePanel p,#estateFocusDashboard #riverSidePanel small{font-size:13px!important;line-height:1.7}
#estateFocusDashboard #riverSidePanel .rp-station-top b{font-size:18px!important}
#estateFocusDashboard #riverSidePanel .rp-station-content strong{font-size:19px!important}
#estateFocusDashboard .rp-stations-title,#estateFocusDashboard #rpCards .rp-station-content,#estateFocusDashboard #rpCards .rp-station-content :not(em){color:#003666!important}
#estateFocusDashboard .rp-stations-title{background:#eaf2f9!important}
#estateFocusDashboard .ef-dam-card,#estateFocusDashboard .ef-reservoir-row{--water-bg:#edf5fc;--water-ink:#003666;background:var(--water-bg)!important;border:1px solid var(--water-accent)!important;border-left:4px solid var(--water-accent)!important}
#estateFocusDashboard [data-water-theme="red"]{--water-bg:#fff0f1;--water-ink:#8b1117}
#estateFocusDashboard [data-water-theme="yellow"]{--water-bg:#fff9e5;--water-ink:#715300}
#estateFocusDashboard [data-water-theme="orange"]{--water-bg:#fff2e7;--water-ink:#873c00}
#estateFocusDashboard [data-water-theme="unknown"]{--water-bg:#f2f5f8;--water-ink:#405466}
#estateFocusDashboard .ef-dam-card,#estateFocusDashboard .ef-dam-card h3,#estateFocusDashboard .ef-dam-card p,#estateFocusDashboard .ef-dam-card small,#estateFocusDashboard .ef-dam-card b,#estateFocusDashboard .ef-dam-card .ef-dam-value,#estateFocusDashboard .ef-reservoir-row,#estateFocusDashboard .ef-reservoir-row *{color:var(--water-ink)!important}
#estateFocusDashboard .ef-dam-card h3,#estateFocusDashboard .ef-reservoir-row b{font-size:17px!important}
#estateFocusDashboard .ef-dam-value{font-size:30px!important}
#estateFocusDashboard .ef-dam-flows div,#estateFocusDashboard .ef-dam-change{background:#ffffffa6!important}
#estateFocusDashboard .ef-dam-flows b{font-size:20px!important}
#estateFocusDashboard .ef-dam-card button{background:var(--water-accent)!important;color:var(--water-ink)!important;font-size:13px!important}
#estateFocusDashboard .ef-dam-card[data-water-theme="blue"] button,#estateFocusDashboard .ef-dam-card[data-water-theme="red"] button,#estateFocusDashboard .ef-dam-card[data-water-theme="orange"] button{color:#fff!important}
#estateFocusDashboard .ef-reservoir-percent span{background:var(--water-accent)!important;color:#fff!important}
#estateFocusDashboard .ef-reservoir-row[data-water-theme="yellow"] .ef-reservoir-percent span{color:#715300!important}
#estateFocusDashboard .ef-reservoir-bar{background:#ffffffb3!important}
#estateFocusDashboard .ef-reservoir-bar i{background:var(--water-accent)!important}
#estateFocusDashboard #floodWeatherOverview .forecast-card{font-size:14px}
</style>
<script src="flood-rid-source.js?v=20261006-rid-17" defer></script>
<script src="flood-estate-dashboard.js?v=20261006-water-theme-42" defer></script>
<script src="flood-river-panel.js?v=20261006-stations-open-40" defer></script>
<script src="flood-weather-overview.js?v=20261006-svg-weather-37" defer></script>
</head>
<body>
<main class="container"><section id="warning" aria-label="Dashboard สถานการณ์น้ำ"><div id="dashboardLoading" class="dashboard-loading" role="status">กำลังโหลดข้อมูลสถานการณ์น้ำ…</div><noscript>กรุณาเปิด JavaScript เพื่อใช้งาน dashboard</noscript></section></main>


</body>
</html>
