<script id="dashboard-reliable-boot">(function(){
 'use strict';
 // Run before deferred app scripts, even if a later script cannot initialize.
 if(window.AbortSignal&&window.AbortController&&!AbortSignal.timeout){
  AbortSignal.timeout=function(ms){var controller=new AbortController();setTimeout(function(){controller.abort();},ms);return controller.signal;};
 }
 var attempts=0,timer;
 function check(){
  var mounted=document.querySelector('#estateFocusDashboard .ef-workspace');
  if(mounted){clearInterval(timer);return;}
  var loading=document.getElementById('dashboardLoading');if(!loading)return;
  loading.style.cssText='display:block!important;position:fixed;top:24px;left:24px;right:24px;max-width:480px;margin:auto;padding:24px;background:white;color:#335238;border:1px solid #ffffff;border-radius:18px;box-shadow:0 8px 28px #2e1f5414;z-index:9999;font:16px/1.7 sans-serif';
  attempts++;
  if(attempts>=12&&!document.getElementById('dashboardRetry')){
   loading.innerHTML='<strong>ยังเปิดข้อมูลไม่สำเร็จ</strong><p>การโหลดอาจติดขัด กรุณาลองอีกครั้ง</p><button type="button" id="dashboardRetry" style="font:inherit;border:0;border-radius:10px;background:#109dc0;color:white;padding:10px 18px;cursor:pointer">โหลดหน้าใหม่</button>';
   document.getElementById('dashboardRetry').onclick=function(){var url=new URL(location.href);url.searchParams.set('reload',Date.now());location.replace(url.href);};
  }
 }
 timer=setInterval(check,1000);
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',check);else check();
})();
</script>

<script id="flood-sequential-script">
/* Only move existing data sections; appearance is defined in the canonical stylesheet. */
(()=>{
let queued=false;
function arrange(){
 queued=false;
 const col=document.querySelector('.ef-data-column');if(!col)return;
 const stations=col.querySelector('.rp-stations');
 if(stations){stations.id='floodStationsSection';const title=stations.querySelector('.rp-stations-title');if(title&&title.textContent!=='สถานีระดับน้ำ')title.textContent='สถานีระดับน้ำ'}
 let dams=document.getElementById('floodDamsSection');
 if(!dams){dams=document.createElement('section');dams.id='floodDamsSection';dams.setAttribute('aria-label','เขื่อนและอ่างเก็บน้ำ');dams.innerHTML='<h2>เขื่อนและอ่างเก็บน้ำ</h2>';col.append(dams)}
 for(const selector of ['.ef-related-dams','.ef-reservoir-panel']){const panel=col.querySelector(selector);if(panel&&panel.parentElement!==dams)dams.append(panel)}
 const flows=document.getElementById('efDamFlowPanel');if(flows&&flows.parentElement!==col)col.append(flows);
 const diagram=document.getElementById('rpMainRiver')?.closest('.rp-new-section');
 if(diagram){diagram.id='floodWaterDiagram';if(diagram.parentElement!==col)col.append(diagram);const title=diagram.querySelector('h3');if(title&&title.textContent!=='ผังน้ำและสถานีตามสายน้ำ')title.textContent='ผังน้ำและสถานีตามสายน้ำ'}
}
new MutationObserver(()=>{if(!queued){queued=true;requestAnimationFrame(arrange)}}).observe(document.getElementById('warning'),{childList:true,subtree:true});arrange();
})();

<script id="ieat-water-station-carousel-script">
(()=>{
const perPage=1;let page=0,pager=null,lastCards=[];
function render(){
const host=document.getElementById('rpCards');if(!host)return;
const cards=Array.from(host.children).filter(el=>el.matches('.rp-card'));
if(!cards.length)return;
const changed=cards.length!==lastCards.length||cards.some((card,i)=>card!==lastCards[i]);
if(changed){page=0;lastCards=cards.slice()}
const pages=Math.ceil(cards.length/perPage);page=Math.max(0,Math.min(page,pages-1));
cards.forEach((card,i)=>{const hide=Math.floor(i/perPage)!==page;card.classList.toggle('ieat-page-hidden',hide);card.hidden=hide});
if(!pager){
pager=document.createElement('nav');pager.id='ieatWaterStationPager';pager.setAttribute('aria-label','เปลี่ยนหน้าสถานีระดับน้ำ');
pager.innerHTML='<button type="button" data-dir="-1" aria-label="หน้าก่อนหน้า">‹ ก่อนหน้า</button><span class="ieat-page-count" aria-live="polite"></span><button type="button" data-dir="1" aria-label="หน้าถัดไป">ถัดไป ›</button>';
host.after(pager);
pager.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{page+=Number(b.dataset.dir);render()}));
}
pager.querySelector('[data-dir="-1"]').disabled=page===0;
pager.querySelector('[data-dir="1"]').disabled=page>=pages-1;
const count=(page+1)+' / '+pages;if(pager.querySelector('.ieat-page-count').textContent!==count)pager.querySelector('.ieat-page-count').textContent=count;
pager.hidden=pages<=1;
let footer=document.getElementById('ieatStationFooter');
if(!footer){footer=document.createElement('div');footer.id='ieatStationFooter';host.after(footer)}
const stamp=cards[page]?.querySelector('.rp-row-time');
let footerTime=footer.querySelector('.ieat-station-footer-time');
if(!footerTime){footerTime=document.createElement('small');footerTime.className='ieat-station-footer-time';footer.prepend(footerTime)}
const stampText=stamp?.textContent||'';
if(footerTime.textContent!==stampText)footerTime.textContent=stampText;
if(pager.parentElement!==footer)footer.append(pager);

const caption=host.previousElementSibling;
if(caption?.classList.contains('flood-row-caption')){
const label=cards.length+' รายการ · แสดง '+(page*perPage+1)+'–'+Math.min((page+1)*perPage,cards.length)+' · กดปุ่มเพื่อดูหน้าถัดไป';
if(caption.textContent!==label)caption.textContent=label;
}
}
let scheduled=false;function schedule(){if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;render()})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule,{once:true});else schedule();
const timer=setInterval(()=>{const host=document.getElementById('rpCards');if(!host)return;const cards=Array.from(host.children).filter(el=>el.matches('.rp-card'));if(cards.length!==lastCards.length||cards.some((c,i)=>c!==lastCards[i])||!document.getElementById('ieatWaterStationPager'))schedule()},1200);
window.addEventListener('resize',schedule);
})();
</script><script src="flood-exhibition-preparedness.js?v=20261105-prep-shared-scope"></script><script id="flood-two-modes">(()=>{

let view='overview',scope=window.IEAT_FLOOD_PROVINCE_SCOPE||{},scroll=0,mounted=false;

 const stationRows=stations.map(id=>'<tr><th scope="row">สถานีสูบน้ำ '+id+'</th><td><button type="button" data-prep-map-station="'+id+'" aria-label="ซูมไปสถานีสูบน้ำ '+id+'">ดูบนแผนที่ ↗</button></td></tr>').join('');

 const locationNote=hasLocation?'<p class="prep-page-note">↗ คลิกชื่อรายการเพื่อดูจุดอ้างอิงนิคมฯ บนแผนที่ แถวสถานีที่มีพิกัดจะซูมไปที่สถานีโดยตรง</p>':'';
 pane.innerHTML='<div class="prep-page-head"><small>การเตรียมรับมือ</small><h2>'+esc(p.name)+'</h2><p>ระบบป้องกันและระบายน้ำของพื้นที่</p></div>'+
 '<section class="prep-page-section"><h3 id="prepDataTitle">ข้อมูลที่ใช้ในการเตรียมรับมือ</h3><table class="prep-table" aria-labelledby="prepDataTitle"><thead><tr><th scope="col">รายการ</th><th scope="col">รายละเอียด</th></tr></thead><tbody>'+stationRows+planRows+'</tbody></table>'+locationNote+'</section>'+
 (p.image?'<a class="prep-page-source" href="'+esc(p.image)+'" target="_blank" rel="noopener">เปิดผังต้นฉบับ ↗</a>':'')+
 '<p class="prep-page-note">ที่มา '+esc(p.source||'ผังนิคมอุตสาหกรรม')+'<br>ข้อมูลอ้างอิงจากผังของพื้นที่'+(stations.length?' · ตำแหน่งสถานีบนแผนที่เป็นค่าประมาณ':'')+'</p>';
}
const supportTypes=[['water','ระดับน้ำ'],['canal','คลอง กทม.'],['dam','เขื่อน'],['camera','CCTV']];
let supportSignature='';
function selectedEstate(){return String(scope.name||scope.estate?.name||'')}
function refreshPrep(){
 renderPrep();
 if(window.IEAT_PREP_TABLES)return;
 supportSignature='';
 const pane=document.getElementById('preparednessPane');
 const section=document.createElement('section');
 section.className='prep-page-section prep-support';
 section.innerHTML='<h3>ข้อมูลสนับสนุน</h3><div data-prep-support-list><p>'+(selectedEstate()?'กำลังโหลดข้อมูลใกล้นิคมฯ…':'เลือกนิคมฯ ที่หน้าภาพรวมเพื่อดูจุดที่เกี่ยวข้อง')+'</p></div>';
 const table=pane.querySelector('.prep-table')?.closest('section');
 if(table)table.after(section);else pane.append(section);
}
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||e.source!==document.getElementById('estateFocusMap')?.contentWindow||e.data?.type!=='flood-prep-points'||view!=='preparedness')return;
 const {estate,ready,rows}=e.data;
 if(!estate||estate!==selectedEstate()||!ready||!Array.isArray(rows))return;
 const host=document.querySelector('[data-prep-support-list]');
 const signature=JSON.stringify(rows);
 if(!host||signature===supportSignature)return;
 const opened=new Set([...host.querySelectorAll('details[open]')].map(el=>el.dataset.kind));
 supportSignature=signature;
 host.innerHTML=supportTypes.map(([kind,label])=>{
  const group=rows.filter(r=>r.kind===kind);
  return '<details data-kind="'+kind+'" '+(opened.has(kind)?'open':'')+'><summary>'+label+' ('+group.length+')</summary>'+
   (group.length?'<ul>'+group.map(r=>'<li><button type="button" data-prep-point="'+esc(r.key)+'">'+esc([r.code,r.name].filter(Boolean).join(' · '))+' ↗</button></li>').join('')+'</ul>':'<p>ไม่พบจุดใกล้นิคมฯ ที่เลือก</p>')+'</details>';
 }).join('');
});
function select(next){

 if(view==='overview')scroll=col.scrollTop;

 document.querySelectorAll('[data-flood-view-tab]').forEach(b=>{const active=b.dataset.floodViewTab===view;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1});
 col.setAttribute('aria-labelledby','floodTab-'+view);document.getElementById('preparednessPane').hidden=view!=='preparedness';
 if(view==='preparedness'){refreshPrep();col.scrollTop=0;}else{col.scrollTop=scroll;send({type:'flood-support-close'})}
 send({type:'flood-prep-support',active:view==='preparedness'});
}
function mount(){
 if(mounted)return true;const col=document.querySelector('.ef-data-column');if(!col)return false;mounted=true;
 col.id='floodInformationPane';col.setAttribute('role','tabpanel');
 const bar=document.createElement('header');bar.id='floodModeBar';bar.innerHTML='<nav role="tablist" aria-label="มุมมองแดชบอร์ดน้ำท่วม"><button type="button" role="tab" id="floodTab-overview" data-flood-view-tab="overview" aria-controls="floodInformationPane">'+(window.IEAT_ICONS?.svg('layers')||'')+'ภาพรวม</button><button type="button" role="tab" id="floodTab-preparedness" data-flood-view-tab="preparedness" aria-controls="floodInformationPane">'+(window.IEAT_ICONS?.svg('protection')||'')+'การเตรียมรับมือ</button></nav><span id="floodModeEstate"></span>';
 document.body.appendChild(bar);const pane=document.createElement('section');pane.id='preparednessPane';pane.hidden=true;col.appendChild(pane);
 bar.addEventListener('click',e=>{const b=e.target.closest('[data-flood-view-tab]');if(b)select(b.dataset.floodViewTab)});
 bar.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)||!e.target.matches('[role="tab"]'))return;e.preventDefault();const next=e.key==='Home'?'overview':e.key==='End'?'preparedness':view==='overview'?'preparedness':'overview';select(next);document.getElementById('floodTab-'+next).focus()});
 document.getElementById('estateFocusMap')?.addEventListener('load',()=>send({type:'flood-prep-support',active:view==='preparedness'}));
 pane.addEventListener('click',e=>{const point=e.target.closest('[data-prep-point]');if(point){send({type:'flood-prep-point',key:point.dataset.prepPoint,estate:selectedEstate()});return}const row=e.target.closest('tr');const reference=row?.querySelector('[data-prep-reference]');if(reference){send({type:'flood-prep-reference',estate:selectedEstate(),label:reference.firstChild.textContent.trim(),value:row.cells[1].textContent});return}const b=row?.querySelector('[data-prep-map-station]');if(b)send({type:'flood-support-open',estate:scope.name||scope.estate?.name,station:Number(b.dataset.prepMapStation)})});
 renderPrep();select('overview');return true;

</script><script id="reference-map-shell-behavior">(()=>{'use strict';
