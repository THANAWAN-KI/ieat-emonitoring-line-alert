<style>
#estateFocusDashboard #rpCards,#estateFocusDashboard #efRelatedDams,#estateFocusDashboard #efCanalList{
 overflow-y:auto!important;overflow-x:hidden!important;max-height:650px!important;scrollbar-width:thin;scrollbar-color:#b9ccdd transparent;padding:3px 6px 3px 3px;overscroll-behavior:contain;
}
.ef-scroll-caption{font-size:13px;color:#003666;margin:6px 0 10px}
</style>
<script>
(function(){
 const ids=['rpCards','efRelatedDams','efCanalList'];
 let scheduled=false;
 function resizeLists(){
  scheduled=false;
  ids.forEach(id=>{
   const host=document.getElementById(id);if(!host)return;
   const cards=[...host.children].filter(el=>el.matches('.rp-card,.ef-dam-card,.ef-canal-card'));
   if(!cards.length){host.style.removeProperty('max-height');return}
   const bounds=host.getBoundingClientRect(),tops=[];
   for(const card of cards){const top=Math.round(card.offsetTop);if(!tops.includes(top))tops.push(top);if(tops.length===4)break}
   if(tops.length>3){
    const bottom=Math.max(...cards.filter(c=>Math.round(c.offsetTop)<tops[3]).map(c=>c.getBoundingClientRect().bottom));
    host.style.setProperty('max-height',Math.ceil(bottom-bounds.top+8)+'px','important');
   }else host.style.setProperty('max-height','none','important');
   let caption=host.previousElementSibling;
   if(!caption?.classList.contains('ef-scroll-caption')){caption=document.createElement('p');caption.className='ef-scroll-caption';host.before(caption)}
   caption.textContent=cards.length+' รายการ'+(tops.length>3?' · แสดง 3 แถว เลื่อนดูรายการเพิ่มเติม':'');
  });
 }
 function schedule(){if(!scheduled){scheduled=true;requestAnimationFrame(resizeLists)}}
 function start(){
  ids.forEach(id=>{const host=document.getElementById(id);if(host)new MutationObserver(schedule).observe(host,{childList:true})});
  document.querySelector('.ef-data-column')?.addEventListener('load',schedule,true);
  window.addEventListener('resize',schedule);schedule();
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(start,200));else setTimeout(start,200);
})();
</script>

<script id="flood-executive-summary-bridge">
(function(){
 const button=document.getElementById('floodExecutiveButton'),pop=document.getElementById('floodExecutivePop'),frame=document.getElementById('floodExecutiveFrame');let selected='';
 function name(){return selected||document.getElementById('efSearch')?.value||''}
 function scope(){frame.contentWindow?.postMessage({type:'ieat-executive-estate',name:name()},location.origin)}
 function close(){pop.hidden=true;button.setAttribute('aria-expanded','false')}
 button.addEventListener('click',()=>{if(!pop.hidden){close();return}pop.hidden=false;button.setAttribute('aria-expanded','true');if(!frame.getAttribute('src'))frame.src='./flood-executive.html?embed=1&v=20261019-flood-summary';else scope()});
 frame.addEventListener('load',scope);
 document.addEventListener('input',event=>{if(event.target.id==='efSearch'){selected=event.target.value;scope()}});
 document.addEventListener('change',event=>{if(event.target.id==='efSearch'){selected=event.target.value;scope()}});
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!pop.hidden){close();button.focus()}});
 document.addEventListener('click',event=>{if(!pop.hidden&&!pop.contains(event.target)&&!button.contains(event.target))close()});
 window.addEventListener('message',event=>{
  if(event.origin!==location.origin)return;
  if(event.source===window.parent&&event.data?.type==='ieat-flood-estate'){selected=event.data.name||'';scope();return}
  if(event.source!==frame.contentWindow)return;
  if(event.data?.type==='ieat-executive-ready'){scope();return}
  if(event.data?.type==='ieat-executive-close'){close();button.focus();return}
  if(event.data?.type!=='ieat-executive-open-map')return;
  const focus=event.data.focus;if(focus?.type!=='flood-map-focus'||!Number.isFinite(Number(focus.lat))||!Number.isFinite(Number(focus.lon)))return;
  close();window.postMessage({type:'ieat-executive-map-focus',focus},location.origin);
 });
})();
</script>

<script id="flood-screen-fit-script">
(()=>{
 const desktop=matchMedia('(min-width:951px)');let mode='overview',page=0,queued=false;
 const definitions={overview:['ภาพรวม'],estates:['นิคมฯ / ท่าเรือ','.ef-estate-panel','#efEstates',2],stations:['สถานีระดับน้ำ','.rp-stations','#rpCards',2],rivers:['สายน้ำหลัก','#rpMainRiver','#rpMainGraph'],history:['ระดับน้ำย้อนหลัง','#rpHistoryPanel'],weather:['สภาพอากาศ','#floodWeatherOverview'],forecast:['พยากรณ์อากาศ 7 วัน','#floodWeatherOverview'],waterforecast:['คาดการณ์น้ำ 1–5 วัน','#rpForecastPanel'],dams:['เขื่อนที่เกี่ยวข้อง','.ef-related-dams','#efRelatedDams',1],reservoirs:['อ่างเก็บน้ำ','.ef-reservoir-panel','#efReservoirList',3],canals:['คลอง กทม.','.ef-canal-panel','#efCanalList',1],warnings:['พื้นที่เฝ้าระวัง 24 ชม.','.ef-warning','#efWarning24',1],warnings48:['พื้นที่เฝ้าระวัง 48 ชม.','.ef-warning','#efWarning48',1],rankings:['จุดวัดที่น้ำไหลผ่านมากที่สุด','#rpRankingsAfterWarning','#rpFlowRanks',3],damrank:['เขื่อนที่ปล่อยน้ำมากที่สุด','#rpRankingsAfterWarning','#rpDamRanks',3]};
 const get=s=>document.querySelector(s);
 function refresh(){queued=false;const col=get('.ef-data-column');if(!col)return;
 let controls=get('.fit-controls');if(!controls){controls=document.createElement('div');controls.className='fit-controls';controls.innerHTML='<select aria-label="เลือกหมวดข้อมูลแบบเต็มจอ">'+Object.entries(definitions).map(([key,d])=>'<option value="'+key+'">'+d[0]+'</option>').join('')+'</select><button type="button" data-fit-step="-1" aria-label="รายการก่อนหน้า">‹</button><span class="fit-page" aria-live="polite"></span><button type="button" data-fit-step="1" aria-label="รายการถัดไป">›</button>';col.prepend(controls);controls.querySelector('select').onchange=e=>select(e.target.value);controls.addEventListener('click',e=>{const b=e.target.closest('[data-fit-step]');if(b){page+=Number(b.dataset.fitStep);refresh()}})}
 col.querySelectorAll('[data-fit-panel]').forEach(el=>{el.classList.remove('fit-active')});col.querySelectorAll('[data-fit-hidden]').forEach(el=>el.removeAttribute('data-fit-hidden'));
 [...col.children].filter(el=>el!==controls).forEach(el=>el.dataset.fitPanel='');const river=get('#riverSidePanel');if(river)[...river.children].forEach(el=>el.dataset.fitPanel='');
 col.dataset.fitMode=mode;col.classList.toggle('fit-overview',mode==='overview');controls.querySelector('select').value=mode;
 function activate(el){if(!el)return;el.classList.add('fit-active');if(el.parentElement===river)river.classList.add('fit-active')}
 const d=definitions[mode];if(mode==='overview'){['#efProvinceScopeNote','.ef-estate-panel','#floodReferenceBoard'].forEach(s=>activate(get(s)))}else if(mode==='rivers'){activate(get('#rpMainRiver')?.closest('.rp-new-section'))}else activate(get(d[1]));if(mode==='waterforecast'){const panel=get('#rpForecastPanel');if(panel)panel.open=true}
 if(mode==='warnings'||mode==='warnings48'){for(const id of ['efDetails24','efDetails48']){const el=document.getElementById(id);if(el){el.open=true;if(desktop.matches&&id!==(mode==='warnings'?'efDetails24':'efDetails48'))el.dataset.fitHidden=''}}}if(mode==='rankings'||mode==='damrank'){const other=get(mode==='rankings'?'#rpDamRanks':'#rpFlowRanks')?.closest('.rp-new-section');if(desktop.matches&&other)other.dataset.fitHidden=''}let list=d[2]?get(d[2]):null;let size=d[3]||0;let pages=1;
 if(size&&list){const items=[...list.children].filter(el=>!el.matches('p,small'));pages=Math.max(1,Math.ceil(items.length/size));page=Math.max(0,Math.min(page,pages-1));if(desktop.matches)items.forEach((el,i)=>{if(i<page*size||i>=(page+1)*size)el.dataset.fitHidden=''})}
 controls.querySelector('.fit-page').textContent=size?(page+1)+' / '+pages:'';controls.querySelectorAll('button').forEach(b=>{b.hidden=!size;b.disabled=Number(b.dataset.fitStep)<0?page===0:page>=pages-1});
 if(desktop.matches)col.scrollTop=0;
 }
 function select(next){mode=next;page=0;refresh();const nav=get('.flood-nav');nav?.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.floodSection===({stations:'stations',rivers:'stations',history:'stations',dams:'dams',reservoirs:'dams',canals:'dams'}[mode]||'overview'))))}
 function schedule(){if(!queued){queued=true;requestAnimationFrame(refresh)}}
 const watcher=new MutationObserver(records=>{if(records.some(r=>r.type==='childList'&&!r.target.closest?.('.fit-controls')))schedule()});watcher.observe(document.getElementById('warning'),{childList:true,subtree:true});
 document.querySelector('.flood-nav').addEventListener('click',e=>{const b=e.target.closest('[data-flood-section]');if(!b)return;if(!desktop.matches){const target=get({overview:'.flood-overview',stations:'#riverSidePanel',dams:'.ef-related-dams',map:'.ef-map-column'}[b.dataset.floodSection]);target?.scrollIntoView({behavior:'smooth',block:'start'});return}e.stopImmediatePropagation();if(b.dataset.floodSection==='map'){document.getElementById('efMapFullscreen')?.click();return}select(b.dataset.floodSection)},true);
 document.addEventListener('click',e=>{if(!desktop.matches)return;const card=e.target.closest('[data-ef-card]');if(card)select(card.dataset.efCard==='ef24'?'warnings':card.dataset.efCard==='ef48'?'warnings48':'estates')},true);
 desktop.addEventListener('change',schedule);window.addEventListener('resize',schedule);schedule();
})();
</script>

const frame=$('estateFocusMap');if(frame){const url=new URL(frame.getAttribute('src'),location.href);url.searchParams.set('dashboard','clean');url.searchParams.set('v','20261020-water-visible');frame.src=url.href}return true}
if(!mount()){const observer=new MutationObserver(()=>{if(mount())observer.disconnect()});observer.observe($('warning'),{childList:true,subtree:true})}
})();
