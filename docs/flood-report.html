if(changed){page=0;lastCards=cards.slice()}
const pages=Math.ceil(cards.length/perPage);page=Math.max(0,Math.min(page,pages-1));

if(!pager||pager.parentElement!==host.parentElement){

pager.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{page+=Number(b.dataset.dir);render()}));
}
pager.querySelector('[data-dir="-1"]').disabled=page===0;
pager.querySelector('[data-dir="1"]').disabled=page>=pages-1;
const count=(page+1)+' / '+pages;if(pager.querySelector('.ieat-page-count').textContent!==count)pager.querySelector('.ieat-page-count').textContent=count;
pager.hidden=pages<=1;

if(caption?.classList.contains('flood-row-caption')){
const label=cards.length+' รายการ · แสดง '+(page*perPage+1)+'–'+Math.min((page+1)*perPage,cards.length)+' · กดปุ่มเพื่อดูหน้าถัดไป';

function sync(){document.body.dataset.referencePanel=open?'open':'closed';const col=document.getElementById('floodInformationPane');if(col){col.setAttribute('aria-hidden',String(!open));col.inert=!open}const mode=document.body.dataset.floodView||'overview';document.querySelectorAll('[data-reference-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.referenceMode===(open?mode:'map'))));document.getElementById('referencePanelToggle')?.setAttribute('aria-expanded',String(open));}
function mount(){if(mounted)return true;if(!document.getElementById('floodModeBar'))return false;mounted=true;const icon=k=>window.IEAT_ICONS?.svg(k)||'';const rail=document.createElement('aside');rail.id='referenceRail';rail.setAttribute('aria-label','เครื่องมือมุมมอง');rail.innerHTML='<button type="button" id="referencePanelToggle" aria-label="เปิดหรือปิดแผงข้อมูล" aria-controls="floodInformationPane" aria-expanded="true"><svg class="ieat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><nav class="reference-rail-modes" aria-label="เลือกมุมมอง"><button type="button" data-reference-mode="overview" title="ภาพรวม" aria-label="ภาพรวม">'+icon('layers')+'</button><button type="button" data-reference-mode="preparedness" title="การเตรียมรับมือ" aria-label="การเตรียมรับมือ">'+icon('protection')+'</button></nav>';document.body.appendChild(rail);
rail.addEventListener('click',e=>{const toggle=e.target.closest('#referencePanelToggle'),mode=e.target.closest('[data-reference-mode]');if(toggle){open=!open;sync();return}if(!mode)return;open=mode.dataset.referenceMode!=='map';if(open)document.getElementById('floodTab-'+mode.dataset.referenceMode)?.click();sync()});
document.getElementById('floodModeBar').addEventListener('click',e=>{if(!e.target.closest('[data-flood-view-tab]'))return;open=true;sync();queueMicrotask(sync)},true);document.getElementById('floodModeBar').addEventListener('keydown',()=>queueMicrotask(sync));sync();return true;}
function start(){if(mount())return;const observer=new MutationObserver(()=>{if(mount())observer.disconnect()});observer.observe(document.body,{childList:true,subtree:true})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();</script></body>
</html>
