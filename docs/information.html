let activeEstate=estates[0],activeTab="overview";const colors=["#54df37","#e75de9","#439149","#f2cc0b"];
function focusedMap(url){if(activeEstate===estates[0]||url.startsWith("./"))return url;const clean=url.replace(/([?&])center=[^&]*/,"$1").replace(/([?&])scale=[^&]*/,"$1").replace(/[?&]+$/,"");return clean+(clean.includes("?")?"&":"?")+"center="+activeEstate[2]+","+activeEstate[1]+"&scale="+activeEstate[3]}
function render(key){activeTab=key;const d=data[key],s=document.querySelector("#summary");s.innerHTML=d.metrics.map(x=>`<article class="card metric"><div><b>${x[1]}</b><span>${x[2]}</span></div></article>`).join("");chartTitle.textContent=d.chart;chartFilter.textContent=activeEstate[0]+"　⌄";bars.innerHTML=d.bars.map((h,i)=>`<div class="bar-wrap"><div class="bar" style="height:${h}%"><em>${d.labels[i]}</em></div><label>${d.labels[i]}</label></div>`).join("");donutValue.textContent=d.donut;donutTitle.textContent=d.donutTitle;donutText.textContent=d.donutText;gaugeSelect.textContent=d.gaugeTitle;gaugeValue.textContent=d.gauge;gaugeTitle.textContent=d.gaugeTitle;gaugeSide.textContent=d.gaugeSide;lowerTitle.textContent=d.lower;mapChip1.textContent=d.chips[0];mapChip2.textContent=d.chips[1];mapChip3.textContent=d.chips[2];legend.innerHTML=d.legend.map((x,i)=>`<span><i style="background:${colors[i]}"></i>${x}</span>`).join("");const url=focusedMap(d.map),keyId=key+activeEstate[0];if(mapFrame.dataset.key!==keyId){mapFrame.src=url;mapFrame.dataset.key=keyId}fullLink.href=url;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===key));history.replaceState(null,"","#"+key)}
function listEstates(q=""){const term=q.trim().toLowerCase(),rows=estates.filter(e=>e[0].toLowerCase().includes(term));estateList.innerHTML=rows.map((e,i)=>`<button class="estate-option ${e===activeEstate?"active":""}" data-name="${e[0]}">${e[0]}</button>`).join("");estateList.querySelectorAll("button").forEach(b=>b.onclick=()=>{activeEstate=estates.find(e=>e[0]===b.dataset.name);scopeBtn.textContent=activeEstate[0];estatePop.classList.remove("open");scopeBtn.setAttribute("aria-expanded","false");render(activeTab);loadWeather()})}
async function loadWeather(){[rainValue,humidityValue,directionValue,windValue].forEach(x=>x.textContent="กำลังโหลด");try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${activeEstate[1]}&longitude=${activeEstate[2]}&current=precipitation,relative_humidity_2m,wind_speed_10m,wind_direction_10m&timezone=Asia%2FBangkok`,r=await fetch(u),j=await r.json(),c=j.current;rainValue.textContent=(c.precipitation??0)+" มม.";humidityValue.textContent=(c.relative_humidity_2m??"-")+"%";directionValue.textContent=windDir(c.wind_direction_10m);windValue.textContent=(c.wind_speed_10m??"-")+" กม./ชม."}catch(e){[rainValue,humidityValue,directionValue,windValue].forEach(x=>x.textContent="ไม่พบข้อมูล")}}
function windDir(d){if(d==null)return"-";return["เหนือ","ตะวันออกเฉียงเหนือ","ตะวันออก","ตะวันออกเฉียงใต้","ใต้","ตะวันตกเฉียงใต้","ตะวันตก","ตะวันตกเฉียงเหนือ"][Math.round(d/45)%8]}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>render(t.dataset.tab));scopeBtn.onclick=e=>{e.stopPropagation();estatePop.classList.toggle("open");weatherPop.classList.remove("open");scopeBtn.setAttribute("aria-expanded",estatePop.classList.contains("open"));estateSearch.focus()};estateSearch.oninput=()=>listEstates(estateSearch.value);clock.onclick=e=>{e.stopPropagation();weatherPop.classList.toggle("open");estatePop.classList.remove("open");clock.setAttribute("aria-expanded",weatherPop.classList.contains("open"));if(weatherPop.classList.contains("open"))loadWeather()};document.addEventListener("click",e=>{if(!estatePop.contains(e.target)&&e.target!==scopeBtn)estatePop.classList.remove("open");if(!weatherPop.contains(e.target)&&e.target!==clock)weatherPop.classList.remove("open")});listEstates();
const now=new Date();period.textContent="ข้อมูล ณ วันที่ "+now.toLocaleDateString("th-TH",{day:"numeric",month:"long",year:"numeric"});function tick(){clock.textContent=new Date().toLocaleString("th-TH",{weekday:"short",day:"2-digit",month:"short",year:"2-digit",hour:"2-digit",minute:"2-digit"})+" น."}tick();setInterval(tick,60000);const first=location.hash.slice(1);render(data[first]?first:"overview");
