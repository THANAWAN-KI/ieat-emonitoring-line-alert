<template id="layout"><header class="head"><div><h1></h1><p></p></div><div class="actions"><a class="extra" target="_blank" rel="noopener"></a><a class="primary full" target="_blank" rel="noopener">เปิดเต็มหน้าจอ</a></div></header><div class="stats"></div><div class="grid"><article class="map"><div class="map-head"><b></b><span class="live">พร้อมแสดงผล</span></div><iframe class="frame" allow="local-network-access; geolocation" loading="lazy" allowfullscreen></iframe></article><aside class="info"><h2>องค์ประกอบข้อมูล</h2><p>เลือกดูรายละเอียดบนแผนที่และใช้ข้อมูลสรุปประกอบการนำเสนอระบบของศูนย์ฯ</p><div class="layers"></div><div class="tip">เลือกชั้นข้อมูลจาก Legend และคลิกตำแหน่งบนแผนที่เพื่อดูรายละเอียดเพิ่มเติม</div></aside></div></template>
<script>
const tabs=[...document.querySelectorAll(".tab")],views=[...document.querySelectorAll(".view")],tpl=document.querySelector("#layout");
views.forEach(v=>{const n=tpl.content.cloneNode(true);n.querySelector("h1").textContent=v.dataset.title;n.querySelector(".head p").textContent=v.dataset.sub;n.querySelector(".map-head b").textContent=v.dataset.map;n.querySelector("iframe").src=v.dataset.url;n.querySelector(".full").href=v.dataset.full;const e=n.querySelector(".extra");e.href=v.dataset.extra;e.textContent=v.dataset.extraLabel;v.querySelectorAll(".stat-data i").forEach(i=>n.querySelector(".stats").insertAdjacentHTML("beforeend",`<div class="stat"><label>${i.dataset.label}</label><b>${i.dataset.value}</b><span>${i.dataset.detail}</span></div>`));v.querySelectorAll(".layer-data i").forEach(i=>n.querySelector(".layers").insertAdjacentHTML("beforeend",`<div class="layer"><b>${i.dataset.name}</b><span>${i.dataset.text}</span></div>`));v.append(n)});
function openView(id){tabs.forEach(t=>t.classList.toggle("active",t.dataset.view===id));views.forEach(v=>v.classList.toggle("active",v.id===id));history.replaceState(null,"","#"+id)}tabs.forEach(t=>t.onclick=()=>openView(t.dataset.view));const h=location.hash.slice(1);openView(views.some(v=>v.id===h)?h:"gis");
</script></body></html>
