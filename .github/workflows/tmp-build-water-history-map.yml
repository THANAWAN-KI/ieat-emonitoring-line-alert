name: Temporary build water history map data

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-build-water-history-map.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ThaiWater map history
        run: python scripts/build_water_history_map.py
      - name: Commit map history data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/water-history/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build ThaiWater map history data"
            git pull --rebase origin main
            git push
          fi

# rerun after Python fix
