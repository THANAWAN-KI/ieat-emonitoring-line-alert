name: Update DSS Search Data

on:
  push:
    paths:
      - ".github/workflows/update_dss_data.yml"
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download DSS source data
        run: |
          mkdir -p docs
          curl --fail --location --retry 4 --retry-delay 10 --connect-timeout 30 --max-time 300 \
            --user-agent "Mozilla/5.0 IEAT-EMCC-DSS/1.0" \
            "https://emonitor.ieat.go.th/envisys/gis/file/hazardous8H8j51DukSmv9Opd4Z6dCVbuB5saueSIz2ErixyZp7lOdfcZX1t44oIdouDxWESk.json" \
            --output docs/dss-data.tmp.json
          python -m json.tool docs/dss-data.tmp.json > docs/dss-data.json
          rm docs/dss-data.tmp.json
      - name: Commit updated search data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add docs/dss-data.json
          git diff --cached --quiet || git commit -m "Update DSS search data"
          git push
