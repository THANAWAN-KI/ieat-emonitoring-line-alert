name: Generate Daily Situation Report

on:
  schedule:
    - cron: "30 0 * * *" # 07:30 Asia/Bangkok
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate daily situation data
        run: python scripts/generate_daily_situation.py
      - name: Commit daily report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/daily-report.json docs/daily-reports/ docs/news-images/
          git diff --cached --quiet || git commit -m "Update daily situation report"
          git push
