name: Temporary export water history GeoJSON

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-export-water-history-geojson.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build GeoJSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          root = Path("docs/data/water-history")
          index = json.loads((root / "index.json").read_text(encoding="utf-8"))

          bank_by_code = {}
          faonam_path = Path("docs/data/faonam_rivers_latest.json")
          if faonam_path.exists():
              try:
                  f = json.loads(faonam_path.read_text(encoding="utf-8"))
                  for r in f.get("rows", []):
                      code = str(r.get("oldcode") or r.get("code") or "").strip()
                      if code:
                          bank_by_code[code] = r.get("bank")
              except Exception:
                  pass

          features = []
          for year in [2023, 2024, 2025, 2026]:
              data = json.loads((root / f"waterlevel_{year}.json").read_text(encoding="utf-8"))
              for code, st in data.get("stations", {}).items():
                  meta = index.get("stations", {}).get(code, {})
                  lon = meta.get("lon", st.get("lon"))
                  lat = meta.get("lat", st.get("lat"))
                  if lon is None or lat is None:
                      continue
                  try:
                      lon = float(lon); lat = float(lat)
                  except Exception:
                      continue
                  bank = bank_by_code.get(code)
                  try:
                      bank = None if bank in (None, "") else float(bank)
                  except Exception:
                      bank = None

                  for d in st.get("days", []):
                      if len(d) < 5:
                          continue
                      date_text, daily_min, daily_max, daily_avg, raw_count = d[:5]
                      props = {
                          "station_code": code,
                          "station_id": str(meta.get("station_id") or st.get("station_id") or ""),
                          "station_name": meta.get("name") or st.get("name") or "",
                          "agency": meta.get("agency") or st.get("agency") or "",
                          "province": meta.get("province") or st.get("province") or "",
                          "amphoe": meta.get("amphoe") or st.get("amphoe") or "",
                          "basin": meta.get("basin") or st.get("basin") or "",
                          "date": date_text,
                          "date_iso": date_text + "T00:00:00+07:00",
                          "year": year,
                          "daily_min_msl": daily_min,
                          "daily_max_msl": daily_max,
                          "daily_avg_msl": daily_avg,
                          "raw_count": raw_count,
                          "bank_msl": bank,
                          "source": "ThaiWater / HII"
                      }
                      if bank is not None and daily_avg is not None:
                          try:
                              props["avg_vs_bank_m"] = round(float(daily_avg) - bank, 3)
                          except Exception:
                              props["avg_vs_bank_m"] = None
                      else:
                          props["avg_vs_bank_m"] = None
                      features.append({
                          "type": "Feature",
                          "geometry": {"type": "Point", "coordinates": [lon, lat]},
                          "properties": props
                      })

          out = {
              "type": "FeatureCollection",
              "name": "thaiwater_waterlevel_history_2023_2026",
              "features": features
          }
          out_path = Path("thaiwater_waterlevel_history_2023_2026.geojson")
          out_path.write_text(json.dumps(out, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")

          summary = {
              "features": len(features),
              "stations": len({f["properties"]["station_code"] for f in features}),
              "years": sorted({f["properties"]["year"] for f in features}),
              "size_bytes": out_path.stat().st_size
          }
          Path("export_summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False))
          PY
      - name: Upload GeoJSON
        uses: actions/upload-artifact@v4
        with:
          name: thaiwater-waterlevel-history-2023-2026-geojson
          path: |
            thaiwater_waterlevel_history_2023_2026.geojson
            export_summary.json
          if-no-files-found: error
          retention-days: 7
