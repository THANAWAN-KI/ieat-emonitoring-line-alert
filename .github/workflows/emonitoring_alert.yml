name: e-Monitoring Hourly LINE Alert

on:
  workflow_dispatch:
    inputs:
      preview_mode:
        description: "ส่ง Flex Card ตัวอย่างสมมติไปยังกลุ่ม Demo ทั้ง 3 กลุ่ม"
        required: false
        type: boolean
        default: false

  schedule:
    # ตรวจและส่ง LINE ทุก 1 ชั่วโมง เฉพาะเวลา 08:30–16:30 น. ตามเวลาประเทศไทย
    # GitHub Actions ใช้เวลา UTC: 01:30–09:30 UTC = 08:30–16:30 น. (Asia/Bangkok)
    - cron: "30 1-9 * * *"

permissions:
  contents: write

concurrency:
  group: emonitoring-hourly-line-alert
  cancel-in-progress: false

jobs:
  check-emonitoring:
    name: Check e-Monitoring and Send LINE
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show workflow information
        env:
          TZ: Asia/Bangkok
        run: |
          echo "================================================"
          echo "IEAT e-Monitoring Hourly LINE Alert"
          echo "Quota Saver: one summary message per changed run"
          echo "Active schedule: 08:30-16:30 Asia/Bangkok"
          echo "================================================"
          echo "Trigger: ${{ github.event_name }}"
          echo "Thailand time:"
          date
          echo "================================================"

      - name: Validate Python files
        run: |
          test -f "check_emonitoring.py"
          test -f "check_emonitoring_batch.py"
          python -m py_compile check_emonitoring.py
          python -m py_compile check_emonitoring_batch.py
          echo "Python files ผ่านการตรวจ Syntax"

      - name: Run e-Monitoring check and send LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ZONE_ROUTING_ENABLED: ${{ secrets.LINE_ZONE_ROUTING_ENABLED }}
          LINE_GROUP_ID_DEMO_01: ${{ secrets.LINE_GROUP_ID_DEMO_01 }}
          LINE_GROUP_ID_DEMO_02: ${{ secrets.LINE_GROUP_ID_DEMO_02 }}
          LINE_GROUP_ID_DEMO_03: ${{ secrets.LINE_GROUP_ID_DEMO_03 }}
          LINE_PREVIEW_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_mode || false }}
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Bangkok
        run: python check_emonitoring_batch.py

      - name: Publish latest status and alert state
        run: |
          if [ ! -f "docs/status.json" ]; then
            echo "ERROR: ไม่พบไฟล์ docs/status.json"
            exit 1
          fi

          if [ ! -f "docs/alert_state.json" ]; then
            echo "ERROR: ไม่พบไฟล์ docs/alert_state.json"
            exit 1
          fi

          if git diff --quiet -- docs/status.json docs/alert_state.json; then
            echo "ข้อมูลสถานการณ์และ alert state ไม่มีการเปลี่ยนแปลง"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/status.json docs/alert_state.json
          git commit -m "Update e-Monitoring status and alert state [skip ci]"
          git pull --rebase
          git push
