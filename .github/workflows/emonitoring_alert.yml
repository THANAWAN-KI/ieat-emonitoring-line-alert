name: e-Monitoring LINE Alert

on:
  # กดทดสอบเองจากหน้า GitHub Actions
  workflow_dispatch:

  # ทำงานอัตโนมัติทุก 1 ชั่วโมง
  schedule:
    - cron: "17 * * * *"
      timezone: "Asia/Bangkok"

permissions:
  contents: read

concurrency:
  group: emonitoring-line-alert
  cancel-in-progress: false

jobs:
  check-emonitoring:
    name: Check e-Monitoring and Send LINE
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. ดาวน์โหลดไฟล์จาก Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ติดตั้ง Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt

      # 3. แสดงเวลาที่ Workflow เริ่มทำงาน
      - name: Show current time
        env:
          TZ: "Asia/Bangkok"
        run: |
          echo "Workflow event: ${{ github.event_name }}"
          echo "เวลาเริ่มทำงาน:"
          date
          echo "Branch: ${{ github.ref_name }}"

      # 4. ตรวจสอบไฟล์ Python
      - name: Check required files
        run: |
          echo "ตรวจสอบไฟล์ใน Repository"
          ls -la

          if [ ! -f "check_emonitoring.py" ]; then
            echo "ERROR: ไม่พบไฟล์ check_emonitoring.py"
            exit 1
          fi

          echo "พบไฟล์ check_emonitoring.py"

      # 5. ติดตั้งไลบรารี Python
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            echo "ติดตั้งจาก requirements.txt"
            pip install -r requirements.txt
          else
            echo "ไม่พบ requirements.txt ติดตั้ง requests โดยตรง"
            pip install requests
          fi

      # 6. ตรวจสอบ Syntax
      - name: Validate Python syntax
        run: |
          python -m py_compile check_emonitoring.py
          echo "Python syntax ถูกต้อง"

      # 7. ตรวจสอบ LINE Channel Access Token
      - name: Check LINE secret
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            echo "ERROR: ไม่พบ Secret ชื่อ LINE_CHANNEL_ACCESS_TOKEN"
            exit 1
          fi

          echo "พบ LINE_CHANNEL_ACCESS_TOKEN แล้ว"

      # 8. ตรวจข้อมูลและส่งแจ้งเตือน LINE
      - name: Check e-Monitoring and send LINE Broadcast
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: "1"
          TZ: "Asia/Bangkok"
        run: |
          echo "เริ่มตรวจสอบข้อมูล e-Monitoring"
          python check_emonitoring.py
          echo "ประมวลผลเสร็จเรียบร้อย"
