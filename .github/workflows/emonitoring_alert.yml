name: e-Monitoring LINE Alert

on:
  # สำหรับกดทดสอบจากหน้า GitHub Actions
  workflow_dispatch:

  # ตรวจข้อมูลอัตโนมัติทุก 15 นาที
  # GitHub Actions ใช้เวลาตาม UTC แต่ทุก 15 นาทีเหมือนกันทุกเขตเวลา
  schedule:
    - cron: "7,22,37,52 * * * *"

# อนุญาตให้ Workflow บันทึก alert_state.json กลับเข้า Repository
permissions:
  contents: write

# ป้องกัน Workflow สองรอบทำงานพร้อมกัน
concurrency:
  group: emonitoring-line-alert
  cancel-in-progress: false

jobs:
  check-emonitoring:
    name: Check e-Monitoring and Send LINE
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ======================================================
      # 1. ดาวน์โหลดไฟล์จาก Default branch
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      # ======================================================
      # 2. ติดตั้ง Python
      # ======================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # 3. แสดงข้อมูลรอบการทำงาน
      # ======================================================
      - name: Show workflow information
        env:
          TZ: Asia/Bangkok
        run: |
          echo "========================================"
          echo "e-Monitoring LINE Alert"
          echo "========================================"
          echo "เหตุการณ์ที่เรียก Workflow: ${{ github.event_name }}"
          echo "Default branch: ${{ github.event.repository.default_branch }}"
          echo "เวลาไทย:"
          date
          echo "========================================"

      # ======================================================
      # 4. ตรวจสอบไฟล์ที่จำเป็น
      # ======================================================
      - name: Check required files
        run: |
          if [ ! -f "check_emonitoring.py" ]; then
            echo "ERROR: ไม่พบไฟล์ check_emonitoring.py"
            exit 1
          fi

          if [ ! -f "alert_state.json" ]; then
            echo "{}" > alert_state.json
            echo "สร้าง alert_state.json เริ่มต้นแล้ว"
          fi

          echo "พบไฟล์ check_emonitoring.py"
          echo "พบไฟล์ alert_state.json"

      # ======================================================
      # 5. ตรวจสอบรูปแบบ alert_state.json
      # ======================================================
      - name: Validate alert state
        run: |
          python -m json.tool alert_state.json > /dev/null
          echo "alert_state.json เป็น JSON ที่ถูกต้อง"

      # ======================================================
      # 6. ตรวจสอบ Syntax ของ Python
      # ======================================================
      - name: Validate Python syntax
        run: |
          python -m py_compile check_emonitoring.py
          echo "check_emonitoring.py ไม่มี Syntax Error"

      # ======================================================
      # 7. ตรวจสอบ LINE Channel Access Token
      # ======================================================
      - name: Check LINE secret
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            echo "ERROR: ไม่พบ GitHub Secret ชื่อ LINE_CHANNEL_ACCESS_TOKEN"
            exit 1
          fi

          echo "พบ LINE_CHANNEL_ACCESS_TOKEN แล้ว"

      # ======================================================
      # 8. ตรวจข้อมูล e-Monitoring และส่ง LINE
      # ======================================================
      - name: Check e-Monitoring and send LINE Broadcast
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          ALERT_STATE_FILE: alert_state.json
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Bangkok
        run: |
          echo "เริ่มตรวจสอบข้อมูล e-Monitoring"
          python check_emonitoring.py
          echo "ตรวจสอบข้อมูลเสร็จเรียบร้อย"

      # ======================================================
      # 9. ตรวจสอบไฟล์สถานะหลังประมวลผล
      # ======================================================
      - name: Validate updated alert state
        run: |
          python -m json.tool alert_state.json > /dev/null
          echo "alert_state.json หลังประมวลผลถูกต้อง"

      # ======================================================
      # 10. บันทึก alert_state.json กลับเข้า Repository
      # ======================================================
      - name: Save alert state to repository
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$(git status --porcelain -- alert_state.json)" ]; then
            echo "สถานะไม่มีการเปลี่ยนแปลง ไม่ต้อง Commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add alert_state.json
          git commit -m "Update e-Monitoring alert state [skip ci]"

          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"

          echo "บันทึก alert_state.json กลับเข้า Repository สำเร็จ"
