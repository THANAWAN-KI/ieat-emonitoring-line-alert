name: e-Monitoring Hourly LINE Alert

on:
  workflow_dispatch:
    inputs:
      preview_mode:
        description: "ส่ง Flex Card ตัวอย่างสมมติไปยังกลุ่ม Demo ทั้ง 3 กลุ่ม"
        required: false
        type: boolean
        default: false

  schedule:
    # เวลาไทย (UTC+7) วันจันทร์–ศุกร์
    # รอบหลัก :30 และรอบสำรอง :40 ป้องกัน GitHub ข้าม/หน่วง schedule
    # 01:30–08:40 UTC = 08:30–15:40 ไทย (สคริปต์กันการส่งซ้ำในแต่ละชั่วโมง)
    - cron: "30,40 1-8 * * 1-5"
    # 09:30 และ 09:40 UTC = 16:30/16:40 ไทย: สรุปรายวัน (มีตัวกันส่งซ้ำ)
    - cron: "30,40 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: emonitoring-hourly-line-alert
  cancel-in-progress: false

jobs:
  check-emonitoring:
    name: Check e-Monitoring and Send LINE
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show workflow information
        env:
          TZ: Asia/Bangkok
        run: |
          echo "================================================"
          echo "IEAT e-Monitoring Hourly LINE Alert"
          echo "Quota Saver: one summary message per changed run"
          echo "Active schedule: 08:30-16:30 Asia/Bangkok"
          echo "================================================"
          echo "Trigger: ${{ github.event_name }}"
          echo "Thailand time:"
          date
          echo "================================================"

      - name: Validate Python files
        run: |
          test -f "check_emonitoring.py"
          test -f "check_emonitoring_batch.py"
          python -m py_compile check_emonitoring.py
          python -m py_compile check_emonitoring_batch.py
          echo "Python files ผ่านการตรวจ Syntax"

      - name: Run e-Monitoring check and send LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ZONE_ROUTING_ENABLED: ${{ secrets.LINE_ZONE_ROUTING_ENABLED }}
          LINE_GROUP_ID_DEMO_01: ${{ secrets.LINE_GROUP_ID_DEMO_01 }}
          LINE_GROUP_ID_DEMO_02: ${{ secrets.LINE_GROUP_ID_DEMO_02 }}
          LINE_GROUP_ID_DEMO_03: ${{ secrets.LINE_GROUP_ID_DEMO_03 }}
          LINE_PREVIEW_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_mode || false }}
          EMONITORING_RUN_MODE: ${{ github.event_name == 'schedule' && contains(fromJSON('["30,40 9 * * 1-5"]'), github.event.schedule) && 'daily_summary' || 'hourly_alert' }}
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Bangkok
        run: python check_emonitoring_batch.py

      - name: Publish latest status and alert state
        run: |
          if [ ! -f "docs/status.json" ]; then
            echo "ERROR: ไม่พบไฟล์ docs/status.json"
            exit 1
          fi

          if [ ! -f "docs/alert_state.json" ]; then
            echo "ERROR: ไม่พบไฟล์ docs/alert_state.json"
            exit 1
          fi

          if git diff --quiet -- docs/status.json docs/alert_state.json; then
            echo "ข้อมูลสถานการณ์และ alert state ไม่มีการเปลี่ยนแปลง"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # เก็บผลลัพธ์ของรอบนี้ไว้ แล้วนำไปวางบน main ล่าสุดทุกครั้งที่ retry
          cp docs/status.json /tmp/emonitoring-status.json
          cp docs/alert_state.json /tmp/emonitoring-alert-state.json

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/emonitoring-status.json docs/status.json
            cp /tmp/emonitoring-alert-state.json docs/alert_state.json
            git add docs/status.json docs/alert_state.json

            if git diff --cached --quiet; then
              echo "ข้อมูลล่าสุดถูกบันทึกไว้แล้ว"
              exit 0
            fi

            git commit -m "Update e-Monitoring status and alert state [skip ci]"

            if git push origin HEAD:main; then
              echo "บันทึกข้อมูลสถานการณ์และ alert state สำเร็จ"
              exit 0
            fi

            echo "main มีการเปลี่ยนแปลงระหว่าง push — กำลังลองใหม่"
          done

          echo "ERROR: ไม่สามารถบันทึกสถานะหลังลอง 5 ครั้ง"
          exit 1
