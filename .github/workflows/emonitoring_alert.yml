name: e-Monitoring Hourly LINE Report

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions ใช้เวลา UTC: นาทีที่ 17 ของทุกชั่วโมง
    # เท่ากับนาทีที่ 17 ของทุกชั่วโมงในประเทศไทยเช่นกัน
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: emonitoring-hourly-line-report
  cancel-in-progress: false

jobs:
  check-emonitoring:
    name: Check e-Monitoring and Send LINE
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show workflow information
        env:
          TZ: Asia/Bangkok
        run: |
          echo "========================================"
          echo "IEAT e-Monitoring Hourly LINE Report"
          echo "========================================"
          echo "Trigger: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Thailand time:"
          date
          echo "========================================"

      - name: Validate Python file
        run: |
          if [ ! -f "check_emonitoring.py" ]; then
            echo "ERROR: ไม่พบไฟล์ check_emonitoring.py"
            exit 1
          fi
          python -m py_compile check_emonitoring.py
          echo "check_emonitoring.py ผ่านการตรวจ Syntax"

      - name: Check LINE secret
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            echo "ERROR: ไม่พบ Secret ชื่อ LINE_CHANNEL_ACCESS_TOKEN"
            exit 1
          fi
          echo "พบ LINE_CHANNEL_ACCESS_TOKEN แล้ว"

      - name: Send hourly e-Monitoring report
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Bangkok
        run: python check_emonitoring.py
