name: e-Monitoring LINE Alert

on:
  workflow_dispatch:

  schedule:
    # ตรวจทุก 15 นาที
    # GitHub Actions cron ใช้เวลา UTC
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: emonitoring-line-alert
  cancel-in-progress: true

jobs:
  check-emonitoring:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check e-Monitoring and send LINE alert
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python check_emonitoring.py

      - name: Save alert state
        run: |
          if git diff --quiet -- alert_state.json; then
            echo "ไม่มีสถานะที่ต้องบันทึก"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add alert_state.json
          git commit -m "Update e-Monitoring alert state"

          git pull --rebase
          git push
