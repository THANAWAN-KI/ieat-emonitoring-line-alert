name: e-Monitoring Hourly Update and LINE Alert

on:
  workflow_dispatch:
  schedule:
    # อัปเดตข้อมูลหน้าเว็บทุกชั่วโมง (นาทีที่ 17)
    - cron: "17 * * * *"

    # ส่งสรุปกรณีปกติวันละครั้ง เวลา 08:30 น. ประเทศไทย
    # GitHub Actions เป็น UTC จึงเท่ากับ 01:30 UTC
    - cron: "30 1 * * *"

permissions:
  contents: write

concurrency:
  group: emonitoring-hourly-line-report
  cancel-in-progress: false

jobs:
  check-emonitoring:
    name: Check e-Monitoring and Send LINE
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show workflow information
        env:
          TZ: Asia/Bangkok
        run: |
          echo "========================================"
          echo "IEAT e-Monitoring"
          echo "========================================"
          echo "Trigger: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "Thailand time:"
          date
          echo "========================================"

      - name: Validate Python file
        run: |
          if [ ! -f "check_emonitoring.py" ]; then
            echo "ERROR: ไม่พบไฟล์ check_emonitoring.py"
            exit 1
          fi
          python -m py_compile check_emonitoring.py
          echo "check_emonitoring.py ผ่านการตรวจ Syntax"

      - name: Run e-Monitoring check
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Bangkok

          # จะเป็น true เฉพาะรอบ 08:30 น. ประเทศไทย
          SEND_NORMAL_REPORT: ${{ github.event.schedule == '30 1 * * *' }}

        run: python check_emonitoring.py

      - name: Publish latest status data
        run: |
          if git diff --quiet -- docs/status.json; then
            echo "ข้อมูลสถานการณ์ไม่มีการเปลี่ยนแปลง"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json
          git commit -m "Update latest e-Monitoring status [skip ci]"
          git push
