name: e-Monitoring Hourly LINE Alert

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/emonitoring_alert.yml"
      - "check_emonitoring.py"
      - "check_emonitoring_batch.py"

  workflow_dispatch:
    inputs:
      preview_mode:
        description: "ส่ง Flex Card ตัวอย่างสมมติไปยังกลุ่ม Demo ทั้ง 3 กลุ่ม"
        required: false
        type: boolean
        default: false
      run_mode:
        description: "โหมดสำหรับกด Run workflow ทดสอบด้วยตนเอง"
        required: false
        type: choice
        options:
          - hourly_alert
          - daily_summary
        default: hourly_alert

  schedule:
    # จันทร์-ศุกร์ เวลาไทย
    # รอบจริง 08:30-15:30 = 01:30-08:30 UTC
    # เรียกซ้ำที่ :40 และ :50 เพื่อกัน GitHub Scheduler พลาดคิว
    # โค้ดจะบันทึก logical slot และไม่ส่งซ้ำถ้ารอบ :30 สำเร็จแล้ว
    - cron: "30 1-8 * * 1-5"
    - cron: "40 1-8 * * 1-5"
    - cron: "50 1-8 * * 1-5"

    # 16:30 ไทย = 09:30 UTC รายงานสรุปประจำวัน
    # retry 16:40 และ 16:50 เช่นเดียวกัน
    - cron: "30 9 * * 1-5"
    - cron: "40 9 * * 1-5"
    - cron: "50 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: emonitoring-hourly-line-alert
  cancel-in-progress: false

jobs:
  check-emonitoring:
    name: Check e-Monitoring and Send LINE
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show workflow information
        env:
          TZ: Asia/Bangkok
        run: |
          echo "================================================"
          echo "IEAT e-Monitoring LINE Alert"
          echo "08:30-15:30: เรียกข้อมูลและส่งรายชั่วโมง"
          echo "16:30: เรียกข้อมูลและส่งสรุปประจำวัน"
          echo "Retry: :30, :40, :50 แต่ส่งจริงเพียงครั้งเดียวต่อ slot"
          echo "================================================"
          echo "Trigger: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          date

      - name: Validate Python files
        run: |
          test -f "check_emonitoring.py"
          test -f "check_emonitoring_batch.py"
          python -m py_compile check_emonitoring.py
          python -m py_compile check_emonitoring_batch.py

      - name: Validate LINE delivery configuration
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ZONE_ROUTING_ENABLED: ${{ secrets.LINE_ZONE_ROUTING_ENABLED }}
          LINE_GROUP_ID_DEMO_01: ${{ secrets.LINE_GROUP_ID_DEMO_01 }}
          LINE_GROUP_ID_DEMO_02: ${{ secrets.LINE_GROUP_ID_DEMO_02 }}
          LINE_GROUP_ID_DEMO_03: ${{ secrets.LINE_GROUP_ID_DEMO_03 }}
        run: |
          set -euo pipefail
          test -n "${LINE_CHANNEL_ACCESS_TOKEN}" || { echo "ERROR: LINE_CHANNEL_ACCESS_TOKEN ว่าง"; exit 1; }
          test -n "${LINE_GROUP_ID_DEMO_01}" || { echo "ERROR: LINE_GROUP_ID_DEMO_01 ว่าง"; exit 1; }
          test -n "${LINE_GROUP_ID_DEMO_02}" || { echo "ERROR: LINE_GROUP_ID_DEMO_02 ว่าง"; exit 1; }
          test -n "${LINE_GROUP_ID_DEMO_03}" || { echo "ERROR: LINE_GROUP_ID_DEMO_03 ว่าง"; exit 1; }
          case "${LINE_ZONE_ROUTING_ENABLED,,}" in
            1|true|yes|on) ;;
            *) echo "ERROR: LINE_ZONE_ROUTING_ENABLED ต้องเป็น true"; exit 1 ;;
          esac

      - name: Run e-Monitoring check and send LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ZONE_ROUTING_ENABLED: ${{ secrets.LINE_ZONE_ROUTING_ENABLED }}
          LINE_GROUP_ID_DEMO_01: ${{ secrets.LINE_GROUP_ID_DEMO_01 }}
          LINE_GROUP_ID_DEMO_02: ${{ secrets.LINE_GROUP_ID_DEMO_02 }}
          LINE_GROUP_ID_DEMO_03: ${{ secrets.LINE_GROUP_ID_DEMO_03 }}
          LINE_PREVIEW_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_mode || false }}
          EMONITORING_SCHEDULE: ${{ github.event.schedule }}
          EMONITORING_RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode || ((github.event.schedule == '30 9 * * 1-5' || github.event.schedule == '40 9 * * 1-5' || github.event.schedule == '50 9 * * 1-5') && 'daily_summary' || 'hourly_alert') }}
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Bangkok
        run: python check_emonitoring_batch.py

      - name: Publish latest status and scheduler state
        run: |
          if [ ! -f "docs/status.json" ]; then
            echo "ERROR: ไม่พบไฟล์ docs/status.json"
            exit 1
          fi

          if [ ! -f "docs/alert_state.json" ]; then
            echo "ERROR: ไม่พบไฟล์ docs/alert_state.json"
            exit 1
          fi

          # schedule_state.json จะถูกสร้างหลัง scheduled slot ส่ง LINE สำเร็จ
          touch docs/schedule_state.json

          if git diff --quiet -- docs/status.json docs/alert_state.json docs/schedule_state.json; then
            echo "ข้อมูลสถานการณ์และ scheduler state ไม่มีการเปลี่ยนแปลง"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp docs/status.json /tmp/emonitoring-status.json
          cp docs/alert_state.json /tmp/emonitoring-alert-state.json
          cp docs/schedule_state.json /tmp/emonitoring-schedule-state.json

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/emonitoring-status.json docs/status.json
            cp /tmp/emonitoring-alert-state.json docs/alert_state.json
            cp /tmp/emonitoring-schedule-state.json docs/schedule_state.json
            git add docs/status.json docs/alert_state.json docs/schedule_state.json

            if git diff --cached --quiet; then
              echo "ข้อมูลล่าสุดถูกบันทึกไว้แล้ว"
              exit 0
            fi

            git commit -m "Update e-Monitoring status and scheduler state [skip ci]"

            if git push origin HEAD:main; then
              echo "บันทึก scheduler state สำเร็จ"
              exit 0
            fi
          done

          echo "ERROR: ไม่สามารถบันทึกสถานะ"
          exit 1
