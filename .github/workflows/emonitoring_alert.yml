name: e-Monitoring Hourly LINE Alert

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/emonitoring_alert.yml"
      - "check_emonitoring.py"
      - "check_emonitoring_batch.py"

  workflow_dispatch:
    inputs:
      preview_mode:
        description: "ส่ง Flex Card ตัวอย่างสมมติไปยังกลุ่ม Demo ทั้ง 3 กลุ่ม"
        required: false
        type: boolean
        default: false
      run_mode:
        description: "โหมดสำหรับกด Run workflow ทดสอบด้วยตนเอง"
        required: false
        type: choice
        options:
          - hourly_alert
          - daily_summary
        default: hourly_alert

  schedule:
    # เวลาไทย จันทร์-ศุกร์
    # 08:30-15:30 = 01:30-08:30 UTC
    # มี retry :40 และ :50 เพื่อป้องกัน GitHub Scheduler พลาดคิว
    # alert_state จะกันไม่ให้ส่งซ้ำในชั่วโมงเดียวกัน
    - cron: "30 1-8 * * 1-5"
    - cron: "40 1-8 * * 1-5"
    - cron: "50 1-8 * * 1-5"

    # 16:30 ไทย = 09:30 UTC: รายงานสรุปประจำวัน
    # มี retry 16:40 และ 16:50 และ daily_summary_sent_today() กันส่งซ้ำ
    - cron: "30 9 * * 1-5"
    - cron: "40 9 * * 1-5"
    - cron: "50 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: emonitoring-hourly-line-alert
  cancel-in-progress: false

jobs:
  check-emonitoring:
    name: Check e-Monitoring and Send LINE
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show workflow information
        env:
          TZ: Asia/Bangkok
        run: |
          echo "================================================"
          echo "IEAT e-Monitoring Hourly LINE Alert"
          echo "Delivery policy: every hourly slot to all 3 operation groups"
          echo "Active schedule: 08:30-16:30 Asia/Bangkok (Mon-Fri)"
          echo "Retry policy: :30, :40, :50; send only once per slot"
          echo "16:30 slot: daily summary"
          echo "================================================"
          echo "Trigger: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "Thailand time:"
          date
          echo "================================================"

      - name: Validate Python files
        run: |
          test -f "check_emonitoring.py"
          test -f "check_emonitoring_batch.py"
          python -m py_compile check_emonitoring.py
          python -m py_compile check_emonitoring_batch.py
          echo "Python files ผ่านการตรวจ Syntax"

      - name: Validate LINE delivery configuration
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ZONE_ROUTING_ENABLED: ${{ secrets.LINE_ZONE_ROUTING_ENABLED }}
          LINE_GROUP_ID_DEMO_01: ${{ secrets.LINE_GROUP_ID_DEMO_01 }}
          LINE_GROUP_ID_DEMO_02: ${{ secrets.LINE_GROUP_ID_DEMO_02 }}
          LINE_GROUP_ID_DEMO_03: ${{ secrets.LINE_GROUP_ID_DEMO_03 }}
        run: |
          set -euo pipefail
          test -n "${LINE_CHANNEL_ACCESS_TOKEN}" || { echo "ERROR: LINE_CHANNEL_ACCESS_TOKEN ว่าง"; exit 1; }
          test -n "${LINE_GROUP_ID_DEMO_01}" || { echo "ERROR: LINE_GROUP_ID_DEMO_01 ว่าง"; exit 1; }
          test -n "${LINE_GROUP_ID_DEMO_02}" || { echo "ERROR: LINE_GROUP_ID_DEMO_02 ว่าง"; exit 1; }
          test -n "${LINE_GROUP_ID_DEMO_03}" || { echo "ERROR: LINE_GROUP_ID_DEMO_03 ว่าง"; exit 1; }
          case "${LINE_ZONE_ROUTING_ENABLED,,}" in
            1|true|yes|on) ;;
            *) echo "ERROR: LINE_ZONE_ROUTING_ENABLED ต้องเป็น true"; exit 1 ;;
          esac
          echo "ตรวจพบ Token, Group ID ทั้ง 3 กลุ่ม และเปิด Zone routing แล้ว"

      - name: Run e-Monitoring check and send LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ZONE_ROUTING_ENABLED: ${{ secrets.LINE_ZONE_ROUTING_ENABLED }}
          LINE_GROUP_ID_DEMO_01: ${{ secrets.LINE_GROUP_ID_DEMO_01 }}
          LINE_GROUP_ID_DEMO_02: ${{ secrets.LINE_GROUP_ID_DEMO_02 }}
          LINE_GROUP_ID_DEMO_03: ${{ secrets.LINE_GROUP_ID_DEMO_03 }}
          LINE_PREVIEW_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_mode || false }}
          EMONITORING_RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode || ((github.event.schedule == '30 9 * * 1-5' || github.event.schedule == '40 9 * * 1-5' || github.event.schedule == '50 9 * * 1-5') && 'daily_summary' || 'hourly_alert') }}
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Bangkok
        run: python check_emonitoring_batch.py

      - name: Publish latest status and alert state
        run: |
          if [ ! -f "docs/status.json" ]; then
            echo "ERROR: ไม่พบไฟล์ docs/status.json"
            exit 1
          fi

          if [ ! -f "docs/alert_state.json" ]; then
            echo "ERROR: ไม่พบไฟล์ docs/alert_state.json"
            exit 1
          fi

          if git diff --quiet -- docs/status.json docs/alert_state.json; then
            echo "ข้อมูลสถานการณ์และ alert state ไม่มีการเปลี่ยนแปลง"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp docs/status.json /tmp/emonitoring-status.json
          cp docs/alert_state.json /tmp/emonitoring-alert-state.json

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/emonitoring-status.json docs/status.json
            cp /tmp/emonitoring-alert-state.json docs/alert_state.json
            git add docs/status.json docs/alert_state.json

            if git diff --cached --quiet; then
              echo "ข้อมูลล่าสุดถูกบันทึกไว้แล้ว"
              exit 0
            fi

            git commit -m "Update e-Monitoring status and alert state [skip ci]"

            if git push origin HEAD:main; then
              echo "บันทึกข้อมูลสถานการณ์และ alert state สำเร็จ"
              exit 0
            fi

            echo "main มีการเปลี่ยนแปลงระหว่าง push — กำลังลองใหม่"
          done

          echo "ERROR: ไม่สามารถบันทึกสถานะหลังลอง 5 ครั้ง"
          exit 1
