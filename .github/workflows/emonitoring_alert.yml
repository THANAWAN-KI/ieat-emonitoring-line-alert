name: e-Monitoring LINE Alert

on:
  # สามารถกด Run workflow เพื่อทดสอบเองได้
  workflow_dispatch:

  schedule:
    # GitHub Actions ใช้เวลา UTC
    #
    # 01:30 UTC = 08:30 เวลาไทย
    # 02:30 UTC = 09:30 เวลาไทย
    # 03:30 UTC = 10:30 เวลาไทย
    # 04:30 UTC = 11:30 เวลาไทย
    # 05:30 UTC = 12:30 เวลาไทย
    # 06:30 UTC = 13:30 เวลาไทย
    # 07:30 UTC = 14:30 เวลาไทย
    # 08:30 UTC = 15:30 เวลาไทย
    # 09:30 UTC = 16:30 เวลาไทย
    - cron: "30 1-9 * * *"

permissions:
  contents: read

concurrency:
  group: emonitoring-line-alert
  cancel-in-progress: true

jobs:
  check-emonitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ======================================================
      # 1. ดาวน์โหลด Repository
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. ติดตั้ง Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # 3. ตรวจสอบไฟล์
      # ======================================================

      - name: Check required file
        run: |
          echo "ตรวจสอบไฟล์ใน Repository"
          ls -la

          if [ ! -f check_emonitoring.py ]; then
            echo "ERROR: ไม่พบไฟล์ check_emonitoring.py"
            exit 1
          fi

          echo "พบไฟล์ check_emonitoring.py"

      # ======================================================
      # 4. ตรวจ Syntax
      # ======================================================

      - name: Validate Python syntax
        run: |
          python -m py_compile check_emonitoring.py
          echo "Python syntax ถูกต้อง"

      # ======================================================
      # 5. ตรวจ Secrets
      # ======================================================

      - name: Check LINE secrets
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
        run: |
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            echo "ERROR: ไม่พบ Secret ชื่อ LINE_CHANNEL_ACCESS_TOKEN"
            exit 1
          fi

          if [ -z "$LINE_TARGET_ID" ]; then
            echo "ERROR: ไม่พบ Secret ชื่อ LINE_TARGET_ID"
            exit 1
          fi

          echo "พบ LINE_CHANNEL_ACCESS_TOKEN"
          echo "พบ LINE_TARGET_ID"

      # ======================================================
      # 6. ตรวจข้อมูลและส่ง LINE
      # ======================================================

      - name: Check e-Monitoring and send LINE Flex
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
          PYTHONUNBUFFERED: "1"
          TZ: "Asia/Bangkok"
        run: |
          python check_emonitoring.py
