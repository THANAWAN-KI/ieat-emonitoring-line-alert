name: Temporary ThaiWater history export

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-thaiwater-history-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch export script
        run: |
          curl -fsSL "https://raw.githubusercontent.com/thanawan-ki/ieat-emonitoring-line-alert/data-thaiwater-history-2023-2026/scripts/fetch_thaiwater_history_2023_2026.py" -o fetch.py
      - name: Export ThaiWater history
        run: python fetch.py
      - name: Upload export
        uses: actions/upload-artifact@v4
        with:
          name: thaiwater-waterlevel-2023-2026-77stations
          path: output/
          if-no-files-found: error
          retention-days: 7

# retry provincial catalogue
