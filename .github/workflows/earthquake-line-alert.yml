name: แจ้งเตือนแผ่นดินไหวเข้า LINE

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: "ส่งข้อความทดสอบเข้า LINE (ไม่ใช่เหตุการณ์จริง)"
        required: true
        type: boolean
        default: false
      test_message_type:
        description: "รูปแบบข้อความทดสอบ"
        required: true
        type: choice
        options:
          - text
          - flex
        default: text

permissions:
  contents: write

concurrency:
  group: earthquake-line-alert
  cancel-in-progress: false

jobs:
  check-earthquake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ดึงไฟล์จาก repository
        uses: actions/checkout@v4

      - name: ตั้งค่า Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ตรวจข้อมูลและส่ง LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
          SEND_TEST_ALERT: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_alert || false }}
          TEST_MESSAGE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_message_type || 'flex' }}
        run: python scripts/check_earthquake.py

      - name: บันทึกเหตุการณ์ล่าสุดเพื่อป้องกันการแจ้งซ้ำ
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.send_test_alert) }}
        run: |
          if [ -z "$(git status --porcelain -- data/earthquake-state.json)" ]; then
            echo "ไม่มีสถานะที่ต้องบันทึก"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earthquake-state.json
          git commit -m "Update latest earthquake event [skip ci]"
          git push
