name: Refresh POPNIX flood feeds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_popnix.py"
      - ".github/workflows/update-popnix.yml"
  schedule:
    - cron: "*/10 * * * *"
permissions:
  contents: write
concurrency:
  group: refresh-popnix
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_popnix.py
      - name: Save dated public feeds
        run: |
          git add docs/data/popnix_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh POPNIX water data [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
