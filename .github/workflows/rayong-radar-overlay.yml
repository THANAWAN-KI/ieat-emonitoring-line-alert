name: Update Rayong radar overlay
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rayong-radar-overlay
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Build radar overlay
        run: python build_radar_overlay.py
      - name: Save radar overlay
        run: |
          git add docs/data/ryg-rain-overlay.gif
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update Rayong radar overlay'
          git push
