name: Assemble combined daily news hero image

on:
  push:
    paths:
      - ".github/workflows/assemble_daily_video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble optimized hero image
        shell: bash
        run: |
          test -d .image_upload
          cat .image_upload/daily-news-hero.part-* | base64 --decode > docs/assets/daily-news-hero-composite.webp
          test -s docs/assets/daily-news-hero-composite.webp
      - name: Commit hero image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/daily-news-hero-composite.webp
          git rm -r .image_upload
          git commit -m "Add combined daily news hero image"
          git push
