name: Update Google Flood Status Thailand
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: google-flood-status
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch latest flood status
        env:
          FLOODS_API_KEY: ${{ secrets.FLOODS_API_KEY }}
        run: python flood_status_to_geojson.py
      - name: Commit changed GeoJSON
        run: |
          git add data/google_flood_status_th.geojson
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update Google flood forecast status'
          git push
