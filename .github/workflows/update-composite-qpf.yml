name: Update nationwide radar at 13:00 Thailand time

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-composite-qpf.yml"
      - "scripts/update_composite_qpf.py"
  schedule:
    # 06:00 UTC = 13:00 Thailand. Check promptly, then retry while TMD publishes.
    - cron: "0,10,20,35,50 6 * * *"
    - cron: "10,40 7 * * *"
    - cron: "10,40 8 * * *"

permissions:
  contents: write

concurrency:
  group: nationwide-composite-qpf
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download today's 13:00 radar image
        run: python scripts/update_composite_qpf.py
      - name: Publish image and source time
        run: |
          git add docs/assets/composite-qpf-1300.gif docs/data/composite-qpf.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update nationwide radar image at 13:00 Thailand time"
          git pull --rebase
          git push
