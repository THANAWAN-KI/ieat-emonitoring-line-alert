name: Update factory equipment data
on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_factory_equipment.py"
      - ".github/workflows/update-factory-equipment.yml"
  workflow_dispatch:
  schedule:
    - cron: "35 * * * *"
permissions:
  contents: write
concurrency:
  group: factory-equipment-sync
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch factory equipment
        run: python scripts/fetch_factory_equipment.py
      - name: Save refreshed equipment data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data/equipment_meta.json
          if [ -f docs/data/equipment_latest.json ]; then
            git add -- docs/data/equipment_latest.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh factory equipment data [skip ci]"
          git pull --rebase origin main
          git push
