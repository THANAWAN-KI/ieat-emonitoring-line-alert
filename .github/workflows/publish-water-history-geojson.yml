name: Publish historical water GeoJSON

on:
  push:
    branches: [main]
    paths:
      - scripts/export_water_history_geojson.py
      - .github/workflows/publish-water-history-geojson.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/export_water_history_geojson.py
      - name: Commit GeoJSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/exports/thaiwater_waterlevel_history_2023_2026.geojson
          git diff --cached --quiet && exit 0
          git commit -m "Publish historical water level GeoJSON"
          git pull --rebase origin main
          git push
