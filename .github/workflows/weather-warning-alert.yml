name: แจ้งเตือนภัยสภาพอากาศสำหรับนิคมผ่าน LINE

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: "ส่งข้อความทดสอบเข้า LINE"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weather-warning-line-alert
  cancel-in-progress: false

jobs:
  check-weather-warning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ดาวน์โหลดโค้ด
        uses: actions/checkout@v4

      - name: ตั้งค่า Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ตรวจประกาศภัยและส่ง LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
          SEND_TEST_ALERT: ${{ inputs.send_test_alert == true && 'true' || 'false' }}
        run: python scripts/check_weather_warning.py

      - name: บันทึกประกาศล่าสุดเพื่อป้องกันการส่งซ้ำ
        if: ${{ inputs.send_test_alert != true }}
        run: |
          if git diff --quiet -- data/weather-warning-state.json; then
            echo "ไม่มีสถานะใหม่ที่ต้องบันทึก"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather-warning-state.json
          git commit -m "Update weather warning alert state"
          git push
